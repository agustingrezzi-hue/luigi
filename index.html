      + '<select data-i="'+i+'" data-k="tam"><option'+(l.tam==='Mediana'?' selected':'')+'>Mediana</option>'
      + '<option'+(l.tam==='Grande'?' selected':'')+'>Grande</option></select></div>'
      + '<div style="display:flex;align-items:center;gap:6px">'
      + '<div class="mas"><button data-fi="'+i+'" data-d="-1">−</button><span class="n">'+l.cant+'</span>'
      + '<button data-fi="'+i+'" data-d="1">+</button></div>'
      + '<button class="borrar" data-fdel="'+i+'">×</button></div></div>').join('')
    + '<button class="agregar" id="add-foc">+ Agregar focaccia</button></div>'

    + '<div class="card"><div class="rot">Entrega</div>'
    + '<div class="switch"><div><div class="t" style="font-weight:600">Con envío</div>'
    + '<div class="p" style="font-size:11.5px;color:var(--ink-3)">'+pesos(REGLA.envio)+'</div></div>'
    + '<button class="sw" id="sw-envio" aria-pressed="'+nuevo.conEnvio+'"></button></div>'
    + (nuevo.conEnvio ? (dirs.length ? '<div style="margin-top:11px">'
        + '<label class="f">¿A qué dirección?</label>'
        + '<select id="n-dir">'+dirs.map(d=>'<option'+(nuevo.direccion===d?' selected':'')+'>'+esc(d)+'</option>').join('')

      : '<div style="margin-top:11px"><label class="f">Dirección</label>'

    + '<button data-nm="manual" aria-pressed="'+(!nuevo.sinCargo && !!nuevo.totalManual)+'">Otro monto</button>'
    + '<button data-nm="sin" aria-pressed="'+nuevo.sinCargo+'">Sin cargo</button></div>'

       : '<div><label class="f" for="n-monto">Total a cobrar</label>'

         + '<p class="hint">Dejalo vacío para cobrar el precio de lista.</p></div>')+'</div>'

    + '<div class="card"><label class="f" for="n-obs">Observaciones</label>'

    + '<button class="guardar" id="guardar"'+(puedeGuardar()?'':' disabled')+'>Guardar pedido</button>'
    + '<p class="hint" style="text-align:center;margin-bottom:18px">Se suma a la semana del '+rotuloSemana(nuevo.semana)+'</p>';

  $('#n-semana').onchange = e => { nuevo.semana = e.target.value; vistaNuevo(); };
  $('#cli').oninput = e => { nuevo.cliente = null; sugerir(e.target.value); };
  $('#v-nuevo').querySelectorAll('[data-sku]').forEach(b => b.onclick = () => {
    const k = b.dataset.sku;
    nuevo.items[k] = Math.max(0, (nuevo.items[k]||0) + Number(b.dataset.d));
    vistaNuevo(); });

    vistaNuevo(); };

  $('#v-nuevo').querySelectorAll('[data-fi]').forEach(b => b.onclick = () => {

    l.cant = Math.max(1, l.cant + Number(b.dataset.d)); vistaNuevo(); });
  $('#v-nuevo').querySelectorAll('[data-fdel]').forEach(b => b.onclick = () => {
    nuevo.focaccias.splice(+b.dataset.fdel,1); vistaNuevo(); });
  $('#sw-envio').onclick = () => { nuevo.conEnvio = !nuevo.conEnvio;
    if (nuevo.conEnvio && !nuevo.direccion && dirs.length) nuevo.direccion = dirs[0];
    vistaNuevo(); };
  if ($('#n-dir')) $('#n-dir').onchange = e => { nuevo.direccion = e.target.value; vistaNuevo(); };
  if ($('#n-dir-otra')) $('#n-dir-otra').oninput = e => { nuevo.dirOtra = e.target.value; };
  if ($('#n-dir-libre')) $('#n-dir-libre').oninput = e => { nuevo.direccion = e.target.value; };
  $('#n-pago').onchange = e => { nuevo.formaPago = e.target.value; };

    const m = b.dataset.nm;
    nuevo.sinCargo = m==='sin';
    if (m!=='manual') nuevo.totalManual = '';
    vistaNuevo();
    if (m==='manual' && $('#n-monto')) $('#n-monto').focus(); });
  if ($('#n-monto')) $('#n-monto').oninput = e => {
    nuevo.totalManual = e.target.value;
    $('.total .v').textContent = pesos(totalNuevo()); };
  $('#n-obs').oninput = e => { nuevo.obs = e.target.value; };
  $('#guardar').onclick = guardarPedido;
  if (document.activeElement === document.body && $('#cli').value) sugerir($('#cli').value);

function sugerir(q){
  const t = (q||'').toLowerCase();
  const lista = S.clientes.filter(c => c.nombre.toLowerCase().indexOf(t) >= 0).slice(0,4);
  const existe = lista.some(c => c.nombre.toLowerCase() === t);
  $('#sug').innerHTML = lista.map(c=>'<button data-id="'+c.id+'">'+esc(c.nombre)+'</button>').join('')
    + (q && !existe ? '<button data-nuevo="'+esc(q)+'" style="background:var(--ok-soft);color:var(--ok)">+ '+esc(q)+' (nuevo)</button>' : '');
  $('#sug').querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    nuevo.cliente = S.clientes.find(c=>c.id===b.dataset.id);
    nuevo.direccion = nuevo.cliente.direccion1 || '';
    vistaNuevo(); });
  $('#sug').querySelectorAll('[data-nuevo]').forEach(b => b.onclick = async () => {
    const id = nuevoId('CL');
    const c = {nombre:b.dataset.nuevo, tipo:'Particular', telefono:'', zona:'',
               direccion1:'', direccion2:'', notas:'alta desde el panel'};
    await guardar('clientes/'+id, c);
    nuevo.cliente = Object.assign({id}, c); nuevo.direccion = '';
    vistaNuevo(); toast('Cliente creado'); });
}
function lineasNuevo(){
  const pg = precioGr(), out = [];
  for (const sku in nuevo.items) if (nuevo.items[sku] > 0)
    out.push({sku, cantidad:nuevo.items[sku], precioUnit:productoDe(sku).precio,
              costoUnit:costoSku(sku,pg)});
  nuevo.focaccias.forEach(l => {
    const p = S.productos.find(x=>x.tipo==='Focaccia' && x.nombre==='Focaccia '+l.sabor
                               && x.tamano===l.tam);
    if (p) out.push({sku:p.sku, cantidad:l.cant, precioUnit:p.precio,
                     costoUnit:costoSku(p.sku,pg)});
  });
  return out;
}
const brutoNuevo = () => lineasNuevo().reduce((a,l)=>a+l.cantidad*l.precioUnit, 0)
  + (nuevo.conEnvio ? REGLA.envio : 0);
function totalNuevo(){
  if (nuevo.sinCargo) return 0;
  if (nuevo.totalManual !== '' && nuevo.totalManual != null) return Number(nuevo.totalManual)||0;
  return brutoNuevo();
}
const puedeGuardar = () => !!nuevo.cliente && lineasNuevo().length > 0;

async function guardarPedido(){
  const dir = nuevo.direccion === '__otra__' ? nuevo.dirOtra : nuevo.direccion;
  const id = nuevoId('P');
  const lineas = lineasNuevo();
  await guardar('pedidos/'+id, {
    tanda:nuevo.semana, clienteId:nuevo.cliente.id, cliente:nuevo.cliente.nombre,
    envio: nuevo.conEnvio ? REGLA.envio : 0, direccion: nuevo.conEnvio ? dir : '',
    formaPago:nuevo.formaPago, observaciones:nuevo.obs, lineas,
    sinCargo: !!nuevo.sinCargo,
    totalManual: (!nuevo.sinCargo && nuevo.totalManual !== '' && nuevo.totalManual != null)
                 ? Number(nuevo.totalManual) : null,
    preparado:false, entregado:false, cobrado:false, creado:new Date().toISOString()});
  const impares = lineas.filter(l=>productoDe(l.sku).tipo==='Prepizza')
                    .reduce((a,l)=>a+l.cantidad,0) % 2;
  S.semanaSel = nuevo.semana;
  nuevo.cliente = null; nuevo.items = {}; nuevo.focaccias = []; nuevo.obs = '';
  nuevo.direccion = ''; nuevo.dirOtra = ''; nuevo.formaPago = '';
  nuevo.sinCargo = false; nuevo.totalManual = '';
  irA('pedidos');
  toast(impares ? 'Guardado · prepizzas impares' : 'Pedido guardado');
}

  const sel = ins[ui.compraSel] || {};

    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))).slice(0,10);

    '<div class="card"><div class="rot">Mover stock</div>'
    + '<div class="seg"><button data-sg="1" aria-pressed="'+(ui.compraSigno>0)+'">Entra (compra)</button>'
    + '<button data-sg="-1" aria-pressed="'+(ui.compraSigno<0)+'">Sale (corrección)</button></div>'
    + '<div class="compra">'
    + '<select id="s-insumo">'+GRUPOS.map((g,gi)=>{
        const dentro = ins.map((i,n)=>({i,n})).filter(x=>x.i.__g===gi);

          '<option value="'+x.n+'"'+(x.n===ui.compraSel?' selected':'')+'>'+esc(x.i.nombre)+'</option>').join('')+'</optgroup>' : '';
      }).join('')+'</select>'

    + '<span class="n">'+ui.compraCant+'</span><button id="s-mas">+</button></div></div>'
    + '<p class="hint" style="margin:0 0 12px">'+(ui.compraSigno>0?'Suma':'Descuenta')+' '
    + ui.compraCant+' × '+esc(sel.unidad_compra||'')+' = '+gr((sel.contenido_gr||0)*ui.compraCant)+'</p>'
    + '<button class="guardar" id="s-cargar">'+(ui.compraSigno>0?'Sumar al stock':'Descontar del stock')+'</button></div>'

    + '<div class="card tight"><div class="rot" style="padding:16px 16px 0">Stock actual</div>'
    + ins.map((i,n) => {
        const cab = (n===0 || ins[n-1].__g !== i.__g)
          ? '<div class="grupo">'+GRUPOS[i.__g]+'</div>' : '';
        const tiene = stockDe(i.nombre), usa = c.consumo[i.nombre]||0;
        const tandas = usa ? tiene/usa : Infinity;
        const clase = (!usa || !tiene) ? '' : tandas<1 ? 'falta' : tandas<2 ? 'justo' : '';
        const editando = ui.editaPrecio === i.id;
        return cab + '<div class="st '+clase+'">'
          + '<div class="lin"><span class="n">'+esc(i.nombre)+'</span><span class="q">'+gr(tiene)+'</span></div>'
          + '<div class="bar"><i style="width:'+Math.max(0,Math.min(100, tiene/((i.contenido_gr||1)*1.2)*100))+'%"></i></div>'
          + '<div class="d"><span>'+(!tiene ? 'stock sin cargar'
              : usa ? 'esta tanda usa '+gr(usa)+' · '+(tandas<1?'NO ALCANZA':'te quedan '+Math.floor(tandas)+(Math.floor(tandas)===1?' tanda':' tandas'))
              : 'no entra en las masas')+'</span>'
          + '<button class="precio" data-precio="'+i.id+'">'+pesos(i.precio_compra)+' / '+esc(i.unidad_compra)+'</button></div>'
          + (editando?'<div class="edit-precio">'
            + '<input type="number" id="np-'+i.id+'" value="'+i.precio_compra+'" step="10" aria-label="precio">'
            + '<button data-save="'+i.id+'">Precio</button></div>'
            + '<div class="edit-precio">'
            + '<input type="number" id="ns-'+i.id+'" value="'+Math.round(tiene)+'" step="10" aria-label="stock en gramos">'
            + '<button data-fix="'+i.id+'">Corregir stock (g)</button></div>'
            + '<p class="hint">Cambiar el precio recalcula los costos de todos los productos. '
            + 'Corregir el stock anota la diferencia como ajuste.</p>':'')
          + '</div>';}).join('')+'</div>'

    + '<div class="card tight"><div class="rot" style="padding:16px 16px 0">Últimos movimientos</div>'
    + (movs.length ? movs.map(m => {
        const g = Number(m.gramos)||0;
        return '<div class="mov"><div>'+esc(m.insumo)+'<div class="s">'+esc(m.origen||'')
          + (m.fecha?' · '+String(m.fecha).slice(8,10)+'/'+String(m.fecha).slice(5,7):'')+'</div></div>'
          + '<div class="q '+(g<0?'neg':'pos')+'">'+(g>0?'+':'')+gr(g)+'</div>'
          + '<button class="borrar" data-mdel="'+m.id+'" title="Deshacer">×</button></div>';

  $('#v-stock').querySelectorAll('[data-sg]').forEach(b => b.onclick = () => {

  $('#s-menos').onclick = () => { ui.compraCant = Math.max(1, ui.compraCant-1); vistaStock(); };
  $('#s-mas').onclick = () => { ui.compraCant++; vistaStock(); };
  $('#s-cargar').onclick = async () => {
    const i = ins[ui.compraSel];
    await guardar('movimientos/'+nuevoId('M'), {insumo:i.nombre,
      gramos:(i.contenido_gr||0)*ui.compraCant*ui.compraSigno,
      origen: ui.compraSigno>0 ? 'compra' : 'salida manual', fecha:new Date().toISOString()});
    ui.compraCant = 1; toast(ui.compraSigno>0?'Compra cargada':'Stock descontado'); };
  $('#v-stock').querySelectorAll('[data-precio]').forEach(b => b.onclick = () => {
    ui.editaPrecio = ui.editaPrecio === b.dataset.precio ? null : b.dataset.precio; vistaStock(); });
  $('#v-stock').querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const v = Number($('#np-'+b.dataset.save).value);
    if (!(v > 0)) return toast('Poné un precio válido');
    ui.editaPrecio = null;
    await parchar('insumos/'+b.dataset.save, {precio_compra:v});
    toast('Precio actualizado'); });
  $('#v-stock').querySelectorAll('[data-fix]').forEach(b => b.onclick = async () => {
    const i = S.insumos.find(x=>x.id===b.dataset.fix);
    const v = Number($('#ns-'+b.dataset.fix).value);
    if (isNaN(v) || v < 0) return toast('Poné una cantidad válida');
    const dif = v - stockDe(i.nombre);
    if (!dif) { ui.editaPrecio = null; return vistaStock(); }
    ui.editaPrecio = null;
    await guardar('movimientos/'+nuevoId('M'), {insumo:i.nombre, gramos:dif,
      origen:'ajuste', fecha:new Date().toISOString()});
    toast('Stock corregido'); });
  $('#v-stock').querySelectorAll('[data-mdel]').forEach(b => b.onclick = async () => {
    await borrar('movimientos/'+b.dataset.mdel); toast('Movimiento deshecho'); });
}

/* lo que quedó de las planillas viejas, guardado en la ficha del cliente */
function hist(c){
  const m = /(\d+)\s*pedidos?\s*·\s*(\d+)\s*prepizzas?\s*·\s*última\s*(\d{4})-(\d{2})/
    .exec(c.historico||'');
  return m ? {pedidos:+m[1], prepizzas:+m[2], ultima:m[3]+'-'+m[4]} : null;
}
function mesCorto(am){
  const p = String(am).split('-');
  return MES3[Number(p[1])-1].toLowerCase()+' '+p[0].slice(2);
}
function dormido(am){
  const d = new Date(); d.setMonth(d.getMonth()-3);
  return am < d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
}
const iniciales = n => String(n||'?').split(' ').filter(Boolean)
  .map(w=>w[0]).slice(0,2).join('').toUpperCase();

/* ------------------------------ ESTADÍSTICAS ------------------------------ */
function vistaStats(){
  if (!S.listo) return $('#v-stats').innerHTML = esperando();
  const hoy = semanaHoy();
  const semanas = [];
  S.pedidos.forEach(p => { const s = lunesDe(p.tanda); if (semanas.indexOf(s)<0) semanas.push(s); });
  semanas.sort();
  const hechas = semanas.filter(s => s <= hoy);

  let venta=0, costo=0, unidades=0, pedidos=0, bollos=0, sinCargo=0, bonif=0, pendiente=0;
  const porCliente = {}, porSku = {}, porSemana = {}, ultimaDe = {};
  S.pedidos.forEach(p => {
    const s = lunesDe(p.tanda);
    if (s > hoy) return;                         // las futuras no son resultado todavía
    const t = totalDe(p), br = brutoDe(p), co = costoDe(p);
    venta += t; costo += co; pedidos++; bonif += br - t;
    if (p.sinCargo) sinCargo++;
    if (!p.cobrado) pendiente += t;
    porSemana[s] = porSemana[s] || {venta:0, costo:0, un:0};
    porSemana[s].venta += t; porSemana[s].costo += co;
    porCliente[p.cliente] = (porCliente[p.cliente]||0) + t;
    if (!ultimaDe[p.cliente] || s > ultimaDe[p.cliente]) ultimaDe[p.cliente] = s;
    (p.lineas||[]).forEach(l => {
      unidades += l.cantidad; porSemana[s].un += l.cantidad;
      porSku[l.sku] = (porSku[l.sku]||0) + l.cantidad;
      bollos += l.cantidad * lugarDe(productoDe(l.sku));
    });
  });
  const ganancia = venta - costo;
  const margen = venta ? ganancia/venta : 0;
  const ticket = pedidos ? venta/pedidos : 0;

  if (!pedidos){
    $('#v-stats').innerHTML = '<div class="card"><div class="vacio">'
      + 'Todavía no hay tandas cargadas en el panel.<br>Apenas cargues la primera, acá vas a ver '
      + 'cuánto vendiste, cuánto ganaste, quiénes son tus mejores clientes y qué producto tira más.'
      + '</div></div>' + bloquePrevio();
    conectarTooltips($('#v-stats'));
    return;
  }

  /* --- columnas apiladas: últimas 8 semanas --- */
  const ultimas = hechas.slice(-8);
  const maxCol = Math.max.apply(null, ultimas.map(s => (porSemana[s]||{venta:0}).venta).concat([1]));
  const cols = ultimas.map(s => {
    const d = porSemana[s] || {venta:0, costo:0};
    const hG = Math.max(0, (d.venta-d.costo))/maxCol*100, hC = d.costo/maxCol*100;
    return '<div class="col" data-tt="'+esc(rotuloSemana(s))+' · vendiste '+pesos(d.venta)
      + ', ganaste '+pesos(d.venta-d.costo)+'">'
      + '<span class="val">'+pesosK(d.venta)+'</span>'
      + '<div class="pila" style="height:'+(hG+hC)+'%">'
      + '<div class="seg-g" style="flex:'+Math.max(hG,0.01)+'"></div>'
      + '<div class="seg-c'+(hG<=0?' solo':'')+'" style="flex:'+Math.max(hC,0.01)+'"></div></div></div>';
  }).join('');
  const ejes = ultimas.map(s => '<span class="'+(s===hoy?'hoy':'')+'">'
    + rotuloSemana(s).split(' ')[0]+'/'+MES3[deIso(s).getMonth()].slice(0,1)+MES3[deIso(s).getMonth()].slice(1,3).toLowerCase()
    + '</span>').join('');

  /* --- top clientes --- */
  const top = Object.keys(porCliente).sort((a,b)=>porCliente[b]-porCliente[a]).slice(0,8);
  const maxCli = porCliente[top[0]] || 1;
  const barrasCli = top.map(n => '<div class="hb" data-tt="'+esc(n)+' · '+pesos(porCliente[n])
      + ' ('+Math.round(porCliente[n]/venta*100)+'% del total)">'
    + '<div class="lin"><span>'+esc(n)+'</span><b>'+pesos(porCliente[n])+'</b></div>'
    + '<div class="pista"><i style="width:'+(porCliente[n]/maxCli*100)+'%"></i></div></div>').join('');
  const conc = top.slice(0,3).reduce((a,n)=>a+porCliente[n],0)/venta;

  /* --- mix de productos --- */
  const skus = Object.keys(porSku).sort((a,b)=>porSku[b]-porSku[a]);
  const maxSku = porSku[skus[0]] || 1;
  const barrasSku = skus.map(s => {
    const p = productoDe(s), esPre = p.tipo==='Prepizza';
    return '<div class="hb '+(esPre?'pre':'foc')+'" data-tt="'+esc(p.nombre||s)+' · '+porSku[s]+' unidades">'
      + '<div class="lin"><span>'+esc(p.nombre||s)+' '+(esPre?'':badgeTam(p))+'</span><b>'+porSku[s]+'</b></div>'
      + '<div class="pista"><i style="width:'+(porSku[s]/maxSku*100)+'%"></i></div></div>';
  }).join('');

  /* --- dormidos --- */
  const limite = suma(hoy, -56);
  const dormidos = Object.keys(ultimaDe).filter(n => ultimaDe[n] < limite)
    .sort((a,b)=>porCliente[b]-porCliente[a]).slice(0,8);

  /* --- insumos que más pesan --- */
  const pg = precioGr(), pesoIns = {};
  S.pedidos.forEach(p => { if (lunesDe(p.tanda) > hoy) return;
    (p.lineas||[]).forEach(l => {
      const prod = productoDe(l.sku), esPre = prod.tipo === 'Prepizza';
      const porKg = esPre ? rindePre() : (prod.tamano==='Grande'?rindeGra():rindeMed());
      const rec = esPre ? receta('masa_prepizza') : receta('masa_focaccia');
      for (const k in rec) if (k!=='Agua') pesoIns[k] = (pesoIns[k]||0) + rec[k]/porKg*(pg[k]||0)*l.cantidad;
      const pu = receta('por_unidad');
      for (const k in pu) pesoIns[k] = (pesoIns[k]||0) + pu[k]*(pg[k]||0)*l.cantidad;
      const t = topping(l.sku);
      for (const k in t) pesoIns[k] = (pesoIns[k]||0) + t[k]*(pg[k]||0)*l.cantidad;
    }); });
  const insTop = Object.keys(pesoIns).sort((a,b)=>pesoIns[b]-pesoIns[a]).slice(0,6);

  $('#v-stats').innerHTML =
    '<div class="hero"><div class="l">Vendido en '+hechas.length+' tanda'+(hechas.length===1?'':'s')+'</div>'
    + '<div class="v">'+pesos(venta)+'</div>'
    + '<div class="p">Ganancia '+pesos(ganancia)+' · margen '+Math.round(margen*100)+'%</div></div>'

    + '<div class="tiles">'
    + '<div class="tile"><div class="l">Unidades hechas</div><div class="v">'+unidades+'</div><div class="p">'+bollos+' bollos</div></div>'
    + '<div class="tile"><div class="l">Pedidos</div><div class="v">'+pedidos+'</div><div class="p">'+(hechas.length?(pedidos/hechas.length).toFixed(1).replace('.',','):0)+' por tanda</div></div>'
    + '<div class="tile plata"><div class="l">Ticket promedio</div><div class="v">'+pesos(ticket)+'</div></div>'
    + '<div class="tile"><div class="l">Capacidad usada</div><div class="v">'
    + (hechas.length?Math.round(bollos/hechas.length/REGLA.capacidadBollos*100):0)+'%</div>'
    + '<div class="p">'+(hechas.length?Math.round(bollos/hechas.length):0)+' bollos por tanda</div></div>'
    + (pendiente?'<div class="tile pend ancho"><div class="l">Falta cobrar (histórico)</div><div class="v">'+pesos(pendiente)+'</div></div>':'')
    + (bonif?'<div class="tile ancho"><div class="l">Regalado y bonificado</div><div class="v">'+pesos(bonif)+'</div><div class="p">'+sinCargo+' pedido'+(sinCargo===1?'':'s')+' sin cargo</div></div>':'')
    + '</div>'

    + '<div class="card"><div class="rot">Cada tanda, en plata</div>'
    + '<div class="leyenda"><span><i style="background:var(--c-gan)"></i>Ganancia</span>'
    + '<span><i style="background:var(--c-cos)"></i>Costo de insumos</span></div>'
    + '<div class="chart"><div class="cols">'+cols+'</div><div class="ejes">'+ejes+'</div></div>'
    + '<p class="hint">La altura es lo que facturaste; el verde es lo que te quedó.</p></div>'

    + '<div class="card"><div class="rot">Quién te compra</div>'+barrasCli
    + '<p class="hint">Los tres primeros son el '+Math.round(conc*100)+'% de tu facturación. '
    + (conc>0.5?'Es mucha dependencia de pocos: vale la pena ensanchar la base.':'La base está razonablemente repartida.')+'</p></div>'

    + '<div class="card"><div class="rot">Qué se vende</div>'
    + '<div class="leyenda"><span><i style="background:var(--c-pre)"></i>Prepizzas</span>'
    + '<span><i style="background:var(--c-foc)"></i>Focaccias</span></div>'+barrasSku+'</div>'

    + '<div class="card"><div class="rot">A dónde se va la plata</div>'
    + '<table class="tabla"><thead><tr><th>Insumo</th><th style="text-align:right">Gastado</th><th style="text-align:right">Del costo</th></tr></thead><tbody>'
    + insTop.map(k=>'<tr><td>'+esc(k)+'</td><td class="num">'+pesos(pesoIns[k])+'</td>'
      + '<td class="num">'+Math.round(pesoIns[k]/costo*100)+'%</td></tr>').join('')
    + '</tbody></table></div>'

    + (dormidos.length ? '<div class="card"><div class="rot">Clientes dormidos</div>'
      + '<p class="hint" style="margin:0 0 10px">Sin pedidos hace más de 8 semanas. Un mensaje suele alcanzar.</p>'
      + '<table class="tabla"><thead><tr><th>Cliente</th><th style="text-align:right">Último</th><th style="text-align:right">Te dejó</th></tr></thead><tbody>'
      + dormidos.map(n=>'<tr><td>'+esc(n)+'</td><td class="num">'+rotuloSemana(ultimaDe[n])+'</td>'
        + '<td class="num">'+pesos(porCliente[n])+'</td></tr>').join('')
      + '</tbody></table></div>' : '')
    + bloquePrevio()
    + '<div style="height:20px"></div>';

  conectarTooltips($('#v-stats'));
}

/* lo que traen las planillas de enero a septiembre, antes del panel */
function bloquePrevio(){
  const con = S.clientes.map(c => ({c, h:hist(c)})).filter(x => x.h && x.h.pedidos);
  if (!con.length) return '';
  const totPed = con.reduce((a,x)=>a+x.h.pedidos, 0);
  const totPre = con.reduce((a,x)=>a+x.h.prepizzas, 0);
  const top = con.slice().sort((a,b)=>b.h.prepizzas-a.h.prepizzas).slice(0,8);
  const maxT = top[0].h.prepizzas || 1;
  const durmiendo = con.filter(x => dormido(x.h.ultima))
    .sort((a,b)=>b.h.prepizzas-a.h.prepizzas);
  const fieles = con.filter(x => x.h.pedidos >= 3).length;
  return '<div class="card"><div class="rot">Antes del panel · enero a septiembre</div>'
    + '<p class="hint" style="margin:0 0 12px">Viene de las planillas viejas. Son pedidos y unidades '
    + 'reales; la plata no está porque los precios cambiaron durante el año.</p>'
    + '<div class="tiles" style="margin-bottom:14px">'
    + '<div class="tile"><div class="l">Pedidos</div><div class="v">'+totPed+'</div>'
    + '<div class="p">'+con.length+' clientes</div></div>'
    + '<div class="tile"><div class="l">Prepizzas</div><div class="v">'+totPre.toLocaleString('es-AR')+'</div>'
    + '<div class="p">'+fieles+' clientes con 3 o más pedidos</div></div></div>'
    + '<div class="rot">Los que más te compraron</div>'
    + top.map(x=>'<div class="hb pre" data-tt="'+esc(x.c.nombre)+' · '+x.h.prepizzas
        +' prepizzas en '+plu(x.h.pedidos,'pedido','pedidos')+'">'
      + '<div class="lin"><span>'+esc(x.c.nombre)+'</span><b>'+x.h.prepizzas+'</b></div>'
      + '<div class="pista"><i style="width:'+(x.h.prepizzas/maxT*100)+'%"></i></div></div>').join('')
    + (durmiendo.length ? '<div class="rot" style="margin-top:16px">Dormidos hace más de 3 meses</div>'
      + '<table class="tabla"><thead><tr><th>Cliente</th><th style="text-align:right">Pedidos</th>'
      + '<th style="text-align:right">Último</th></tr></thead><tbody>'
      + durmiendo.slice(0,12).map(x=>'<tr><td>'+esc(x.c.nombre)+'</td>'
        + '<td class="num">'+x.h.pedidos+'</td><td class="num">'+mesCorto(x.h.ultima)+'</td></tr>').join('')
      + '</tbody></table>'
      + (durmiendo.length>12?'<p class="hint">Y '+(durmiendo.length-12)+' más.</p>':'') : '')
    + '</div>';
}

/* ------------------------------ tooltips ------------------------------ */
function conectarTooltips(raiz){
  const tt = $('#tt');
  raiz.querySelectorAll('[data-tt]').forEach(el => {
    const mostrar = e => {
      tt.textContent = el.dataset.tt; tt.classList.add('on');
      const x = (e.touches ? e.touches[0].clientX : e.clientX);
      const y = (e.touches ? e.touches[0].clientY : e.clientY);
      const w = tt.offsetWidth;
      tt.style.left = Math.max(8, Math.min(window.innerWidth-w-8, x-w/2))+'px';
      tt.style.top = Math.max(8, y-40)+'px';
    };
    el.addEventListener('mouseenter', mostrar);
    el.addEventListener('mousemove', mostrar);
    el.addEventListener('touchstart', mostrar, {passive:true});
    el.addEventListener('mouseleave', ()=>tt.classList.remove('on'));
    el.addEventListener('touchend', ()=>setTimeout(()=>tt.classList.remove('on'), 1400));
  });
}

/* ------------------------------ navegación ------------------------------ */
const hueso = (an, cl) => '<div class="hueso'+(cl?' '+cl:'')+'" style="width:'+an+'"></div>';
const esqueleto = () =>
  '<div class="esq">' + hueso('42%','titulo') + hueso('88%') + hueso('64%') + hueso('74%') + '</div>'
  + '<div class="esq-tiles"><div class="esq">'+hueso('58%','titulo')+hueso('80%','alto')+'</div>'
  + '<div class="esq">'+hueso('52%','titulo')+hueso('80%','alto')+'</div></div>'
  + '<div class="esq">' + hueso('36%','titulo') + hueso('92%') + hueso('70%') + hueso('80%')
  + hueso('58%') + '</div>';
const esperando = () => S.error !== 'sin-db'
  ? esqueleto()
  : API.activo
    ? '<div class="card"><div class="vacio">No pude traer los datos.<br>'
      + 'Fijate que tengas señal y volvé a entrar.'
      + (API.motivo ? '<div class="motivo">' + esc(API.motivo) + '</div>' : '')
      + '<button class="mini" id="reintentar" style="margin-top:14px">Reintentar</button>'
      + '</div></div>'
    : '<div class="card"><div class="vacio">No puedo conectarme a la base de datos de este panel. Probá recargar; si sigue igual, avisame.</div></div>';

function engancharReintento(){
  const b = document.getElementById('reintentar');
  if (b) b.onclick = () => { API.falla = 0; API.motivo = ''; cargarTodo(); };
}

/* Volver a la app tiene que ser volver a donde estabas, no empezar de nuevo. */
function recordarPantalla(){
  const v = leeLocal('vl_vista');
  if (v && v !== 'nuevo' && document.getElementById('v-'+v)){
    S.vista = v;
    document.querySelectorAll('.vista').forEach(x => x.classList.toggle('on', x.id === 'v-'+v));
    document.querySelectorAll('#nav button').forEach(b =>
      b.setAttribute('aria-current', String(b.dataset.v === v)));
  }
  const sem = leeLocal('vl_semana');
  if (sem && semanasVisibles().indexOf(sem) >= 0) S.semanaSel = sem;
}

function irA(v){
  S.vista = v;
  guardaLocal('vl_vista', v);
  document.querySelectorAll('.vista').forEach(s => s.classList.toggle('on', s.id === 'v-'+v));
  document.querySelectorAll('#nav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.v === v)));
  render();
  window.scrollTo({top:0});
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => irA(b.dataset.v));
$('#b-masa').onclick = () => irA(S.vista==='amasado' ? 'tanda' : 'amasado');
$('#b-stats').onclick = () => irA(S.vista==='stats' ? 'tanda' : 'stats');
$('#b-recetas').onclick = () => irA(S.vista==='recetas' ? 'tanda' : 'recetas');

try { Object.assign(ui.masa, JSON.parse(leeLocal('vl_masa') || '{}') || {}); } catch(e){}
cargaCrono();
engancharTiro();
setInterval(latidoCrono, 250);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && CRONO.corriendo) pantallaDespierta();
});

render();
conectar();
</script>

<div id="nueva" hidden><b>Hay una versión nueva del panel.</b>
<button id="nueva-ok">Actualizar</button></div>
<script>
/* si tarda demasiado, que al menos se vea el esqueleto */
setTimeout(function(){
  var a = document.getElementById('arranque');
  if (a) a.classList.add('se-va');
}, 9000);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (!e.data || !e.data.nueva) return;
    var n = document.getElementById('nueva');
    if (n) n.hidden = false;
  });
  var ok = document.getElementById('nueva-ok');
  if (ok) ok.onclick = function(){ location.reload(); };
}
</script>
