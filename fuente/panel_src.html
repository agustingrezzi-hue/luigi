/* Lo que dice la tarjeta de una tanda o de una entrega: si quedó algo por
   entregar o por cobrar, o si ya está todo. Las semanas que vienen muestran
   cuántos pedidos hay. */
function estadoDe(peds, sem, bandejas){
  if (!peds.length) return {txt:'sin pedidos', cls:''};
  /* la semana actual y las que vienen: lo que importa es cuánto ocupa */
  if (!esPasada(sem)) return {txt:plu(bandejas||0,'bandeja','bandejas'), cls:''};
  if (peds.every(saldado)) return {txt:'Finalizado', cls:'fin'};
  const fe = peds.some(p => !p.entregado), fc = peds.some(p => !(p.cobrado || p.sinCargo));
  return {txt: fe && fc ? 'Falta entregar/cobrar' : fe ? 'Falta entregar' : 'Falta cobrar',
          cls: 'debe'};
}

/* ------------------------- el calendario de arriba -------------------------
   Una fila finita de días con los repartos marcados. Tocándola se abre el mes
   entero, que se navega, y tocando un día vas a esa semana. */
const DIA2 = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
function repartos(desde, hasta){
  const out = {}, hoy = hoyIso(), sems = {};
  S.tandas.forEach(t => { sems[lunesDe(t.id)] = 1; });
  S.pedidos.forEach(p => { if (p.tanda) sems[lunesDe(p.tanda)] = 1; });
  Object.keys(sems).filter(x => x >= suma(desde, -7) && x <= hasta).forEach(sem => {
    const ents = entregasDe(sem);
    ents.forEach((e, i) => {
      const f = fechaEntrega(sem, i);
      const peds = S.pedidos.filter(p => lunesDe(p.tanda) === sem && entregaDe(p, ents.length) === i);
      /* el color es el de la semana: azul la actual, violeta la que sigue,
         rojo apagado las pasadas y rojo fuerte si quedó algo sin entregar o cobrar */
      const lh = semanaHoy();
      let est = sem === lh ? 'esta' : sem === suma(lh, 7) ? 'sig' : sem > lh ? 'fut' : 'pasada';
      if (est === 'pasada' && peds.length && !peds.every(saldado)) est = 'debe';
      if (!peds.length) est += ' vacia';
      out[f] = {sem, i, est, n:peds.length};
    });
  });
  return out;
}
/* ------------------------- marcas del calendario -------------------------
   Días señalados: vacaciones, ferias, lo que sea. Viven en las notas, con
   tipo "fecha", así que se comparten por la planilla como todo lo demás. */
const TIPOS_MARCA = ['Vacaciones', 'Feria', 'Evento', 'Otro'];
function marcasPorFecha(){
  const out = {};
  S.notas.forEach(n => {
    if (n.tipo !== 'fecha' || !n.fecha) return;
    const f = soloFecha(n.fecha);
    (out[f] = out[f] || []).push(n);
  });
  return out;
}
const claseMarca = m => 'm-' + String((m && m.marca) || 'Otro').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
function hojaMarca(fecha, id){
  const viejo = document.querySelector('.fondo'); if (viejo) viejo.remove();
  const n = id ? S.notas.find(x => x.id === id) : null;
  const f = document.createElement('div');
  f.className = 'fondo';
  f.innerHTML = '<div class="hoja"><div class="tirador"></div>'
    + '<h2>' + (n ? 'Marca del calendario' : 'Marcar un día') + '</h2>'
    + '<div class="campos">'
    + '<div><label class="f" for="mk-fecha">Día</label>'
    + '<input type="date" id="mk-fecha" value="'+esc(n ? soloFecha(n.fecha) : fecha)+'"></div>'
    + '<div><label class="f" for="mk-hasta">Hasta (opcional)</label>'
    + '<input type="date" id="mk-hasta" value="'+esc(n && n.hasta ? soloFecha(n.hasta) : '')+'"></div>'
    + '<div><label class="f" for="mk-tipo">Qué es</label><select id="mk-tipo">'
    + TIPOS_MARCA.map(t=>'<option'+(n && n.marca===t?' selected':'')+'>'+t+'</option>').join('')
    + '</select></div>'
    + '<div><label class="f" for="mk-txt">Nota</label>'
    + '<input type="text" id="mk-txt" value="'+esc(n ? n.titulo : '')+'" placeholder="Por ejemplo: cerrado por vacaciones"></div>'
    + '</div>'
    + '<button class="guardar" id="mk-ok" style="margin-top:13px">Guardar</button>'
    + (n ? '<button class="guardar peligro" id="mk-del" style="margin-top:8px">Borrar la marca</button>' : '')
    + '</div>';
  document.body.appendChild(f);
  f.onclick = e => { if (e.target === f){ f.remove(); render(); } };
  f.querySelector('#mk-ok').onclick = async () => {
    const dia = f.querySelector('#mk-fecha').value;
    if (!dia) return toast('Elegí el día');
    const hasta = f.querySelector('#mk-hasta').value;
    const datos = {tipo:'fecha', fecha:dia, hasta: hasta && hasta > dia ? hasta : '',
      marca: f.querySelector('#mk-tipo').value,
      titulo: f.querySelector('#mk-txt').value.trim() || f.querySelector('#mk-tipo').value,
      items:[], texto:'', creado:new Date().toISOString()};
    await guardar('notas/' + (id || nuevoId('N')), datos);
    f.remove(); render(); toast('Día marcado');
  };
  if (f.querySelector('#mk-del')) f.querySelector('#mk-del').onclick = async () => {
    await borrar('notas/'+id); f.remove(); render(); toast('Marca borrada');
  };
}

/* una marca puede durar varios días (unas vacaciones), así que se reparte */
function marcasEnDias(){
  const base = marcasPorFecha(), out = {};
  Object.keys(base).forEach(f => {
    base[f].forEach(n => {
      const fin = n.hasta ? soloFecha(n.hasta) : f;
      for (let d = f; d <= fin && d <= suma(f, 120); d = suma(d, 1))
        (out[d] = out[d] || []).push(n);
    });
  });
  return out;
}

function irAFecha(f){
  const sem = lunesDe(f);
  const r = repartos(sem, sem)[f];
  S.semanaSel = sem; S.entregaSel = r ? r.i : 0;
  ui.nuevaTanda = false; ui.calAbierto = false;
  guardaLocal('vl_semana', S.semanaSel); guardaLocal('vl_entrega', String(S.entregaSel));
  render();
}
function pintarCal(){
  const el = $('#cal');
  const conTira = S.listo && (S.vista==='tanda' || S.vista==='pedidos');
  el.hidden = !conTira;
  if (!conTira) return;
  const hoy = hoyIso(), sel = S.semanaSel, lunHoy = semanaHoy();
  const desde = [suma(lunHoy, -56), suma(sel, -14)].sort()[0];
  const hasta = [suma(lunHoy, 90), suma(sel, 27)].sort()[1];
  const rep = repartos(desde, suma(hasta, 7));
  const viejaTira = el.querySelector('.cal-tira');
  const scroll = viejaTira ? viejaTira.scrollLeft : null;

  const mk = marcasEnDias();
  let dias = '';
  for (let f = desde; f <= hasta; f = suma(f, 1)){
    const d = deIso(f), dow = (d.getDay()+6)%7, r = rep[f];
    const cls = ['dia', f===hoy?'hoy':'', lunesDe(f)===sel?'sel':'', dow===0?'lun':'',
                 dow===6?'dom':'', r?'rep '+r.est:'', mk[f]?'marcado '+claseMarca(mk[f][0]):''].join(' ');
    if (d.getDate() === 1 || f === desde)
      dias += '<span class="mes">'+MES3[d.getMonth()]+'</span>';
    dias += '<span class="'+cls+'"'+(mk[f]?' title="'+esc(mk[f].map(x=>x.titulo).join(' · '))+'"':'')
      + '><i>'+DIA2[dow]+'</i><b>'+d.getDate()+'</b></span>';
  }
  let mes = '';
  if (ui.calAbierto){
    const m = ui.calMes || sel.slice(0,7);
    const [y, mo] = m.split('-').map(Number);
    const primero = y+'-'+('0'+mo).slice(-2)+'-01';
    const ini = lunesDe(primero);
    const repM = repartos(ini, suma(ini, 42));
    const mkDias = marcasEnDias();
    const delMes = S.notas.filter(n => n.tipo === 'fecha' && n.fecha
        && soloFecha(n.fecha).slice(0,7) <= m && (n.hasta ? soloFecha(n.hasta) : soloFecha(n.fecha)).slice(0,7) >= m)
      .sort((a,b) => soloFecha(a.fecha).localeCompare(soloFecha(b.fecha)));
    let celdas = '';
    for (let k = 0; k < 42; k++){
      const f = suma(ini, k), d = deIso(f), r = repM[f];
      if (k === 35 && d.getMonth()+1 !== mo) break;
      const marcado = mkDias[f];
      celdas += '<button class="'+['c', d.getMonth()+1!==mo?'fuera':'', f===hoy?'hoy':'',
          lunesDe(f)===sel?'sel':'', r?'rep '+r.est:'', marcado?'marcado '+claseMarca(marcado[0]):''].join(' ')
        + '" data-f="'+f+'"'+(marcado?' title="'+esc(marcado.map(x=>x.titulo).join(' · '))+'"':'')+'>'
        + '<b>'+d.getDate()+'</b>'+(r?'<i>'+(r.n?r.n:'')+'</i>':'')+'</button>';
    }
    mes = '<div class="cal-mes"><div class="cab">'
      + '<button data-mm="-1" aria-label="mes anterior">‹</button>'
      + '<span>'+MESES[mo-1]+' '+y+'</span>'
      + '<button data-mm="1" aria-label="mes siguiente">›</button>'
      + '<button class="hoyb" data-hoy="1">Hoy</button></div>'
      + '<div class="sem">'+DIA2.map(x=>'<span>'+x+'</span>').join('')+'</div>'
      + '<div class="grilla">'+celdas+'</div>'
      + (delMes.length ? '<div class="marcas">' + delMes.map(n => {
          const d1 = deIso(soloFecha(n.fecha));
          const rango = n.hasta ? d1.getDate()+' al '+deIso(soloFecha(n.hasta)).getDate() : String(d1.getDate());
          return '<button class="marca '+claseMarca(n)+'" data-mk="'+n.id+'">'
            + '<span class="d">'+rango+'</span><span class="t">'+esc(n.titulo || n.marca)+'</span></button>';
        }).join('') + '</div>' : '')
      + '<button class="agregar" id="cal-marcar" style="margin-top:8px">+ Marcar un día</button>'
      + '<div class="ref"><span class="rep esta">esta semana</span><span class="rep sig">la que sigue</span>'
      + '<span class="rep fut">más adelante</span><span class="rep pasada">pasadas</span>'
      + '<span class="rep debe">falta entregar o cobrar</span></div></div>';
  }
  el.className = 'cal' + (ui.calAbierto ? ' abierto' : '');
  el.innerHTML = '<div class="cal-tira" role="button" aria-label="abrir el calendario">'+dias+'</div>' + mes;

  const tira = el.querySelector('.cal-tira');
  /* la semana elegida queda centrada; solo se descentra si vos deslizás */
  if (ui.calEn !== sel){ ui.calEn = sel; ui.calMovido = false; }   // sigue a la semana elegida
  if (ui.calMovido && scroll != null) tira.scrollLeft = scroll;
  else {
    const d = tira.querySelectorAll('.dia.sel');
    if (d.length){
      const a = d[0].offsetLeft, b = d[d.length-1].offsetLeft + d[d.length-1].offsetWidth;
      tira.scrollLeft = Math.max(0, (a + b)/2 - tira.clientWidth/2);
    }
  }
  ['pointerdown','touchstart','wheel'].forEach(ev => tira.addEventListener(ev, () => { ui.calMovido = true; }, {passive:true}));
  tira.onclick = () => {
    ui.calAbierto = !ui.calAbierto;
    ui.calMes = S.semanaSel.slice(0,7);
    pintarCal();
  };
  el.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => {
    const [y, mo] = (ui.calMes || sel.slice(0,7)).split('-').map(Number);
    const d = new Date(y, mo-1+Number(b.dataset.mm), 1);
    ui.calMes = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    pintarCal();
  });
  el.querySelectorAll('[data-hoy]').forEach(b => b.onclick = () => irAFecha(hoyIso()));
  el.querySelectorAll('[data-f]').forEach(b => {
    b.onclick = () => { if (ui.largo){ ui.largo = false; return; } irAFecha(b.dataset.f); };
    alMantener(b, () => { const mk = marcasEnDias()[b.dataset.f];
      hojaMarca(b.dataset.f, mk && mk[0] ? mk[0].id : null); });
  });
  el.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => {
    const n = S.notas.find(x => x.id === b.dataset.mk);
    hojaMarca(n ? soloFecha(n.fecha) : hoyIso(), b.dataset.mk);
  });
  if (el.querySelector('#cal-marcar'))
    el.querySelector('#cal-marcar').onclick = () => hojaMarca(S.semanaSel, null);
}

function pintarStrip(){

    const clase = [sem===hoy?'esta':'', c.cerrada?'cerrada':esPasada(sem)?'pasada':'', est.cls].join(' ');
    const dias = Array.from({length:n}, (x,j) => diaCorto(sem, j)).join(' · ');

      + '<div class="f">'+semanaMes(sem)+(n > 1 ? '<i>×'+n+'</i>' : '')

  $('#tandas-strip').querySelectorAll('[data-s]').forEach(b => {
    b.onclick = () => {
      if (ui.largo){ ui.largo = false; return; }
      if (b.dataset.s !== S.semanaSel){ S.semanaSel = b.dataset.s; S.entregaSel = 0; }
      ui.nuevaTanda = false;
      guardaLocal('vl_semana', S.semanaSel); render();
    };
    alMantener(b, () => hojaEntregas(b.dataset.s));
  });
  $('#mas-tanda').onclick = () => { ui.nuevaTanda = true; irA('tanda'); };
  const tira = $('#tandas-strip');
  if (!tira.dataset.enganchada){
    tira.dataset.enganchada = '1';
    let pend = false;
    tira.addEventListener('scroll', () => {
      if (!pend){ pend = true;
        requestAnimationFrame(() => { pend = false; marcarCentro(); }); }
      /* cuando el deslizamiento se frena, la tarjeta del centro queda elegida
         sola, y el calendario y todo lo demás la siguen */
      clearTimeout(ui.tiraQuieta);
      ui.tiraQuieta = setTimeout(elegirCentro, 160);
    }, {passive:true});
    ['pointerdown','touchstart','wheel'].forEach(ev =>
      tira.addEventListener(ev, () => { ui.tiraMovida = true; }, {passive:true}));
  }
  /* la tarjeta elegida queda centrada; se descentra solo si la deslizás */
  if (ui.tiraEn !== S.semanaSel){ ui.tiraEn = S.semanaSel; ui.tiraMovida = false; }
  const el = $('#tandas-strip [data-s="'+S.semanaSel+'"]');
  if (el && !ui.tiraMovida){ marcarCentro(el); centrarEn(tira, el); }
  marcarCentro();
}
/* La tarjeta del centro ocupa casi todo el ancho y las de los costados asoman
   apenas achicadas. Al deslizar, el tamaño acompaña: crece la que llega al
   centro y se achica la que se va. */
function anchoChip(tira){ return Math.max(160, Math.round(tira.clientWidth - 76)); }
function marcarCentro(forzada){
  const tira = $('#tandas-strip'); if (!tira || !tira.clientWidth) return;
  const ancho = anchoChip(tira);
  tira.style.setProperty('--chip', ancho + 'px');
  const borde = Math.max(0, Math.round((tira.clientWidth - ancho)/2));
  tira.style.paddingLeft = borde + 'px'; tira.style.paddingRight = borde + 'px';
  const chips = [...tira.querySelectorAll('.tchip[data-s]')];
  const medio = tira.scrollLeft + tira.clientWidth/2;
  let mejor = forzada || null, dist = Infinity;
  chips.forEach(c => {
    const d = Math.abs(c.offsetLeft + c.offsetWidth/2 - medio);
    if (!forzada && d < dist){ dist = d; mejor = c; }
    const p = Math.min(1, d/ancho);
    c.style.transform = 'scale(' + (1 - .07*p).toFixed(3) + ')';
    c.style.opacity = (1 - .25*p).toFixed(3);
  });
  chips.forEach(c => c.classList.toggle('centro', c === mejor));
}
function elegirCentro(){
  if (ui.nuevaTanda) return;   // si estás creando una tanda, no te la cambiamos
  const el = document.querySelector('#tandas-strip .tchip.centro');
  if (!el || !el.dataset.s || el.dataset.s === S.semanaSel) return;
  S.semanaSel = el.dataset.s; S.entregaSel = 0;
  ui.tiraMovida = true;   // no la movemos de donde quedó
  guardaLocal('vl_semana', S.semanaSel); guardaLocal('vl_entrega', '0');
  render();
}
function centrarEn(tira, el){
  tira.scrollLeft = Math.max(0, el.offsetLeft + anchoChip(tira)/2 - tira.clientWidth/2);
}

/* lo que salió de la masa menos lo pedido: lo que queda para vender */

  const tot = med + gra;

    + (tot ? '<div class="l" style="margin-top:4px">'+[med ? plu(med,'mediana','medianas') : '',
        gra ? plu(gra,'grande','grandes') : ''].filter(Boolean).join(' · ')+'</div>' : '')

}

function hojaEntregas(sem){
  const viejo = document.querySelector('.fondo'); if (viejo) viejo.remove();
  const f = document.createElement('div');
  f.className = 'fondo';
  /* la lista vive acá adentro mientras la hoja está abierta: así se redibuja al
     toque, sin esperar a que el servidor conteste */
  let lista = entregasDe(sem);

  const pintar = () => {
    f.innerHTML = '<div class="hoja"><div class="tirador"></div>'
      + '<h2>' + rotuloSemana(sem) + '</h2>'
      + '<div class="s">Una entrega por amasado, hasta tres.</div>'
      + lista.map((e,i) => '<div class="entrega-fila">'
          + '<div class="cab"><span class="n">' + (lista.length>1 ? 'Entrega '+(i+1) : 'Entrega')
          + '</span>' + (lista.length>1
              ? '<button class="x" data-quitar="'+i+'" title="Quitar">×</button>' : '') + '</div>'
          + '<div class="dias">' + NOM_DIA.map((d,j) =>
              '<button data-ent="'+i+'" data-dia="'+(j+1)+'" aria-pressed="'
              + (e.dia===j+1) + '">'+d+'</button>').join('') + '</div></div>').join('')
      + (lista.length < 3
          ? '<button class="agregar" id="mas-entrega" style="margin-top:11px">+ Agregar una entrega</button>'
          : '')
      + '</div>';

    f.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.ent);
      lista[i] = entregaLimpia(Object.assign({}, lista[i], {dia:Number(b.dataset.dia)}));
      pintar();
      escribirEntregas(sem, lista).then(render);
    });
    f.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.quitar);
      lista.splice(i, 1);
      /* los pedidos que colgaban de esa entrega pasan a la anterior */
      S.pedidos.filter(x => lunesDe(x.tanda) === sem).forEach(x => {
        const e = Math.floor(Number(x.entrega) || 0);
        if (e === i) parchar('pedidos/'+x.id, {entrega:Math.max(0, i-1)});
        else if (e > i) parchar('pedidos/'+x.id, {entrega:e-1});
      });
      if (S.entregaSel >= lista.length) S.entregaSel = lista.length - 1;
      pintar();
      escribirEntregas(sem, lista).then(render);
    });
    const mas = f.querySelector('#mas-entrega');
    if (mas) mas.onclick = () => {
      const usados = lista.map(x => x.dia);
      const libre = [5,3,2,4,6,1,7].filter(d => usados.indexOf(d) < 0)[0] || 5;
      lista.push(entregaLimpia({dia:libre}));
      pintar();
      escribirEntregas(sem, lista).then(render);
    };
  };

  pintar();
  document.body.appendChild(f);
  f.onclick = e => { if (e.target === f){ f.remove(); render(); } };
}

function alMantener(el, fn){
  let t = null;
  const soltar = () => { if (t){ clearTimeout(t); t = null; } };
  el.addEventListener('pointerdown', () => {
    soltar(); ui.largo = false;
    t = setTimeout(() => {
      t = null; ui.largo = true; el.classList.add('eligiendo'); fn();
      setTimeout(() => { ui.largo = false; el.classList.remove('eligiendo'); }, 800);
    }, 450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, soltar));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ============================== AMASADO ==============================
   Dos cosas que se usan con las manos en la masa: a cuánto va el agua y
   un cronómetro que avisa cuándo toca cada cosa. */

const PASOS_BASE = [
  {min:4,  que:'Agregar el agua de a poco'},
  {min:9,  que:'Sal'},
  {min:13, que:'Aceite de oliva'},
];
function pasos(){
  const d = S.config.find(c => c.id === 'pasos');
  return ((d && d.lista) || []).slice()
    .filter(x => x && x.que !== undefined)
    .sort((a,b) => Number(a.min) - Number(b.min));
}
const guardarPasos = lista => guardar('config/pasos', {lista:lista});

/* --- la cuenta de siempre: los factores suman y el agua compensa --- */
function tempAgua(){
  const m = ui.masa;
  const n = m.usaPref ? 4 : 3;
  const partes = [Number(m.amb)||0, Number(m.harina)||0];
  if (m.usaPref) partes.push(Number(m.pref)||0);
  partes.push(Number(REGLA.friccion)||0);
  const suma = partes.reduce((a,b)=>a+b, 0);
  return {n, partes, suma, t: (Number(REGLA.tdm)||24)*n - suma};
}
/* Cuánto de esa agua conviene poner en hielo para llegar al número.
   El hielo tiene que derretirse antes de enfriar: por eso el 80. */
function hielo(objetivo, canilla, gramosAgua){
  if (!(canilla > objetivo) || !(gramosAgua > 0)) return 0;
  return Math.round(gramosAgua * (canilla - objetivo) / (80 + canilla));
}
const guardaMasa = () => guardaLocal('vl_masa', JSON.stringify(ui.masa));

/* ------------------------------ cronómetro ------------------------------ */
const CRONO = {corriendo:false, desde:0, acumulado:0, sonados:{}, marcas:[],
               ctx:null, wake:null, sonando:null, pendiente:null};
const enMarcha = () => CRONO.corriendo || cronoMs() > 0;
const cronoMs = () => CRONO.acumulado + (CRONO.corriendo ? Date.now()-CRONO.desde : 0);
const mmss = ms => { const t = Math.max(0, Math.floor(ms/1000));
  return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); };
const claveDe = p => p.min + '\u00b7' + p.que;
/* Timecode como en edición: horas, minutos, segundos y cuadros a 25 por segundo */
const FPS = 25;
function tc(ms, sinCuadros){
  ms = Math.max(0, ms);
  const s = Math.floor(ms/1000), f = Math.floor((ms % 1000) / (1000/FPS));
  const t = dos(Math.floor(s/3600)) + ':' + dos(Math.floor(s/60) % 60) + ':' + dos(s % 60);
  return sinCuadros ? t : t + ':' + dos(f);
}
const tcHtml = ms => { const t = tc(ms); return t.slice(0, 8) + '<i>' + t.slice(8) + '</i>'; };
function rodarReloj(){
  const el = document.getElementById('reloj');
  if (el) el.innerHTML = tcHtml(cronoMs());
  if (CRONO.corriendo && el) requestAnimationFrame(rodarReloj);
  else CRONO.rodando = false;
}
function arrancarRodar(){ if (!CRONO.rodando){ CRONO.rodando = true; requestAnimationFrame(rodarReloj); } }

function guardaCrono(){ guardaLocal('vl_crono', JSON.stringify({
  corriendo:CRONO.corriendo, desde:CRONO.desde, acumulado:CRONO.acumulado,
  sonados:CRONO.sonados, marcas:CRONO.marcas, bolle:CRONO.bolle})); }
function cargaCrono(){
  try {
    const c = JSON.parse(leeLocal('vl_crono') || 'null');
    if (!c) return;
    CRONO.corriendo = !!c.corriendo; CRONO.desde = Number(c.desde)||0;
    CRONO.acumulado = Number(c.acumulado)||0; CRONO.sonados = c.sonados || {};
    CRONO.marcas = Array.isArray(c.marcas) ? c.marcas : [];
    CRONO.bolle = c.bolle || null;
  } catch(e){}
}
async function pantallaDespierta(){
  try { if (navigator.wakeLock && !CRONO.wake)
    CRONO.wake = await navigator.wakeLock.request('screen'); } catch(e){}
}
function soltarPantalla(){
  try { if (CRONO.wake){ CRONO.wake.release(); CRONO.wake = null; } } catch(e){}
}
function arrancarCrono(){
  if (CRONO.corriendo) return;
  /* el navegador solo deja hacer ruido si nace de un toque: lo abrimos acá */
  try {
    CRONO.ctx = CRONO.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (CRONO.ctx.state === 'suspended') CRONO.ctx.resume();
  } catch(e){}
  CRONO.corriendo = true; CRONO.desde = Date.now();
  guardaCrono(); pantallaDespierta();
}
function pausarCrono(){
  if (!CRONO.corriendo) return;
  CRONO.acumulado = cronoMs(); CRONO.corriendo = false;
  guardaCrono(); soltarPantalla();
}
function cerarCrono(){
  CRONO.corriendo = false; CRONO.acumulado = 0; CRONO.desde = 0;
  CRONO.sonados = {}; CRONO.marcas = []; CRONO.bolle = null;
  guardaCrono(); soltarPantalla(); callar();
}
/* El reloj no para hasta que bollás: el descanso de la masa es parte del
   proceso y el total es lo que queremos saber. */
function marcar(que){
  CRONO.marcas.push({ms:cronoMs(), que:que});
  guardaCrono();
}
/* Más fuerte, no más molesto: el mismo tono con sus armónicos y un compresor
   que aprovecha todo el volumen disponible. El techo es el del teléfono. */
function pitar(){
  try {
    const ctx = CRONO.ctx || (CRONO.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 6; comp.ratio.value = 12;
    comp.attack.value = .002; comp.release.value = .12;
    const salida = ctx.createGain();
    salida.gain.value = 1;
    comp.connect(salida); salida.connect(ctx.destination);
    [0, .4, .8].forEach(d => {
      const t0 = ctx.currentTime + d;
      [[880,.5],[1760,.28],[440,.22]].forEach(par => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = par[0];
        g.gain.setValueAtTime(.0001, t0);
        g.gain.exponentialRampToValueAtTime(par[1], t0 + .015);
        g.gain.setValueAtTime(par[1], t0 + .2);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + .34);
        o.connect(g); g.connect(comp);
        o.start(t0); o.stop(t0 + .36);
      });
    });
  } catch(e){}
}
function callar(){
  if (CRONO.sonando){ clearInterval(CRONO.sonando); CRONO.sonando = null; }
  CRONO.pendiente = null;
  try { if (navigator.vibrate) navigator.vibrate(0); } catch(e){}
  const x = document.getElementById('alarma'); if (x) x.remove();
}
/* Suena hasta que decís que sí. Con las manos en la masa no se puede estar
   mirando la pantalla. */
function avisar(paso){
  callar();
  CRONO.pendiente = paso;
  notificar(paso);
  const golpe = () => {
    pitar();
    try { if (navigator.vibrate) navigator.vibrate([400,180,400,180,700]); } catch(e){}
  };
  golpe();
  CRONO.sonando = setInterval(golpe, 3600);
  const d = document.createElement('div');
  d.className = 'alarma'; d.id = 'alarma';
  d.innerHTML = '<div class="txt"><div class="m">minuto '+esc(paso.min)+'</div>'
    + '<div class="t">'+esc(paso.que)+'</div></div><button id="alarma-ok">Listo</button>';
  document.body.appendChild(d);
  /* justo arriba de la botonera, para no taparte los botones */
  const nav = document.getElementById('nav');
  if (nav) d.style.bottom = nav.offsetHeight + 'px';
  d.querySelector('#alarma-ok').onclick = () => {
    marcar(paso.que);
    callar();
    if (S.vista === 'amasado') vistaAmasado();
  };
}
/* Late siempre, esté la pantalla de amasado a la vista o no: el aviso tiene que
   llegar aunque estés cargando un pedido. */
function latidoCrono(){
  const ms = cronoMs();
  const el = document.getElementById('reloj');
  if (el) el.textContent = tc(ms, true);
  const eh = document.getElementById('reloj-horno');
  if (eh){ const h = hornoEnCurso(); if (h) eh.textContent = tc(Date.now() - deLocal(h.inicio), true); }
  if (!CRONO.corriendo || !S.listo) return;
  let sonoAlguno = false;
  pasos().forEach(paso => {
    const k = claveDe(paso);
    if (CRONO.sonados[k]) return;
    if (ms >= Number(paso.min)*60000){
      CRONO.sonados[k] = true; sonoAlguno = true; avisar(paso);
    }
  });
  if (sonoAlguno){ guardaCrono(); pintarPasos(); }
}
function pintarPasos(){

/* El agua que se templa es la de ingreso. Si la tanda elegida lleva biga en esta
   masa, una parte del agua ya se fue en la biga el día antes. La del final se
   pone aparte y no entra en la cuenta. */
function aguasDe(cual, kg){
  const rec = receta(cual);
  const E = S.listo ? entregasDe(S.semanaSel)[S.entregaSel] || entregasDe(S.semanaSel)[0] : null;
  /* con masa única la biga es la de esa masa, se llame como se llame la receta */
  const unica = E && E.unica && E.unica.activa && E.unica.receta === cual;
  const conBiga = !!(E && E.biga && E.biga[unica ? 'uni' : (cual === 'masa_prepizza' ? 'pre' : 'foc')]);
  const items = conBiga ? desdoblar(rec, kg).fin : Object.keys(rec).reduce((o,k) =>
    (o[k] = (Number(rec[k])||0)*kg, o), {});
  const aguas = Object.keys(items).filter(esAgua);
  const principal = 'Agua' in items ? 'Agua' : aguas[0];
  const final = aguas.filter(k => k !== principal).reduce((a,k) => a + items[k], 0);
  return {ingreso: principal ? items[principal] : 0, final, conBiga};
}

/* ----------------------- el clima, solo -----------------------
   Cada vez que se anota algo se guarda también la temperatura y la humedad
   de afuera en Luján, para después cruzar cómo reacciona la masa según la
   época. Si no hay señal o el servicio no contesta, se guarda sin clima. */
const LUJAN = {lat:-34.5703, lon:-59.1050};
const CLIMA = {dato:null, cuando:0};
async function climaAhora(){
  if (CLIMA.dato && Date.now() - CLIMA.cuando < 10*60000) return CLIMA.dato;
  if (window.__sinClima) return null;
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LUJAN.lat
      + '&longitude=' + LUJAN.lon + '&current=temperature_2m,relative_humidity_2m&timezone=auto',
      {signal: ctl.signal});
    clearTimeout(t);
    const j = await r.json();
    const c = j && j.current;
    if (!c || c.temperature_2m == null) return null;
    CLIMA.dato = {temp: Math.round(c.temperature_2m*10)/10, hum: Math.round(c.relative_humidity_2m)};
    CLIMA.cuando = Date.now();
    return CLIMA.dato;
  } catch(e){ return null; }
}
const climaTxt = c => c ? 'afuera ' + cant(c.temp) + '° · ' + c.hum + '%' : '';

/* ---------------------- fermentación de los bollos ----------------------
   Tres momentos por amasado: entran a la heladera, salen y van al horno. De
   cada uno se anota la temperatura del bollo; el día y la hora los pone el
   teléfono. Con eso salen los tiempos de la fermentación. */
const fermLimpia = f => {
  const o = Object.assign({}, f || {});
  o.controles = Array.isArray(o.controles) ? o.controles : [];
  return o;
};
const FERM = [
  {k:'heladera', t:'Entran a la heladera'},
  {k:'salida',   t:'Salen de la heladera'},
  {k:'horno',    t:'Al horno'},
];
const ahoraLocal = () => { const d = new Date();
  return iso(d) + 'T' + dos(d.getHours()) + ':' + dos(d.getMinutes()); };
const deLocal = t => { const p = String(t||'').split('T'); const d = deIso(p[0]);
  const h = (p[1]||'00:00').split(':'); d.setHours(Number(h[0])||0, Number(h[1])||0, 0, 0); return d; };
const bolladoDe = p => (p.fecha || hoyIso()) + 'T' + (p.hora || '00:00');
function diaHora(t){
  const d = deLocal(t);
  return NOM_DIA[(d.getDay()+6)%7] + ' ' + d.getDate() + '/' + (d.getMonth()+1)
    + ' ' + dos(d.getHours()) + ':' + dos(d.getMinutes());
}
function duracion(ms){
  if (!(ms >= 0)) return '—';
  const m = Math.round(ms/60000), h = Math.floor(m/60);
  return h ? h + ' h ' + dos(m % 60) + ' min' : m + ' min';
}
/* los tiempos que salen de los tres momentos */
function tiemposFerm(p){
  const f = p.ferm || {}, b = deLocal(bolladoDe(p));
  const t = k => f[k] && f[k].cuando ? deLocal(f[k].cuando) : null;
  const hel = t('heladera'), sal = t('salida'), hor = t('horno');
  return {
    aHeladera: hel ? hel - b : null,
    enFrio: hel && sal ? sal - hel : null,
    atemperado: sal && hor ? hor - sal : null,
    total: hor ? hor - b : null,
  };
}
const numONada = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);

function tarjetaFerm(){
  const sem = S.semanaSel, ents = entregasDe(sem), i = Math.min(S.entregaSel, ents.length-1);
  const procs = (ents[i].procesos || []).map((p, k) => Object.assign({k}, p)).reverse();
  const cab = '<div class="rot">Los bollos · fermentación</div>'
;
  if (!procs.length) return '<div class="card">' + cab
    + '<p class="hint" style="margin:0 0 10px">Los amasados cerrados aparecen acá.</p>'
    + '<button class="mini" id="f-suelto" style="width:100%">Anotar bollos sin cronómetro</button></div>';
  return '<div class="card">' + cab + procs.map(p => {
    const f = p.ferm || {}, T = tiemposFerm(p);
    const ctrl = (f.controles || []).slice()
      .map((x, n) => Object.assign({n}, x))
      .sort((a,b) => String(a.cuando).localeCompare(String(b.cuando)));
    const filaCtrl = ctrl.map(x => {
      const edita = ui.editaFerm === p.k + ':c' + x.n;
      if (!edita) return '<div class="fpaso ya chico">'
        + '<div><div class="t">Control</div><div class="p">'+diaHora(x.cuando)
        + (x.clima ? ' · '+climaTxt(x.clima) : '')+'</div></div>'
        + '<button class="fval" data-fedit="'+p.k+':c'+x.n+'">'+(x.temp != null ? cant(x.temp)+' °C' : 'sin °C')+'</button></div>';
      return '<div class="fpaso chico"><div><div class="t">Control</div>'
        + '<input type="datetime-local" class="fcuando" id="fc-'+p.k+'-c'+x.n+'" value="'+esc(x.cuando)+'"></div>'
        + '<div class="fin">'
        + '<input type="text" inputmode="decimal" placeholder="°C" id="ft-'+p.k+'-c'+x.n+'" value="'+(x.temp != null ? cant(x.temp) : '')+'" aria-label="temperatura">'
        + '<button data-fok="'+p.k+':c'+x.n+'">Guardar</button>'
        + '<button class="x" data-fdel="'+p.k+':c'+x.n+'" title="Quitar">×</button></div></div>';
    }).join('');
    const nuevoCtrl = '<div class="fpaso chico"><div><div class="t">Control intermedio</div></div><div class="fin">'
      + '<input type="text" inputmode="decimal" placeholder="°C" id="ft-'+p.k+'-cnuevo" aria-label="temperatura">'
      + '<button data-fok="'+p.k+':cnuevo">Anotar</button></div></div>';
    const pasos = FERM.map(x => {
      const d = f[x.k];
      const edita = ui.editaFerm === p.k + ':' + x.k;
      if (d && d.cuando && !edita) return '<div class="fpaso ya">'
        + '<div><div class="t">'+x.t+'</div><div class="p">'+diaHora(d.cuando)
        + (d.clima ? ' · '+climaTxt(d.clima) : '')+'</div></div>'
        + '<button class="fval" data-fedit="'+p.k+':'+x.k+'">'+(d.temp != null ? cant(d.temp)+' °C' : 'sin °C')+'</button></div>';
      return '<div class="fpaso">'
        + '<div><div class="t">'+x.t+'</div>'
        + (edita ? '<input type="datetime-local" class="fcuando" id="fc-'+p.k+'-'+x.k+'" value="'+esc(d.cuando)+'">' : '')
        + '</div><div class="fin">'
        + '<input type="text" inputmode="decimal" placeholder="°C" id="ft-'+p.k+'-'+x.k+'" value="'+(edita && d.temp != null ? cant(d.temp) : '')+'" aria-label="temperatura del bollo">'
        + '<button data-fok="'+p.k+':'+x.k+'">'+(edita ? 'Guardar' : 'Anotar')+'</button></div></div>';
    }).join('');
    const lineas = [
      T.aHeladera != null ? ['De bollar a la heladera', duracion(T.aHeladera)] : null,
      T.enFrio != null ? ['En frío', duracion(T.enFrio)] : null,
      T.atemperado != null ? ['Atemperado', duracion(T.atemperado)] : null,
      T.total != null ? ['De bollar al horno', duracion(T.total)] : null,
    ].filter(Boolean);
    return '<div class="ferm">'
      + '<div class="fcab"><b>'+esc(String(p.masa||'').replace(/^./, x=>x.toUpperCase()))+(p.biga?' · biga':'')
      + (p.kg ? ' · '+cant(p.kg)+' kg' : '')+'</b><span>bollada '+diaHora(bolladoDe(p))+'</span></div>'
      + pasos + filaCtrl + nuevoCtrl
      + (lineas.length ? '<div class="ftiempos">'+lineas.map(l => '<div><span>'+l[0]+'</span><b>'+l[1]+'</b></div>').join('')+'</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}
/* ------------------------------ el horno ------------------------------
   Un cronómetro aparte: guarda a qué hora empezó y a qué hora terminó cada
   horneada, con su clima, dentro de la tanda. */
function hornoEnCurso(){
  try { const h = JSON.parse(leeLocal('vl_horno') || 'null');
    return h && h.inicio ? h : null; } catch(e){ return null; }
}
function tarjetaHorno(){
  const sem = S.semanaSel, ents = entregasDe(sem), i = Math.min(S.entregaSel, ents.length-1);
  const hechas = (ents[i].horneadas || []).slice().reverse();
  const h = hornoEnCurso();
  const desde = h ? deLocal(h.inicio) : null;
  const corriendo = h && h.sem === sem && h.ent === i;
  return '<div class="card"><div class="rot">Horneado</div>'
    + (corriendo
        ? '<div class="reloj corriendo" id="reloj-horno">'+tc(Date.now() - desde, true)+'</div>'
          + '<p class="hint" style="text-align:center;margin:2px 0 10px">desde las '+h.inicio.slice(11)+'</p>'
          + '<div class="mandos fin"><button class="stop" id="h-fin">Terminé de hornear</button>'
          + '<button class="cero" id="h-cancel">Cancelar</button></div>'
        : (h ? '<p class="hint" style="margin:0 0 9px">Hay un horneado abierto en otra tanda.</p>' : '')
          + '<button class="guardar" id="h-go">Empezar a hornear</button>')
    + (hechas.length ? '<div class="rec-sep"></div>' + hechas.map((x,n) =>
        '<div class="rec-row"><span>'+diaHora(x.inicio).replace(/^\S+ /,'')+' → '+String(x.fin).slice(11)
        + (x.clima ? ' · afuera '+cant(x.clima.temp)+'°' : '')+'</span><b>'+duracion(deLocal(x.fin) - deLocal(x.inicio))+'</b>'
        + '</div>').join('') : '')
    + '</div>';
}
function engancharHorno(){
  const v = $('#v-amasado');
  const go = v.querySelector('#h-go');
  if (go) go.onclick = () => {
    guardaLocal('vl_horno', JSON.stringify({inicio: ahoraLocal(), sem: S.semanaSel, ent: Math.min(S.entregaSel, entregasDe(S.semanaSel).length-1)}));
    vistaAmasado(); toast('Horno arrancado');
  };
  const cancel = v.querySelector('#h-cancel');
  if (cancel) cancel.onclick = () => { guardaLocal('vl_horno', ''); vistaAmasado(); toast('Horneado descartado'); };
  const fin = v.querySelector('#h-fin');
  if (fin) fin.onclick = async () => {
    const h = hornoEnCurso(); if (!h) return;
    const ents = entregasDe(h.sem), i = Math.min(h.ent, ents.length-1);
    const dato = {inicio: h.inicio, fin: ahoraLocal(), clima: await climaAhora()};
    guardaLocal('vl_horno', '');
    await escribirEntrega(h.sem, i, {horneadas: (ents[i].horneadas || []).concat([dato])});
    vistaAmasado();
    toast('Horneada de ' + duracion(deLocal(dato.fin) - deLocal(dato.inicio)) + ', guardada');
  };
}

async function anotarFerm(clave, borrar){
  const [k, paso] = clave.split(':'), sem = S.semanaSel;
  const ents = entregasDe(sem), i = Math.min(S.entregaSel, ents.length-1);
  const procs = (ents[i].procesos || []).slice();
  const p = procs[Number(k)]; if (!p) return;
  const esCtrl = paso.charAt(0) === 'c';
  const idx = esCtrl && paso !== 'cnuevo' ? Number(paso.slice(1)) : -1;
  const ferm = Object.assign({}, p.ferm || {});
  const controles = (ferm.controles || []).slice();

  if (borrar){
    controles.splice(idx, 1); ferm.controles = controles;
  } else {
    const tIn = $('#ft-'+k+'-'+paso), cIn = $('#fc-'+k+'-'+paso);
    const txt = tIn ? String(tIn.value).trim() : '';
    const temp = txt === '' ? null : Number(txt.replace(',', '.'));
    if (txt !== '' && isNaN(temp)) return toast('Poné los grados');
    const previo = esCtrl ? (controles[idx] || {}) : (ferm[paso] || {});
    const cuando = cIn && cIn.value ? cIn.value : (previo.cuando || ahoraLocal());
    const clima = previo.clima || (cIn ? null : await climaAhora());
    const dato = {cuando, temp, clima};
    if (esCtrl){
      if (idx >= 0) controles[idx] = dato; else controles.push(dato);
      ferm.controles = controles;
    } else ferm[paso] = dato;
    var aviso = (esCtrl ? 'Control' : FERM.find(x => x.k === paso).t)
      + (temp != null ? ' a ' + cant(temp) + ' °C' : '') + ', anotado';
  }
  procs[Number(k)] = Object.assign({}, p, {ferm});
  ui.editaFerm = null;
  await escribirEntrega(sem, i, {procesos: procs});
  vistaAmasado();
  toast(borrar ? 'Control quitado' : aviso);
}
function engancharFerm(){
  const v = $('#v-amasado');
  v.querySelectorAll('[data-fent]').forEach(b => b.onclick = () => {
    S.entregaSel = Number(b.dataset.fent); guardaLocal('vl_entrega', String(S.entregaSel)); vistaAmasado(); });
  v.querySelectorAll('[data-fok]').forEach(b => b.onclick = () => anotarFerm(b.dataset.fok));
  v.querySelectorAll('[data-fdel]').forEach(b => b.onclick = () => anotarFerm(b.dataset.fdel, true));
  v.querySelectorAll('[data-fedit]').forEach(b => b.onclick = () => {
    ui.editaFerm = ui.editaFerm === b.dataset.fedit ? null : b.dataset.fedit; vistaAmasado(); });
  v.querySelectorAll('.fin input').forEach(inp => inp.onkeydown = e => {

function lineaAgua(aguaTot, obj, hi, m){

/* ========================= TIRAR PARA ACTUALIZAR =========================
   El gesto de siempre: desde arriba de todo, tirás hacia abajo y suelta.
   No se mete con la tira de semanas ni con los carruseles de tiradas. */
const TIRO = {y0:0, x0:0, activo:false, dist:0, girando:false};
const TOPE = 72;

function cajaTiro(){
  let c = document.getElementById('tirar');
  if (!c){
    c = document.createElement('div');
    c.id = 'tirar';
    c.innerHTML = '<div class="rueda"><svg viewBox="0 0 24 24">'
      + '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></div>';
    document.body.appendChild(c);
  }
  return c;
}
function pintarTiro(d){
  const r = cajaTiro().querySelector('.rueda');
  const y = Math.min(d, TOPE*1.5);
  r.style.transform = 'translateY('+(y-44)+'px) rotate('+(y*3)+'deg)';
  r.style.opacity = Math.min(1, d/TOPE);
}
function soltarTiro(){
  const c = cajaTiro(), r = c.querySelector('.rueda');
  c.classList.remove('girando');
  r.style.transform = 'translateY(-44px)';
  r.style.opacity = 0;
}
/* dentro de algo que se desliza al costado, el gesto es de eso, no nuestro */
function enCarrusel(el){
  for (let n = el; n && n !== document.body; n = n.parentElement){
    if (n.scrollWidth > n.clientWidth + 4){
      const o = getComputedStyle(n).overflowX;
      if (o === 'auto' || o === 'scroll') return true;
    }
  }
  return false;
}
function engancharTiro(){
  document.addEventListener('touchstart', e => {
    if (TIRO.girando || e.touches.length !== 1) return;
    if (window.scrollY > 2) return;
    if (document.querySelector('.fondo, .fondo-pin')) return;
    if (enCarrusel(e.target)) return;
    TIRO.y0 = e.touches[0].clientY; TIRO.x0 = e.touches[0].clientX;
    TIRO.activo = true; TIRO.dist = 0;
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if (!TIRO.activo) return;
    const dy = e.touches[0].clientY - TIRO.y0;
    const dx = Math.abs(e.touches[0].clientX - TIRO.x0);
    if (dy < 0 || dx > Math.abs(dy)){ TIRO.activo = false; soltarTiro(); return; }
    TIRO.dist = dy * .55;           /* con resistencia, como corresponde */
    pintarTiro(TIRO.dist);
  }, {passive:true});

  const fin = () => {
    if (!TIRO.activo) return;
    TIRO.activo = false;
    if (TIRO.dist >= TOPE) actualizarTirando(); else soltarTiro();
  };
  ['touchend','touchcancel'].forEach(ev => document.addEventListener(ev, fin, {passive:true}));
}
async function actualizarTirando(){
  if (TIRO.girando) return;
  TIRO.girando = true;
  const c = cajaTiro(), r = c.querySelector('.rueda');
  c.classList.add('girando');
  r.style.transform = 'translateY(16px)'; r.style.opacity = 1;
  if (API.activo){ API.falla = 0; API.motivo = ''; await cargarTodo(); await vaciarCola(); }
  /* un respiro para que se vea que pasó algo */
  setTimeout(() => { TIRO.girando = false; soltarTiro(); toast('Al día'); }, 420);
}

    const k = b.dataset.k, valor = !p[k];
    const campos = {[k]: valor};
    /* si se entregó es porque estaba preparado; cobrar no arrastra nada:
       a veces pagan apenas hacen el pedido */
    if (valor && k === 'entregado') campos.preparado = true;
    parchar('pedidos/'+p.id, campos);
  });
  $('#v-pedidos').querySelectorAll('[data-ped]').forEach(t =>
    alMantener(t, () => abrirEdicion(t.dataset.ped)));

    ui.borrando = b.dataset.del; ui.editaCobro = null; vistaPedidos(); });
  $('#v-pedidos').querySelectorAll('[data-no]').forEach(b => b.onclick = () => {
    ui.borrando = null; vistaPedidos(); });
  $('#v-pedidos').querySelectorAll('[data-si]').forEach(b => b.onclick = async () => {
    await borrar('pedidos/'+b.dataset.si); ui.borrando = null; toast('Pedido borrado'); });
  $('#v-pedidos').querySelectorAll('[data-cobro]').forEach(b => b.onclick = () => {
    ui.editaCobro = ui.editaCobro === b.dataset.cobro ? null : b.dataset.cobro;
    ui.borrando = null; vistaPedidos(); });
  $('#v-pedidos').querySelectorAll('[data-cm]').forEach(b => b.onclick = async () => {
    const id = ui.editaCobro, m = b.dataset.cm;
    if (m==='sin')    await parchar('pedidos/'+id, {sinCargo:true, totalManual:null});
    if (m==='normal') await parchar('pedidos/'+id, {sinCargo:false, totalManual:null});
    if (m==='manual') { vistaPedidos(); $('#cm-'+id) && $('#cm-'+id).focus(); return; }
    toast(m==='sin'?'Queda sin cargo':'Vuelve al precio normal'); });
  $('#v-pedidos').querySelectorAll('[data-cmok]').forEach(b => b.onclick = async () => {
    const id = b.dataset.cmok, v = Number($('#cm-'+id).value);
    if (!(v >= 0)) return toast('Poné un monto válido');
    await parchar('pedidos/'+id, {sinCargo:false, totalManual:v});
    ui.editaCobro = null; toast('Monto actualizado'); });
}

function sugerir(q){
  const t = (q||'').toLowerCase();
  const lista = S.clientes.filter(c => c.nombre.toLowerCase().indexOf(t) >= 0).slice(0,4);
  const existe = lista.some(c => c.nombre.toLowerCase() === t);
  $('#sug').innerHTML = lista.map(c=>'<button data-id="'+c.id+'">'+esc(c.nombre)+'</button>').join('')
    + (q && !existe ? '<button data-nuevo="'+esc(q)+'" style="background:var(--ok-soft);color:var(--ok)">+ '+esc(q)+' (nuevo)</button>' : '');
  $('#sug').querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    nuevo.cliente = S.clientes.find(c=>c.id===b.dataset.id);
    nuevo.direccion = nuevo.cliente.direccion1 || '';
    vistaNuevo(); });
  $('#sug').querySelectorAll('[data-nuevo]').forEach(b => b.onclick = async () => {
    const id = nuevoId('CL');
    const c = {nombre:b.dataset.nuevo, tipo:'Particular', telefono:'', zona:'',
               direccion1:'', direccion2:'', notas:'alta desde el panel'};
    await guardar('clientes/'+id, c);
    nuevo.cliente = Object.assign({id}, c); nuevo.direccion = '';
    vistaNuevo(); toast('Cliente creado'); });
}
function lineasNuevo(){
  const pg = precioGr(), out = [];
  for (const sku in nuevo.items) if (nuevo.items[sku] > 0)
    out.push({sku, cantidad:nuevo.items[sku], precioUnit:productoDe(sku).precio,
              costoUnit:costoSku(sku,pg)});
  nuevo.focaccias.forEach(l => {
    const p = S.productos.find(x=>x.tipo==='Focaccia' && x.nombre==='Focaccia '+l.sabor
                               && x.tamano===l.tam);
    if (p) out.push({sku:p.sku, cantidad:l.cant, precioUnit:p.precio,
                     costoUnit:costoSku(p.sku,pg)});
  });
  return out;
}
const brutoNuevo = () => lineasNuevo().reduce((a,l)=>a+l.cantidad*l.precioUnit, 0)
  + (nuevo.conEnvio ? REGLA.envio : 0);
function totalNuevo(){
  if (nuevo.sinCargo) return 0;
  if (nuevo.totalManual !== '' && nuevo.totalManual != null) return Number(nuevo.totalManual)||0;
  return brutoNuevo();
}
const puedeGuardar = () => !!nuevo.cliente && lineasNuevo().length > 0;

async function guardarPedido(){
  const dir = nuevo.direccion === '__otra__' ? nuevo.dirOtra : nuevo.direccion;
  const editando = nuevo.editando;
  const id = editando || nuevoId('P');
  /* una línea que ya estaba conserva su precio y su costo: si no, un pedido de
     hace tres semanas se recalcularía con los precios de hoy */
  const viejos = nuevo.preciosViejos || {};
  const lineas = lineasNuevo().map(l => viejos[l.sku]
    ? Object.assign({}, l, viejos[l.sku]) : l);
  const campos = {
    tanda:nuevo.semana, entrega:Number(nuevo.entrega)||0,
    clienteId:nuevo.cliente.id, cliente:nuevo.cliente.nombre,
    envio: nuevo.conEnvio ? REGLA.envio : 0, direccion: nuevo.conEnvio ? dir : '',
    formaPago:nuevo.formaPago, observaciones:nuevo.obs, lineas,
    sinCargo: !!nuevo.sinCargo,
    totalManual: (!nuevo.sinCargo && nuevo.totalManual !== '' && nuevo.totalManual != null)
                 ? Number(nuevo.totalManual) : null};
  if (editando) await parchar('pedidos/'+id, campos);
  else await guardar('pedidos/'+id, Object.assign({}, campos,
    {preparado:false, entregado:false, cobrado:false, creado:new Date().toISOString()}));
  const impares = lineas.filter(l=>productoDe(l.sku).tipo==='Prepizza')
                    .reduce((a,l)=>a+l.cantidad,0) % 2;
  S.semanaSel = nuevo.semana; S.entregaSel = Number(nuevo.entrega)||0;
  limpiarNuevo();
  irA('pedidos');
  toast(editando ? 'Pedido actualizado'
                 : impares ? 'Guardado · prepizzas impares' : 'Pedido guardado');
}

  $('#v-stock').querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {

  $('#v-stock').querySelectorAll('[data-fix]').forEach(b => b.onclick = async () => {
    const i = S.insumos.find(x=>x.id===b.dataset.fix);
    const v = Number($('#ns-'+b.dataset.fix).value);

    toast('Stock corregido'); });
  $('#v-stock').querySelectorAll('[data-mdel]').forEach(b => b.onclick = async () => {
    await borrar('movimientos/'+b.dataset.mdel); toast('Movimiento deshecho'); });
}

          + '<button class="si" id="c-borrar-si">Sí, eliminar</button>'

  const buscando = document.activeElement && document.activeElement.id === 'cli-busca';

  const filas = () => {
    const q = sinTilde(ui.buscaCli).trim();
    const lista = S.clientes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre))
      .filter(c => !q || q.split(/\s+/).every(w => sinTilde([c.nombre, c.zona, c.direccion1,

        + (h?'<span class="d hx">'+plu(h.pedidos,'pedido','pedidos')+' · '+h.prepizzas
           + ' prepizzas · última '+mesCorto(h.ultima)+'</span>':'')
        + '</span><span class="r">›</span></button>';}).join('')
      || '<div class="vacio">'+(q ? 'Nadie con “'+esc(ui.buscaCli.trim())+'”.' : 'Todavía no hay clientes.')+'</div>';
  };

    ui.editaCliente = b.dataset.id; ui.borraCliente = false; vistaClientes(); });
  $('#v-clientes').innerHTML =
    '<div class="busca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>'
    + '<input type="search" id="cli-busca" placeholder="Buscar por nombre, zona, dirección…" '
    + 'value="'+esc(ui.buscaCli||'')+'" autocomplete="off" aria-label="buscar cliente">'
    + (ui.buscaCli ? '<button id="cli-limpia" aria-label="borrar búsqueda">×</button>' : '') + '</div>'
    + '<div class="card tight" id="cli-lista">'+filas()+'</div>';
  enganchar();
  const inp = $('#cli-busca');
  /* si llegan datos nuevos mientras escribís, no perdés el cursor */
  if (buscando){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  inp.oninput = () => {
    const tenia = !!ui.buscaCli;
    ui.buscaCli = inp.value;
    if (tenia !== !!ui.buscaCli){
      /* aparece o se va la cruz: se redibuja y se devuelve el foco */
      vistaClientes(); const i = $('#cli-busca'); i.focus();
      i.setSelectionRange(i.value.length, i.value.length); return;
    }
    $('#cli-lista').innerHTML = filas(); enganchar();
  };
  if ($('#cli-limpia')) $('#cli-limpia').onclick = () => { ui.buscaCli = ''; vistaClientes(); $('#cli-busca').focus(); };
}
/* lo que quedó de las planillas viejas, guardado en la ficha del cliente */
function hist(c){
  const m = /(\d+)\s*pedidos?\s*·\s*(\d+)\s*prepizzas?\s*·\s*última\s*(\d{4})-(\d{2})/
    .exec(c.historico||'');
  return m ? {pedidos:+m[1], prepizzas:+m[2], ultima:m[3]+'-'+m[4]} : null;
}
function mesCorto(am){
  const p = String(am).split('-');
  return MES3[Number(p[1])-1].toLowerCase()+' '+p[0].slice(2);
}
const iniciales = n => String(n||'?').split(' ').filter(Boolean)
  .map(w=>w[0]).slice(0,2).join('').toUpperCase();

/* ------------------------------ RECETAS Y REGLAS ------------------------------ */
function vistaRecetas(){
  if (!S.listo) return $('#v-recetas').innerHTML = esperando();
  const pg = precioGr();
  const nombresInsumo = S.insumos.map(i=>i.nombre).sort();
  const costoDeReceta = items => {
    let c = 0; for (const k in items) if (!esAgua(k)) c += items[k]*(pg[k]||0); return c; };

  const tabla = (clave, titulo, sub, unidad, divisor) => {
    const items = receta(clave);
    const filas = clavesOrdenadas(items).map(k =>
      '<div class="ed"><span class="n">'+esc(k)+'</span>'
      + '<span class="campo"><input type="number" data-rec="'+clave+'" data-k="'+esc(k)+'" value="'+items[k]+'" step="1"><span class="un">'+unidad+'</span></span>'
      + '<button class="x" data-recdel="'+clave+'" data-k="'+esc(k)+'" title="Quitar">×</button></div>').join('');
    const faltan = nombresInsumo.filter(n => !(n in items));
    if (!items['Agua']) faltan.unshift('Agua');
    if (!('Agua final' in items)) faltan.push('Agua final');
    return '<div class="card"><div class="rot" style="display:flex;justify-content:space-between;align-items:center">'
      + '<span>'+titulo+'</span>'+(divisor===0 ? '' : '<span class="badge-costo">'+pesos(costoDeReceta(items)/(divisor||1))+' por unidad</span>')+'</div>'
      + '<p class="hint" style="margin:0 0 6px">'+sub+'</p>'
      + filas
      + '<div class="ed" style="border-top:1px solid var(--line);margin-top:6px;padding-top:11px">'
      + '<input type="text" data-addsel="'+clave+'" list="dl-'+clave+'" '
      + 'placeholder="+ ingrediente" aria-label="ingrediente nuevo">'
      + '<datalist id="dl-'+clave+'">'+faltan.map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>'
      + '<span class="campo"><input type="number" data-addval="'+clave+'" placeholder="0"><span class="un">'+unidad+'</span></span>'
      + '<button class="x" data-addok="'+clave+'" title="Agregar" style="color:var(--marca-ink)">+</button></div></div>';
  };

  /* la biga va por kilo de SU harina; el porcentaje dice cuánto de la harina
     total de la masa se va para ella */
  const tarjetaBiga = () => {
    const t = tabla('biga','Biga','Por kilo de harina de la biga. Se activa en cada tanda, masa por masa.','g',0);
    const pct = '<div class="ed" style="margin-bottom:4px"><span class="n">De la harina total va a la biga</span>'
      + '<span class="campo"><input type="number" id="biga-pct" value="'+bigaPct()+'" step="5" min="0" max="100">'
      + '<span class="un">%</span></span><span></span></div>';
    const d = desdoblar(receta('masa_prepizza'), 1);
    const ej = '<div class="agua" style="margin-top:10px;display:block"><div class="l" style="margin-bottom:5px">'
      + 'Ejemplo: 1 kg de harina de prepizza</div>'
      + '<div class="rec-row"><span>Biga</span><b>'+Object.keys(d.biga).map(k=>esc(k)+' '+gr(d.biga[k])).join(' · ')+'</b></div>'
      + '<div class="rec-row"><span>Final</span><b>'+clavesOrdenadas(d.fin).filter(k=>d.fin[k]>0)
        .map(k=>esc(k)+' '+gr(d.fin[k])).join(' · ')+'</b></div></div>';
    /* el porcentaje va arriba de los ingredientes */
    return t.replace('<p class="hint"', pct + '<p class="hint"').replace(/<\/div>$/, ej + '</div>');
  };
  const prodsFoc = S.productos.slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
  const toppings = prodsFoc.map(p => {
    const items = topping(p.sku);
    const filas = clavesOrdenadas(items).map(k =>
      '<div class="ed"><span class="n">'+esc(k)+'</span>'
      + '<span class="campo"><input type="number" data-rec="top_'+p.sku+'" data-k="'+esc(k)+'" value="'+items[k]+'" step="1"><span class="un">g</span></span>'
      + '<button class="x" data-recdel="top_'+p.sku+'" data-k="'+esc(k)+'">×</button></div>').join('');

/* ================================ FINANZAS ================================
   Tres cosas: cuánta plata de lo cobrado es costo y hay que reservar, los
   gastos (incluidas las tarjetas personales de Agus y de Agos, en cuotas) y
   la cuenta con cada uno: Luigi les paga la cuota a principio de mes. */
const QUIENES = ['Luigi', 'Agus', 'Agos'];
const CATEGORIAS = ['Insumos', 'Packaging', 'Equipamiento', 'Servicios', 'Otros'];
const MEDIOS = ['Tarjeta', 'Efectivo', 'Transferencia'];
const mesDe = f => soloFecha(f).slice(0, 7);
const mesHoy = () => hoyIso().slice(0, 7);
const mesMas = (m, n) => { const p = m.split('-').map(Number);
  const d = new Date(p[0], p[1]-1+n, 1);
  return d.getFullYear()+'-'+dos(d.getMonth()+1); };
const rotuloMes = m => { const p = m.split('-').map(Number);
  return MESES[p[1]-1].charAt(0).toUpperCase()+MESES[p[1]-1].slice(1)+' '+p[0]; };
const gastos = () => S.finanzas.filter(x => x.tipo === 'gasto');
const pagos  = () => S.finanzas.filter(x => x.tipo === 'pago');
const cuotasDe = g => Math.max(1, Math.round(Number(g.cuotas) || 1));
const cuotaDe  = g => Number(g.monto || 0) / cuotasDe(g);
const mes1De   = g => (g.desde && String(g.desde).slice(0,7)) || mesDe(g.fecha);
/* qué cuotas de este gasto caen en el mes m */
const cuotaEnMes = (g, m) => {
  const i = (Number(m.slice(0,4)) - Number(mes1De(g).slice(0,4)))*12
          + (Number(m.slice(5,7)) - Number(mes1De(g).slice(5,7)));
  return (i >= 0 && i < cuotasDe(g)) ? cuotaDe(g) : 0;
};
/* lo que Luigi le debe a cada uno: cuotas ya vencidas menos lo que le pagó */
function cuentaCon(quien, hasta){
  hasta = hasta || mesHoy();
  let debe = 0;
  gastos().filter(g => g.quien === quien).forEach(g => {
    for (let m = mes1De(g); m <= hasta; m = mesMas(m, 1)) debe += cuotaEnMes(g, m);
  });
  const pagado = pagos().filter(p => p.quien === quien && mesDe(p.fecha) <= hasta)
    .reduce((a,p) => a + Number(p.monto||0), 0);
  const esteMes = gastos().filter(g => g.quien === quien)
    .reduce((a,g) => a + cuotaEnMes(g, hasta), 0);
  const pagadoMes = pagos().filter(p => p.quien === quien && (p.mes || mesDe(p.fecha)) === hasta)
    .reduce((a,p) => a + Number(p.monto||0), 0);
  return {debe: debe - pagado, esteMes, pagadoMes, falta: Math.max(0, esteMes - pagadoMes)};
}
/* La reserva: de todo lo cobrado, la parte que es costo. Baja cuando Luigi
   paga insumos de su bolsillo o le devuelve una cuota a Agus o a Agos. */
function reserva(){
  let costoCobrado = 0, cobrado = 0;
  S.pedidos.forEach(p => { if (!p.cobrado) return;
    cobrado += totalDe(p); costoCobrado += costoDe(p); });
  const salioDeLuigi = gastos().filter(g => g.quien === 'Luigi')
    .reduce((a,g) => a + Number(g.monto||0), 0)
    + pagos().reduce((a,p) => a + Number(p.monto||0), 0);
  return {cobrado, costoCobrado, guardar: costoCobrado - salioDeLuigi, salioDeLuigi};
}
function mesPlata(m){
  let cobrado = 0, costo = 0, porCobrar = 0, unidades = 0;
  S.pedidos.forEach(p => {
    const mp = mesDe(p.tanda);
    if (mp !== m) return;
    (p.lineas||[]).forEach(l => unidades += l.cantidad);
    if (p.cobrado){ cobrado += totalDe(p); costo += costoDe(p); }
    else if (!p.sinCargo) porCobrar += totalDe(p);
  });
  const gs = gastos().filter(g => mesDe(g.fecha) === m);
  const porCat = {};
  gs.forEach(g => { porCat[g.categoria || 'Otros'] = (porCat[g.categoria || 'Otros']||0) + Number(g.monto||0); });
  return {cobrado, costo, ganancia: cobrado - costo, porCobrar, unidades, gastos: gs, porCat};
}

/* ------------------------------ ESTADÍSTICAS ------------------------------ */
function vistaStats(){
  if (!S.listo) return $('#v-stats').innerHTML = esperando();
  const hoy = semanaHoy();
  const semanas = [];
  S.pedidos.forEach(p => { const s = lunesDe(p.tanda); if (semanas.indexOf(s)<0) semanas.push(s); });
  semanas.sort();
  const hechas = semanas.filter(s => s <= hoy);

  let venta=0, costo=0, unidades=0, pedidos=0, sinCargo=0, bonif=0, pendiente=0;
  const porCliente = {}, porSku = {}, porSemana = {}, ultimaDe = {};
  const porClase = {pre:0,med:0,gra:0}, porClaseSem = {};
  S.pedidos.forEach(p => {
    const s = lunesDe(p.tanda);
    if (s > hoy) return;                         // las futuras no son resultado todavía
    const t = totalDe(p), br = brutoDe(p), co = costoDe(p);
    venta += t; costo += co; pedidos++; bonif += br - t;
    if (p.sinCargo) sinCargo++;
    if (!p.cobrado) pendiente += t;
    porSemana[s] = porSemana[s] || {venta:0, costo:0, un:0};
    porSemana[s].venta += t; porSemana[s].costo += co;
    porCliente[p.cliente] = (porCliente[p.cliente]||0) + t;
    if (!ultimaDe[p.cliente] || s > ultimaDe[p.cliente]) ultimaDe[p.cliente] = s;
    (p.lineas||[]).forEach(l => {
      unidades += l.cantidad; porSemana[s].un += l.cantidad;
      porSku[l.sku] = (porSku[l.sku]||0) + l.cantidad;
      const cl = claseDe(productoDe(l.sku));
      porClase[cl] = (porClase[cl]||0) + l.cantidad;
      porClaseSem[s] = porClaseSem[s] || {pre:0,med:0,gra:0};
      porClaseSem[s][cl] += l.cantidad;
    });
  });
  const ganancia = venta - costo;
  const margen = venta ? ganancia/venta : 0;
  const ticket = pedidos ? venta/pedidos : 0;
  const bandejasTot = bandejasDe(porClase.pre, porClase.med, porClase.gra);
  const usoMedio = hechas.length ? hechas.reduce((a,x) => {
    const q = porClaseSem[x] || {pre:0,med:0,gra:0};
    return a + bandejasDe(q.pre,q.med,q.gra)/bandejasHeladera(); }, 0) / hechas.length : 0;

  if (!pedidos){
    $('#v-stats').innerHTML = '<div class="card"><div class="vacio">'
      + 'Todavía no hay tandas cargadas en el panel.<br>Apenas cargues la primera, acá vas a ver '
      + 'cuánto vendiste, cuánto ganaste, quiénes son tus mejores clientes y qué producto tira más.'
      + '</div></div>' + bloquePrevio();
    conectarTooltips($('#v-stats'));
    return;
  }

  /* --- columnas apiladas: últimas 8 semanas --- */
  const ultimas = hechas.slice(-8);
  const maxCol = Math.max.apply(null, ultimas.map(s => (porSemana[s]||{venta:0}).venta).concat([1]));
  const cols = ultimas.map(s => {
    const d = porSemana[s] || {venta:0, costo:0};
    const hG = Math.max(0, (d.venta-d.costo))/maxCol*100, hC = d.costo/maxCol*100;
    return '<div class="col" data-tt="'+esc(rotuloSemana(s))+' · vendiste '+pesos(d.venta)
      + ', ganaste '+pesos(d.venta-d.costo)+'">'
      + '<span class="val">'+pesosK(d.venta)+'</span>'
      + '<div class="pila" style="height:'+(hG+hC)+'%">'
      + '<div class="seg-g" style="flex:'+Math.max(hG,0.01)+'"></div>'
      + '<div class="seg-c'+(hG<=0?' solo':'')+'" style="flex:'+Math.max(hC,0.01)+'"></div></div></div>';
  }).join('');
  const ejes = ultimas.map(s => '<span class="'+(s===hoy?'hoy':'')+'">'
    + rotuloSemana(s).split(' ')[0]+'/'+MES3[deIso(s).getMonth()].slice(0,1)+MES3[deIso(s).getMonth()].slice(1,3).toLowerCase()
    + '</span>').join('');

  /* --- top clientes --- */
  const top = Object.keys(porCliente).sort((a,b)=>porCliente[b]-porCliente[a]).slice(0,8);
  const maxCli = porCliente[top[0]] || 1;
  const barrasCli = top.map(n => '<div class="hb" data-tt="'+esc(n)+' · '+pesos(porCliente[n])
      + ' ('+Math.round(porCliente[n]/venta*100)+'% del total)">'
    + '<div class="lin"><span>'+esc(n)+'</span><b>'+pesos(porCliente[n])+'</b></div>'
    + '<div class="pista"><i style="width:'+(porCliente[n]/maxCli*100)+'%"></i></div></div>').join('');
  const conc = top.slice(0,3).reduce((a,n)=>a+porCliente[n],0)/venta;

  /* --- mix de productos --- */
  const skus = Object.keys(porSku).sort((a,b)=>porSku[b]-porSku[a]);
  const maxSku = porSku[skus[0]] || 1;
  const barrasSku = skus.map(s => {
    const p = productoDe(s), esPre = p.tipo==='Prepizza';
    return '<div class="hb '+(esPre?'pre':'foc')+'" data-tt="'+esc(p.nombre||s)+' · '+porSku[s]+' unidades">'
      + '<div class="lin"><span>'+esc(p.nombre||s)+' '+(esPre?'':badgeTam(p))+'</span><b>'+porSku[s]+'</b></div>'
      + '<div class="pista"><i style="width:'+(porSku[s]/maxSku*100)+'%"></i></div></div>';
  }).join('');

  /* --- insumos que más pesan --- */
  const pg = precioGr(), pesoIns = {};
  S.pedidos.forEach(p => { if (lunesDe(p.tanda) > hoy) return;
    (p.lineas||[]).forEach(l => {
      const prod = productoDe(l.sku), esPre = prod.tipo === 'Prepizza';
      const porKg = esPre ? rindePre() : (prod.tamano==='Grande'?rindeGra():rindeMed());
      const rec = esPre ? receta('masa_prepizza') : receta('masa_focaccia');
      for (const k in rec) if (!esAgua(k)) pesoIns[k] = (pesoIns[k]||0) + rec[k]/porKg*(pg[k]||0)*l.cantidad;
      const pu = receta('por_unidad');
      for (const k in pu) pesoIns[k] = (pesoIns[k]||0) + pu[k]*(pg[k]||0)*l.cantidad;
      const env = envaseDe(l.sku);
      for (const k in env) pesoIns[k] = (pesoIns[k]||0) + env[k]*(pg[k]||0)*l.cantidad;
      const t = topping(l.sku);
      for (const k in t) pesoIns[k] = (pesoIns[k]||0) + t[k]*(pg[k]||0)*l.cantidad;
    }); });
  const insTop = Object.keys(pesoIns).sort((a,b)=>pesoIns[b]-pesoIns[a]).slice(0,6);

  $('#v-stats').innerHTML =
    '<div class="hero"><div class="l">Vendido en '+hechas.length+' tanda'+(hechas.length===1?'':'s')+'</div>'
    + '<div class="v">'+pesos(venta)+'</div>'
    + '<div class="p">Ganancia '+pesos(ganancia)+' · margen '+Math.round(margen*100)+'%</div></div>'

    + '<div class="tiles">'
    + '<div class="tile"><div class="l">Unidades hechas</div><div class="v">'+unidades+'</div>'
    + '<div class="p">'+plu(bandejasTot,'bandeja','bandejas')+'</div></div>'
    + '<div class="tile"><div class="l">Pedidos</div><div class="v">'+pedidos+'</div><div class="p">'+(hechas.length?(pedidos/hechas.length).toFixed(1).replace('.',','):0)+' por tanda</div></div>'
    + '<div class="tile plata"><div class="l">Ticket promedio</div><div class="v">'+pesos(ticket)+'</div></div>'
    + '<div class="tile"><div class="l">Heladera usada</div><div class="v">'
    + (hechas.length?Math.round(usoMedio*100):0)+'%</div>'
    + '<div class="p">'+(hechas.length?(bandejasTot/hechas.length).toFixed(1).replace('.',',')
        :0)+' bandejas por tanda</div></div>'
    + (pendiente?'<div class="tile pend ancho"><div class="l">Falta cobrar (histórico)</div><div class="v">'+pesos(pendiente)+'</div></div>':'')
    + (bonif?'<div class="tile ancho"><div class="l">Regalado y bonificado</div><div class="v">'+pesos(bonif)+'</div><div class="p">'+sinCargo+' pedido'+(sinCargo===1?'':'s')+' sin cargo</div></div>':'')
    + '</div>'

    + '<div class="card"><div class="rot">Cada tanda, en plata</div>'
    + '<div class="leyenda"><span><i style="background:var(--c-gan)"></i>Ganancia</span>'
    + '<span><i style="background:var(--c-cos)"></i>Costo de insumos</span></div>'
    + '<div class="chart"><div class="cols">'+cols+'</div><div class="ejes">'+ejes+'</div></div>'
    + '</div>'

    + '<div class="card"><div class="rot">Quién te compra</div>'+barrasCli
    + '</div>'

    + '<div class="card"><div class="rot">Qué se vende</div>'
    + '<div class="leyenda"><span><i style="background:var(--c-pre)"></i>Prepizzas</span>'
    + '<span><i style="background:var(--c-foc)"></i>Focaccias</span></div>'+barrasSku+'</div>'

    + '<div class="card"><div class="rot">A dónde se va la plata</div>'
    + '<table class="tabla"><thead><tr><th>Insumo</th><th style="text-align:right">Gastado</th><th style="text-align:right">Del costo</th></tr></thead><tbody>'
    + insTop.map(k=>'<tr><td>'+esc(k)+'</td><td class="num">'+pesos(pesoIns[k])+'</td>'
      + '<td class="num">'+Math.round(pesoIns[k]/costo*100)+'%</td></tr>').join('')
    + '</tbody></table></div>'

    + bloqueLaboratorio()
    + bloquePrevio()
    + '<div style="height:20px"></div>';

  conectarTooltips($('#v-stats'));
  engancharLaboratorio();
}

/* --------------------------- laboratorio ---------------------------
   Cada vez que bollás, el proceso queda guardado en su tanda con las
   temperaturas que cargaste y el tiempo. Acá se juntan todos. */
function procesosTodos(){
  const out = [];
  S.tandas.forEach(t => entregasDe(t.id).forEach((e, i) =>
    (e.procesos || []).forEach((p, k) => out.push(Object.assign({sem:t.id, ent:i, k}, p)))));
  return out.sort((a,b) => String(b.fecha+(b.hora||'')).localeCompare(String(a.fecha+(a.hora||''))));
}
const tempsMasa = p => (p.marcas || []).filter(m => m.temp != null);
function bloqueLaboratorio(){
  const l = procesosTodos();
  const grados = v => v == null ? '—' : cant(v)+'°';
  return '<div class="card"><div class="rot" style="display:flex;justify-content:space-between;align-items:center">'
    + '<span>Laboratorio</span>'+(l.length?'<button class="mini" id="lab-csv">Bajar planilla</button>':'')+'</div>'
    + (l.length ? l.map((p, n) => {
          const tm = tempsMasa(p), ult = tm.length ? tm[tm.length-1].temp : null, T = tiemposFerm(p);
          const f = p.ferm || {};
          const d = deIso(p.fecha);
          return '<details class="lab"><summary>'
            + '<span class="f">'+d.getDate()+'/'+(d.getMonth()+1)+'</span>'
            + '<span class="m">'+esc(String(p.masa||'').replace(/^./, x => x.toUpperCase()))+(p.biga?' · biga':'')+' · '+cant(p.kg||0)+' kg</span>'
            + '<span class="t">agua '+grados(p.aguaObjetivo)+' → masa '+grados(ult)
            + (T.enFrio != null ? ' · '+duracion(T.enFrio)+' en frío' : '')+'</span>'
            + '<span class="min">'+(p.sinCrono ? '—' : (p.minutos||0)+' min')+'</span></summary>'
            + '<div class="cuerpo">'
            + '<div class="rec-row"><span>Ambiente · harina'+(p.prefermento!=null?' · prefermento':'')+'</span><b>'
            + grados(p.ambiente)+' · '+grados(p.harina)+(p.prefermento!=null?' · '+grados(p.prefermento):'')+'</b></div>'
            + '<div class="rec-row"><span>Canilla · agua buscada</span><b>'+grados(p.canilla)+' · '+grados(p.aguaObjetivo)
            + (p.hielo?' · '+gr(p.hielo)+' de hielo':'')+'</b></div>'
            + '<div class="rec-row"><span>Masa deseada · fricción</span><b>'+grados(p.tdm)+' · '+grados(p.friccion)+'</b></div>'
            + (p.clima ? '<div class="rec-row"><span>Afuera al bollar</span><b>'+cant(p.clima.temp)+'° · '+p.clima.hum+'%</b></div>' : '')
            + (p.marcas||[]).map(m => '<div class="rec-row'+(m.temp!=null?' temp-l':'')+'"><span>'
                + esc(m.temp!=null ? 'Masa a '+cant(m.temp)+' °C' : m.que)+'</span><b>'+(m.tc ? m.tc.slice(0,8) : 'min '+cant(m.min))+'</b></div>').join('')
            + (f.controles||[]).slice().sort((a,b)=>String(a.cuando).localeCompare(String(b.cuando)))
                .map(x => '<div class="rec-row temp-l"><span>Control · '+diaHora(x.cuando).replace(/^\S+ /,'')
                  + '</span><b>'+grados(x.temp)+'</b></div>').join('')
            + FERM.filter(x => f[x.k] && f[x.k].cuando).map(x => '<div class="rec-row temp-l"><span>'+x.t+' · '
                + diaHora(f[x.k].cuando).replace(/^\S+ /,'')+'</span><b>'+grados(f[x.k].temp)
                + (f[x.k].clima ? ' · afuera '+cant(f[x.k].clima.temp)+'°' : '')+'</b></div>').join('')
            + [['De bollar a la heladera', T.aHeladera], ['En frío', T.enFrio], ['Atemperado', T.atemperado],
               ['De bollar al horno', T.total]].filter(x => x[1] != null)
                .map(x => '<div class="rec-row"><span>'+x[0]+'</span><b>'+duracion(x[1])+'</b></div>').join('')
            + '</div></details>';
        }).join('')
      : '<div class="vacio">Todavía no cerraste ningún amasado. En Amasado, cuando termines, tocá “Bollé”.</div>')
    + '</div>';
}
function engancharLaboratorio(){
  const b = document.getElementById('lab-csv');
  if (!b) return;
  b.onclick = () => {
    const l = procesosTodos();
    const cols = ['fecha','hora','masa','biga','kg','minutos','ambiente','harina','prefermento',
                  'canilla','aguaObjetivo','hielo','tdm','friccion','afuera_temp','afuera_hum',
                  'heladera_cuando','heladera_temp','heladera_afuera','salida_cuando','salida_temp','salida_afuera',
                  'horno_cuando','horno_temp','horno_afuera',
                  'min_bollar_a_heladera','min_en_frio','min_atemperado','min_bollar_a_horno'];
    const plano = p => {
      const f = p.ferm || {}, T = tiemposFerm(p), o = Object.assign({}, p);
      const min = v => v == null ? null : Math.round(v/60000);
      o.afuera_temp = p.clima ? p.clima.temp : null; o.afuera_hum = p.clima ? p.clima.hum : null;
      FERM.forEach(x => { const d = f[x.k] || {};
        o[x.k+'_cuando'] = d.cuando ? d.cuando.replace('T', ' ') : null;
        o[x.k+'_temp'] = d.temp; o[x.k+'_afuera'] = d.clima ? d.clima.temp : null; });
      o.min_bollar_a_heladera = min(T.aHeladera); o.min_en_frio = min(T.enFrio);
      o.min_atemperado = min(T.atemperado); o.min_bollar_a_horno = min(T.total);
      return o;
    };
    const maxT = Math.max(0, ...l.map(p => tempsMasa(p).length));
    const maxC = Math.max(0, ...l.map(p => ((p.ferm||{}).controles||[]).length));
    const colsC = Array.from({length:maxC}, (x,i) => ['control'+(i+1)+'_cuando','control'+(i+1)+'_temp'])
      .reduce((a,x)=>a.concat(x), []);
    const cab = cols.concat(colsC).concat(Array.from({length:maxT}, (x,i) => ['min_temp'+(i+1),'temp_masa'+(i+1)])
      .reduce((a,x)=>a.concat(x), []));
    const celda = v => v == null ? '' : (typeof v === 'boolean' ? (v?'si':'no')
      : typeof v === 'number' ? String(v).replace('.', ',') : '"'+String(v).replace(/"/g,'""')+'"');
    const filas = l.slice().reverse().map(p => {
      const tm = tempsMasa(p);
      const q = plano(p);
      const ctr = ((p.ferm||{}).controles||[]).slice().sort((a,b)=>String(a.cuando).localeCompare(String(b.cuando)));
      return cols.map(k => celda(q[k])).concat(Array.from({length:maxC}, (x,i) =>
        ctr[i] ? [celda(String(ctr[i].cuando).replace('T',' ')), celda(ctr[i].temp)] : ['',''])
        .reduce((a,x)=>a.concat(x), [])).concat(Array.from({length:maxT}, (x,i) =>
        tm[i] ? [celda(tm[i].min), celda(tm[i].temp)] : ['','']).reduce((a,x)=>a.concat(x), [])).join(';');
    });
    const texto = '\ufeff' + cab.join(';') + '\n' + filas.join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], {type:'text/csv;charset=utf-8'}));
    a.download = 'laboratorio-vamos-luigi-' + hoyIso() + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
}

/* lo que traen las planillas de enero a septiembre, antes del panel */
function bloquePrevio(){
  const con = S.clientes.map(c => ({c, h:hist(c)})).filter(x => x.h && x.h.pedidos);
  if (!con.length) return '';
  const totPed = con.reduce((a,x)=>a+x.h.pedidos, 0);
  const totPre = con.reduce((a,x)=>a+x.h.prepizzas, 0);
  const top = con.slice().sort((a,b)=>b.h.prepizzas-a.h.prepizzas).slice(0,8);
  const maxT = top[0].h.prepizzas || 1;
  const fieles = con.filter(x => x.h.pedidos >= 3).length;
  return '<div class="card"><div class="rot">Antes del panel · enero a septiembre</div>'
    + '<p class="hint" style="margin:0 0 12px">Viene de las planillas viejas. Son pedidos y unidades '
    + 'reales; la plata no está porque los precios cambiaron durante el año.</p>'
    + '<div class="tiles" style="margin-bottom:14px">'
    + '<div class="tile"><div class="l">Pedidos</div><div class="v">'+totPed+'</div>'
    + '<div class="p">'+con.length+' clientes</div></div>'
    + '<div class="tile"><div class="l">Prepizzas</div><div class="v">'+totPre.toLocaleString('es-AR')+'</div>'
    + '<div class="p">'+fieles+' clientes con 3 o más pedidos</div></div></div>'
    + '<div class="rot">Los que más te compraron</div>'
    + top.map(x=>'<div class="hb pre" data-tt="'+esc(x.c.nombre)+' · '+x.h.prepizzas
        +' prepizzas en '+plu(x.h.pedidos,'pedido','pedidos')+'">'
      + '<div class="lin"><span>'+esc(x.c.nombre)+'</span><b>'+x.h.prepizzas+'</b></div>'
      + '<div class="pista"><i style="width:'+(x.h.prepizzas/maxT*100)+'%"></i></div></div>').join('')
    + '</div>';
}

/* ------------------------------ tooltips ------------------------------ */
function conectarTooltips(raiz){
  const tt = $('#tt');
  raiz.querySelectorAll('[data-tt]').forEach(el => {
    const mostrar = e => {
      tt.textContent = el.dataset.tt; tt.classList.add('on');
      const x = (e.touches ? e.touches[0].clientX : e.clientX);
      const y = (e.touches ? e.touches[0].clientY : e.clientY);
      const w = tt.offsetWidth;
      tt.style.left = Math.max(8, Math.min(window.innerWidth-w-8, x-w/2))+'px';
      tt.style.top = Math.max(8, y-40)+'px';
    };
    el.addEventListener('mouseenter', mostrar);
    el.addEventListener('mousemove', mostrar);
    el.addEventListener('touchstart', mostrar, {passive:true});
    el.addEventListener('mouseleave', ()=>tt.classList.remove('on'));
    el.addEventListener('touchend', ()=>setTimeout(()=>tt.classList.remove('on'), 1400));
  });
}
