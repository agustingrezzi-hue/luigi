<style>
:root{color-scheme:light dark}
html,body{margin:0;padding:0;height:100%}
img{max-width:100%}
[hidden]:not([hidden="until-found"]){display:none!important}

#arranque{position:fixed;inset:0;z-index:200;background:#0B0D10;display:grid;
  place-items:center;transition:opacity .5s ease}
#arranque.se-va{opacity:0;pointer-events:none}
#arranque .caja{display:grid;justify-items:center;gap:26px;padding:24px}
#arranque .logo-arranque{width:172px;height:auto;display:block;
  animation:respira 2.6s ease-in-out infinite}
@keyframes respira{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
#arranque .riel{width:132px;height:3px;border-radius:99px;
  background:rgba(127,139,156,.2);overflow:hidden}
#arranque .riel i{display:block;height:100%;width:38%;border-radius:99px;background:#2589C8;
  animation:corre 1.3s ease-in-out infinite}
@keyframes corre{0%{transform:translateX(-115%)}100%{transform:translateX(370%)}}
#arranque .pie{font:11px/1.4 ui-monospace,"DM Mono",monospace;color:#5C687A;
  letter-spacing:.14em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){
  #arranque .logo-arranque,#arranque .riel i{animation:none}
  #arranque .riel i{width:100%}
}

html,body{overscroll-behavior-y:contain}
#nueva{position:fixed;left:12px;right:12px;bottom:76px;z-index:95;max-width:444px;
  margin:0 auto;background:#1C77AE;color:#fff;border-radius:16px;padding:13px 15px;
  display:flex;align-items:center;gap:10px;font:14px/1.35 system-ui,sans-serif;
  box-shadow:0 12px 30px -14px rgba(0,0,0,.8)}
#nueva b{flex:1;font-weight:600}
#nueva button{background:rgba(255,255,255,.22);color:#fff;border:0;font:inherit;
  font-weight:700;padding:9px 15px;border-radius:99px;cursor:pointer}
</style>
</head>

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);
  font-family:"Figtree",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2{font-family:"Bricolage Grotesque","Figtree",sans-serif;margin:0;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--marca-2);outline-offset:2px}

.app{max-width:468px;margin:0 auto;min-height:100%;background:var(--ground);
  position:relative;box-shadow:var(--sombra-alta);display:flex;flex-direction:column}
.cuerpo{flex:1 0 auto;padding-bottom:14px}

/* ---------- cabecera: barra de marca ---------- */
.marca{background:var(--negro);padding:11px 16px 12px;display:flex;align-items:center;
  position:sticky;top:0;z-index:35;
  justify-content:space-between;gap:12px}
.marca .logo{height:38px;width:auto;display:block}
.marca .acc{display:flex;gap:6px;align-items:center}
.conex{font-family:"DM Mono",monospace;font-size:10px;color:#7F8B9C;display:flex;
  align-items:center;gap:5px;padding-right:2px;white-space:nowrap}
.conex::before{content:"";width:7px;height:7px;border-radius:50%;background:#3FAE7E;
  display:block;flex:0 0 auto}
.conex.yendo::before{background:#E0A05B}
.conex.mal{color:#E08A82}
.conex.mal::before{background:#D9584C}
.marca .acc button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:#7F8B9C;background:rgba(255,255,255,.06);transition:.15s}
.marca .acc button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.marca .acc button[aria-current="true"]{background:var(--marca-2);color:#fff}

/* ---------- cabecera: módulo de título ---------- */
.titulo{margin:12px 12px 0;padding:11px 15px;border-radius:15px;background:var(--surface);
  border:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;
  gap:10px;box-shadow:var(--sombra);transition:background .25s,color .25s}
.titulo .pantalla{font-family:"Figtree",sans-serif;font-size:11.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--marca-ink);line-height:1.2;
  margin-bottom:2px}
.titulo .pantalla.solo{font-size:16px;letter-spacing:.09em;margin-bottom:3px;color:var(--ink)}
.titulo h1{font-size:17px;font-weight:800;line-height:1.2}
.titulo h1[hidden]{display:none}
.titulo .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.titulo .pill{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:5px 10px;border-radius:99px;white-space:nowrap;
  background:var(--sunken);color:var(--ink-3);font-weight:500}
.titulo.ahora{background:linear-gradient(135deg,var(--marca) 0%,var(--marca-2) 100%);
  border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px rgba(37,137,200,.7)}
.titulo.ahora .sub{color:rgba(255,255,255,.82)}
.titulo.ahora .pantalla{color:rgba(255,255,255,.78)}
.titulo.ahora .pill{background:rgba(255,255,255,.22);color:#fff;font-weight:700}
.titulo.pasada{background:var(--viejo-soft);border-color:var(--viejo-linea)}
.titulo.pasada h1{color:var(--viejo)}
.titulo.pasada .sub{color:var(--viejo);opacity:.8}
.titulo.pasada .pantalla{color:var(--viejo);opacity:.85}
.titulo.pasada .pill{background:var(--viejo);color:var(--surface);font-weight:700;opacity:.9}

/* ---------- tira de tandas ---------- */
.tandas-nav{position:sticky;top:0;z-index:30;background:var(--ground);flex:0 0 auto;
  padding:10px 0 9px;border-bottom:1px solid var(--line-2)}
.tandas-strip{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scroll-snap-type:x proximity}
.tandas-strip::-webkit-scrollbar{height:0}
.tchip{flex:0 0 auto;scroll-snap-align:center;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:7px 11px;min-width:104px;
  text-align:left;transition:.15s;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation}
.tchip.eligiendo{box-shadow:0 0 0 3px var(--marca-2)}
.tchip .f{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13.5px;
  letter-spacing:-.01em;white-space:nowrap}
.tchip .u{font-size:10.5px;color:var(--ink-3);margin-top:2px;font-family:"DM Mono",monospace;
  white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--marca);border-color:var(--marca);color:#fff}
.tchip[aria-pressed="true"] .u{color:rgba(255,255,255,.82)}
.tchip.esta{border-color:var(--marca-2);box-shadow:0 0 0 2px var(--marca-soft)}
.tchip.pasada{background:var(--viejo-soft);border-color:var(--viejo-linea);color:var(--viejo)}
.tchip.pasada .u{color:var(--viejo);opacity:.75}
.tchip.pasada[aria-pressed="true"]{background:var(--viejo);border-color:var(--viejo);color:var(--surface)}
.tchip.pasada[aria-pressed="true"] .u{color:var(--surface);opacity:.85}
.tchip.mas{min-width:46px;display:grid;place-items:center;font-size:20px;color:var(--marca-ink);
  border-style:dashed;border-color:var(--marca-2)}

/* ---------- vistas ---------- */
.vista{display:none;padding:14px 12px 0}
.vista.on{display:block}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sombra);
  border:1px solid var(--line-2);padding:16px;margin-bottom:12px}
.card.tight{padding:0;overflow:hidden}
.rot{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:10px}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.vacio{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.motivo{margin-top:12px;font-family:"DM Mono",monospace;font-size:11px;color:var(--alerta);
  background:var(--alerta-soft);padding:8px 10px;border-radius:9px;word-break:break-word;
  text-align:left}

/* ---------- día de entrega ---------- */
.dias{display:flex;gap:5px;flex-wrap:wrap}
.dias button{flex:1;min-width:38px;padding:8px 2px;border-radius:10px;background:var(--sunken);
  font-size:12px;font-weight:600;color:var(--ink-2);text-transform:capitalize}
.dias button[aria-pressed="true"]{background:var(--marca);color:#fff}

/* ---------- medidor ---------- */
.medidor{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.medidor .n{font-family:"Bricolage Grotesque",sans-serif;font-size:38px;font-weight:800;
  line-height:1;font-variant-numeric:tabular-nums}
.medidor .de{font-size:14px;color:var(--ink-3)}
.medidor .edita-n,.medidor .edita-cap{font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;line-height:1;font-variant-numeric:tabular-nums;padding:2px 8px;
  border-radius:11px;border:1px dashed var(--line);transition:.15s}
.medidor .edita-n{font-size:38px;color:var(--ink)}
.medidor .edita-cap{font-size:22px;color:var(--ink-2)}
.medidor .edita-n:hover,.medidor .edita-cap:hover{background:var(--marca-soft);
  border-color:var(--marca-2);color:var(--marca-ink)}
.barra{height:12px;border-radius:99px;background:var(--sunken);overflow:hidden}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.barra.alta>i{background:var(--horno)} .barra.pasado>i{background:var(--alerta)}
.pie{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.estado{display:inline-block;font-size:12.5px;font-weight:700;padding:5px 11px;
  border-radius:99px;margin-top:11px}
.estado.ok{background:var(--ok-soft);color:var(--ok)}
.estado.alta{background:var(--horno-soft);color:var(--horno)}
.estado.mal{background:var(--alerta-soft);color:var(--alerta)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:12px 14px;box-shadow:var(--sombra)}
.tile .l{font-size:11.5px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;
  margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tile .p{font-size:11px;color:var(--ink-3);font-family:"DM Mono",monospace;margin-top:2px}
.tile.plata .v{color:var(--marca-ink)} .tile.acento .v{color:var(--ok)}
.tile.pend .v{color:var(--alerta)} .tile.env .v{color:var(--horno)}
.tile.ancho{grid-column:1 / -1}

/* ---------- producción ---------- */
.fila{display:grid;grid-template-columns:6px 1fr auto;gap:11px;align-items:center;
  padding:11px 16px 11px 0;border-bottom:1px solid var(--line-2)}
.fila:last-child{border-bottom:0}
.fila .tira{width:6px;height:34px;border-radius:0 4px 4px 0;background:var(--marca-2)}
.fila.med .tira{background:var(--horno-soft);border:1px solid var(--horno)}
.fila.gra .tira{background:var(--horno)}
.fila .nom{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fila .q{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;
  font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.fila .sub{font-size:11.5px;color:var(--ink-3);font-family:"DM Mono",monospace;margin-top:3px}
.tam{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;padding:2px 7px;
  border-radius:99px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tam.m{background:var(--horno-soft);color:var(--horno-2);border:1px solid var(--horno-soft)}
.tam.g{background:var(--horno);color:#fff}
.tam.u{background:var(--marca-soft);color:var(--marca-ink)}

/* ---------- recetas ---------- */
.rec-cab{margin:4px 0 10px}
.rec-cab.con-kg{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kg-chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;
  padding:6px 13px;border-radius:12px;background:var(--sunken);color:var(--ink);
  border:1px dashed var(--line);white-space:nowrap;transition:.15s}
.kg-chip:hover{background:var(--marca-soft);border-color:var(--marca-2);color:var(--marca-ink)}
.kg-chip.amano{background:var(--marca);border-color:var(--marca);color:#fff;border-style:solid}
.rec-cab .t{display:block;font-weight:700;font-size:15.5px}
.rec-cab .s{display:block;font-size:12px;color:var(--ink-3);font-family:"DM Mono",monospace;
  margin-top:2px}
.tiradas{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -16px;padding:2px 16px 8px}
.tiradas::-webkit-scrollbar{height:0}
.tirada{flex:0 0 76%;scroll-snap-align:start;background:var(--sunken);
  border:1px solid var(--line-2);border-radius:var(--r-s);padding:13px 15px}
.tirada .cab{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tirada .cab .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px}
.tirada .cab .s{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.rec-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--line-2);font-size:13.5px}
.rec-row:last-child{border-bottom:0}
.rec-row b{font-family:"DM Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums}
.rec-row.agua-l,.rec-row.agua-l b{color:var(--marca-ink)}
.rec-sep{height:1px;background:var(--line);margin:16px 0 4px}
.swipe{font-size:11.5px;color:var(--ink-3);text-align:center;margin:2px 0 0;
  font-family:"DM Mono",monospace}
.clima{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.clima input{text-align:center;font-size:17px;font-weight:600}
.agua{display:flex;align-items:baseline;gap:9px;padding:14px 16px;
  background:var(--marca-soft);border-radius:var(--r-s)}
.agua .n{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;
  line-height:1;color:var(--marca-ink);font-variant-numeric:tabular-nums}
.agua .l{font-size:13px;color:var(--ink-2);font-weight:600}

/* ---------- editor de recetas ---------- */
.ed{display:grid;grid-template-columns:1fr 108px 30px;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line-2)}
.ed:last-of-type{border-bottom:0}
.ed .n{font-size:14px;font-weight:500}
.ed .campo{position:relative}
.ed input{padding:8px 40px 8px 9px;font-size:14px;text-align:right;
  font-family:"DM Mono",monospace}
.ed .un{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
  color:var(--ink-3);pointer-events:none;font-family:"DM Mono",monospace}
.ed .x{width:30px;height:30px;border-radius:9px;color:var(--ink-3);font-size:16px;
  display:grid;place-items:center}
.ed .x:hover{background:var(--alerta-soft);color:var(--alerta)}
.plegable>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);
  font-weight:600;font-size:14.5px}
.plegable>summary::-webkit-details-marker{display:none}
.plegable>summary::after{content:"›";color:var(--ink-3);font-size:19px;transition:.2s}
.plegable[open]>summary::after{transform:rotate(90deg)}
.plegable[open]>summary{border-bottom-color:transparent}
.plegable .cuerpo{padding:2px 0 12px}
.badge-costo{font-family:"DM Mono",monospace;font-size:11px;padding:3px 8px;border-radius:99px;
  background:var(--marca-soft);color:var(--marca-ink);font-weight:600;white-space:nowrap}

/* ---------- pedidos ---------- */
.ped{background:var(--surface);border:1px solid var(--line-2);border-left:5px solid var(--line);
  border-radius:var(--r);padding:14px 15px;margin-bottom:10px;box-shadow:var(--sombra);
  transition:background .2s,border-color .2s}
.ped.s-prep{background:var(--marca-soft);border-left-color:var(--marca-2)}
.ped.s-entr{background:var(--horno-soft);border-left-color:var(--horno)}
.ped.s-list{background:var(--ok-soft);border-left-color:var(--ok)}
.ped .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ped .nombre{font-weight:700;font-size:15.5px}
.ped .meta{font-size:12px;color:var(--ink-2);margin-top:1px}
.ped .tot{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;
  font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ped .tot .tachado{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);
  text-decoration:line-through;font-family:"DM Mono",monospace}
.ped .sello{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  font-family:"DM Mono",monospace;margin-top:6px;display:inline-block;color:var(--ink-3)}
.ped.s-prep .sello{color:var(--marca-ink)} .ped.s-entr .sello{color:var(--horno-2)}
.ped.s-list .sello{color:var(--ok)}
.items{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--sunken);
  color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.chip.f{background:var(--horno-soft);color:var(--horno-2)}
.chip.regalo{background:var(--ok-soft);color:var(--ok);font-weight:700}
.obs{margin-top:8px;font-size:12.5px;color:var(--ink-2);font-style:italic;
  padding-left:9px;border-left:2px solid var(--line)}
.acciones{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
.tog{font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink-3);background:var(--surface);transition:.15s}
.tog[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini{font-size:12px;color:var(--ink-3);padding:6px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface)}
.del{margin-left:auto;font-size:12px;color:var(--ink-3);padding:6px 9px;border-radius:99px}
.del:hover{background:var(--alerta-soft);color:var(--alerta)}
.confirm{margin-top:10px;padding:11px 12px;background:var(--alerta-soft);border-radius:var(--r-s);
  font-size:13px;color:var(--alerta);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirm b{font-weight:700}
.confirm button{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px}
.confirm .si{background:var(--alerta);color:#fff}
.confirm .no{border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.panelito{margin-top:10px;padding:12px;background:var(--sunken);border-radius:var(--r-s)}

/* ---------- formularios ---------- */
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--sunken);color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:66px;resize:vertical}
input:focus,select:focus,textarea:focus{background:var(--surface)}
.sug{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.sug button{font-size:12.5px;padding:6px 11px;border-radius:99px;background:var(--marca-soft);
  color:var(--marca-ink);font-weight:600}
.seg{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--r-s);
  margin-bottom:11px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:var(--sombra)}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line-2)}
.step:last-of-type{border-bottom:0}
.step .t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.step .p{font-size:11.5px;color:var(--ink-3);font-family:"DM Mono",monospace}
.mas{display:flex;align-items:center;gap:10px}
.mas button{width:34px;height:34px;border-radius:11px;background:var(--sunken);
  font-size:19px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;line-height:1}
.mas .n{min-width:22px;text-align:center;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.linea{background:var(--sunken);border-radius:var(--r-s);padding:11px;margin-bottom:9px;
  display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.linea .sel{display:grid;grid-template-columns:1fr 98px;gap:6px}
.linea select{background:var(--surface);font-size:14px;padding:9px 4px 9px 10px}
.linea .mas{gap:7px} .linea .mas button{width:30px;height:30px;border-radius:9px;font-size:17px}
.borrar{width:32px;height:32px;border-radius:10px;color:var(--ink-3);font-size:17px;
  display:grid;place-items:center}
.agregar{width:100%;padding:12px;border-radius:var(--r-s);border:1.5px dashed var(--marca-2);
  color:var(--marca-ink);font-weight:700;font-size:14px;background:transparent}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--line-2)}
.sw{width:50px;height:29px;border-radius:99px;background:var(--line);position:relative;
  transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(21px)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:15px 16px;
  background:var(--marca);color:#fff;border-radius:var(--r);margin-bottom:12px}
.total.regalo{background:var(--ok)}
.total .l{font-size:13px;opacity:.88;font-weight:600}
.total .v{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;
  font-variant-numeric:tabular-nums}
.guardar{width:100%;padding:15px;border-radius:var(--r);background:var(--ink);color:var(--ground);
  font-weight:700;font-size:15.5px;box-shadow:var(--sombra)}
.guardar[disabled]{opacity:.4}
.peligro{background:var(--alerta-soft);color:var(--alerta);box-shadow:none}

/* ---------- stock ---------- */
.grupo{padding:13px 16px 7px;font-family:"DM Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--sunken);
  border-bottom:1px solid var(--line-2)}
.st{padding:12px 16px;border-bottom:1px solid var(--line-2)}
.st:last-child{border-bottom:0}
.st .lin{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.st .n{font-weight:600;font-size:14.5px}
.st .q{font-family:"DM Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums}
.st .d{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.st .bar{height:6px;border-radius:99px;background:var(--sunken);margin-top:7px;overflow:hidden}
.st .bar>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.st.justo .bar>i{background:var(--horno)} .st.falta .bar>i{background:var(--alerta)}
.st.falta .n{color:var(--alerta)}
.precio{font-family:"DM Mono",monospace;font-size:11.5px;padding:3px 9px;border-radius:99px;
  background:var(--marca-soft);color:var(--marca-ink);font-weight:600}
.precio:hover{background:var(--marca-2);color:#fff}
.edit-precio{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
.edit-precio input{padding:8px 11px;font-size:14px;flex:1;min-width:96px}
.edit-precio button{padding:8px 14px;border-radius:var(--r-s);background:var(--marca);
  color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.compra{display:grid;grid-template-columns:1fr 118px;gap:9px;margin-bottom:11px}
.mov{display:grid;grid-template-columns:1fr auto 30px;gap:9px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
.mov:last-child{border-bottom:0}
.mov .q{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-weight:500}
.mov .q.neg{color:var(--alerta)} .mov .q.pos{color:var(--ok)}
.mov .s{font-size:11px;color:var(--ink-3);font-family:"DM Mono",monospace}

/* ---------- clientes ---------- */
.cli{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.cli:last-child{border-bottom:0}
.ini{width:38px;height:38px;border-radius:12px;background:var(--marca-soft);color:var(--marca-ink);
  display:grid;place-items:center;font-weight:800;font-size:14px;
  font-family:"Bricolage Grotesque",sans-serif}
.cli .n{font-weight:600;font-size:14.5px}
.cli .d{font-size:12px;color:var(--ink-3)}
.cli .hx{display:block;font-family:"DM Mono",monospace;font-size:10.5px;margin-top:2px}
.cli .hx em{color:var(--viejo);font-style:normal;font-weight:600}
.cli .r{font-size:16px;color:var(--ink-3)}
.campos{display:grid;gap:11px}

/* ---------- gráficos ---------- */
.chart{margin-top:4px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--ink-2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:block}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:20px;
  justify-content:flex-start}
.col{flex:1;max-width:54px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;
  position:relative;min-width:0}
.col .pila{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.col .seg-g{background:var(--c-gan);border-radius:4px 4px 0 0;min-height:2px}
.col .seg-c{background:var(--c-cos);border-radius:0 0 4px 4px;min-height:2px}
.col .seg-c.solo{border-radius:4px}
.col .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;
  font-family:"DM Mono",monospace;color:var(--ink-2);white-space:nowrap}
.ejes{display:flex;gap:8px;margin-top:7px;justify-content:flex-start}
.ejes span{flex:1;max-width:54px;text-align:center;font-size:10px;color:var(--ink-3);
  font-family:"DM Mono",monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.ejes span.hoy{color:var(--marca-ink);font-weight:700}
.hb{margin-bottom:11px}
.hb .lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
.hb .lin b{font-family:"DM Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums;
  color:var(--ink-2)}
.hb .pista{height:9px;border-radius:99px;background:var(--sunken);overflow:hidden}
.hb .pista>i{display:block;height:100%;border-radius:99px;background:var(--marca-2);
  transition:width .4s}
.hb.foc .pista>i{background:var(--c-foc)}
.hb.pre .pista>i{background:var(--c-pre)}
.hero{padding:18px 16px;border-radius:var(--r);background:var(--marca);color:#fff;
  margin-bottom:12px;box-shadow:var(--sombra)}
.hero .l{font-size:12.5px;opacity:.85;font-weight:600}
.hero .v{font-family:"Bricolage Grotesque",sans-serif;font-size:36px;font-weight:800;
  line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hero .p{font-size:12.5px;opacity:.85;margin-top:5px}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-family:"DM Mono",monospace;font-weight:500;padding:0 0 7px}
.tabla td{padding:7px 0;border-top:1px solid var(--line-2);
  font-variant-numeric:tabular-nums}
.tabla td.num{text-align:right;font-family:"DM Mono",monospace}

/* ---------- amasado ---------- */
.grados{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.grados.tres{grid-template-columns:1fr 1fr 1fr}
.grados input{text-align:center;font-size:18px;font-weight:600}
.grados.chico input{font-size:15px;font-weight:500}
.termo{display:flex;align-items:baseline;gap:10px;padding:16px;border-radius:var(--r-s);
  background:var(--marca-soft)}
.termo .n{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;font-weight:800;
  line-height:1;color:var(--marca-ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.termo .l{font-size:13.5px;color:var(--ink-2);font-weight:600}
.termo.frio{background:var(--alerta-soft)}
.termo.frio .n{color:var(--alerta)}
.termo.caliente{background:var(--horno-soft)}
.termo.caliente .n{color:var(--horno-2)}
.cuenta{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3);
  margin:9px 0 0;text-align:center}
.reloj{font-family:"Bricolage Grotesque",sans-serif;font-size:58px;font-weight:800;
  text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.04em;
  line-height:1.05;margin:2px 0 0}
.reloj.corriendo{color:var(--marca-ink)}
.mandos{display:grid;grid-template-columns:2fr 1fr;gap:9px;margin-top:12px}
.mandos button{padding:14px 8px;border-radius:var(--r-s);font-weight:700;font-size:15px}
.mandos .go{background:var(--marca);color:#fff}
.mandos .go.pausa{background:var(--horno);color:#1a1206}
.mandos .cero{background:var(--sunken);color:var(--ink-2)}
.paso{display:grid;grid-template-columns:60px 1fr 30px;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-2)}
.paso:last-of-type{border-bottom:0}
.paso input{padding:8px 9px;font-size:14px}
.paso input.m{text-align:center;font-family:"DM Mono",monospace}
.paso .x{width:30px;height:30px;border-radius:9px;color:var(--ink-3);font-size:16px;
  display:grid;place-items:center}
.paso .x:hover{background:var(--alerta-soft);color:var(--alerta)}
.paso.ya input{opacity:.45}
.paso.cab-paso{padding:0 0 6px;font-family:"DM Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:0}
.paso.cab-paso span:first-child{text-align:center}
.alarma{position:fixed;left:0;right:0;bottom:64px;z-index:90;background:var(--horno);
  color:#1a1206;padding:16px;display:flex;align-items:center;gap:12px;
  max-width:468px;margin:0 auto;
  box-shadow:0 -10px 30px -12px rgba(0,0,0,.6);animation:latir 1s ease-in-out infinite}
@keyframes latir{50%{filter:brightness(1.14)}}
.alarma .txt{flex:1;min-width:0}
.alarma .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px}
.alarma .m{font-family:"DM Mono",monospace;font-size:11.5px;opacity:.75}
.alarma button{background:rgba(0,0,0,.2);padding:11px 17px;border-radius:99px;
  font-weight:700;font-size:14px;color:inherit;flex:0 0 auto}

/* ---------- esqueletos mientras llega ---------- */
.esq{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--sombra)}
.hueso{height:12px;border-radius:99px;background:var(--sunken);position:relative;
  overflow:hidden;margin:10px 0}
.hueso.alto{height:34px;border-radius:12px}
.hueso.titulo{height:15px;width:42%;margin:0 0 14px}
.hueso::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(127,139,156,.16),transparent);
  animation:brillo 1.4s infinite}
@keyframes brillo{100%{transform:translateX(100%)}}
.esq-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.esq-tiles .esq{margin:0}

/* ---------- tirar para actualizar ---------- */
#tirar{position:fixed;top:0;left:0;right:0;z-index:50;display:grid;place-items:center;
  pointer-events:none;height:0;overflow:visible}
#tirar .rueda{width:32px;height:32px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sombra);display:grid;place-items:center;
  transform:translateY(-44px);opacity:0}
#tirar .rueda svg{width:17px;height:17px;stroke:var(--marca-ink);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
#tirar.girando .rueda svg{animation:vuelta .9s linear infinite}
@keyframes vuelta{100%{transform:rotate(360deg)}}

/* ---------- nav ---------- */
.nav{position:sticky;bottom:0;margin-top:auto;flex:0 0 auto;width:100%;
  background:var(--surface);border-top:1px solid var(--line);display:grid;
  grid-template-columns:repeat(5,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:11px 2px 13px;display:grid;justify-items:center;gap:4px;
  font-size:10.5px;font-weight:600;color:var(--ink-3)}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--marca-ink)}
.nav .nuevo{gap:5px;color:var(--marca-ink);font-weight:700}
.nav .nuevo .fab{width:50px;height:50px;border-radius:17px;margin-top:-27px;
  background:var(--marca-2);color:#fff;display:grid;place-items:center;
  border:3px solid var(--surface);box-shadow:0 8px 18px -6px rgba(37,137,200,.6)}
.nav .nuevo .fab svg{width:26px;height:26px;stroke-width:2.6}
.nav .nuevo:active .fab{transform:scale(.93)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:99px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.aviso{margin:0 0 12px;padding:12px 15px;background:var(--horno-soft);color:var(--horno-2);
  border-radius:var(--r-s);font-size:13px;font-weight:500}
.fondo{position:fixed;inset:0;background:rgba(9,13,20,.5);z-index:80;display:grid;
  place-items:end center;padding:0 0 max(14px, env(safe-area-inset-bottom))}
.hoja{width:100%;max-width:468px;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sombra-alta);
  border-top:1px solid var(--line-2)}
.hoja .tirador{width:38px;height:4px;border-radius:99px;background:var(--line);
  margin:-6px auto 13px}
.hoja h2{font-size:17px;font-weight:800;margin-bottom:2px}
.hoja .s{font-size:12.5px;color:var(--ink-3);margin-bottom:13px}
#tt{position:fixed;z-index:70;background:var(--ink);color:var(--ground);padding:7px 11px;
  border-radius:9px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;
  white-space:nowrap;font-family:"DM Mono",monospace}
#tt.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ============ valores de arranque: solo se usan si la base está vacía ============ */
const REGLA_BASE = {
  capacidadBollos:65, maxAmasadora:7, kgTiradaDefault:4,
  grPrepizza:320, grFocMediana:350, grFocGrande:1175,

const MASA_BASE = {

                 'Extracto de malta':10,'Aceite de oliva':10,'Levadura':4},

                 'Aceite de oliva':15,'Levadura':6},
  por_unidad:{'Gas':80,'Bolsa polipropileno':1,'Bandeja de cartón':1,'Etiqueta impresa':1},

const TOP_BASE = {
  'PRE-TOM':{'Tomate':80,'Albahaca':10},
  'PRE-CEB':{'Cebolla':100},
  'FOC-ROM-M':{'Romero':5,'Aceite de oliva':10},   'FOC-ROM-G':{'Romero':16,'Aceite de oliva':30},
  'FOC-CHE-M':{'Tomates cherry':45,'Aceite de oliva':10}, 'FOC-CHE-G':{'Tomates cherry':200,'Aceite de oliva':30},
  'FOC-VER-M':{'Verdeo':28,'Aceite de oliva':10},  'FOC-VER-G':{'Verdeo':90,'Aceite de oliva':30},
  'FOC-ACE-M':{'Aceitunas verdes':25,'Aceitunas negras':25,'Aceite de oliva':10},
  'FOC-ACE-G':{'Aceitunas verdes':60,'Aceitunas negras':60,'Aceite de oliva':30},
  'FOC-PIC-M':{'Picante':1,'Aceite de oliva':10},  'FOC-PIC-G':{'Picante':3,'Aceite de oliva':30},
  'FOC-ROQ-M':{'Roquefort':30,'Nueces':8,'Miel':5,'Aceite de oliva':10},
  'FOC-ROQ-G':{'Roquefort':98,'Nueces':26,'Miel':16,'Aceite de oliva':30},
  'FOC-PES-M':{'Pesto':23,'Queso sardo':14,'Aceite de oliva':10},
  'FOC-PES-G':{'Pesto':75,'Queso sardo':45,'Aceite de oliva':30},
};
/* el orden en que Agus los pone en la amasadora */
const ORDEN_ING = ['Harina 00','Harina 000','Sémola rimacinata','Agua','Levadura',
                   'Extracto de malta','Sal','Aceite de oliva'];
const ZONAS = ['Centro','Hospital','UNLu','Barrio Arroyo','La Concepción','Valle Verde',
               'San Juan de Dios','Hostería Norte','Otros'];
const PAGOS = ['Transferencia','Efectivo','Mercado Pago','Pendiente'];
const NOM_DIA = ['lun','mar','mié','jue','vie','sáb','dom'];

/* ================================ estado ================================ */
let DB = null;
let REGLA = Object.assign({}, REGLA_BASE);
const S = {productos:[], insumos:[], clientes:[], tandas:[], pedidos:[], movimientos:[],
           recetas:[], config:[], semanaSel:null, vista:'tanda', listo:false, error:'',
           sembrado:{}, deGuardado:false};
const nuevo = {cliente:null, items:{}, focaccias:[], conEnvio:true, direccion:'', dirOtra:'',
               formaPago:'', obs:'', semana:null, sinCargo:false, totalManual:''};
const ui = {borrando:null, editaPrecio:null, editaCliente:null, borraCliente:false,
            editaCobro:null, compraSel:0, compraCant:1, compraSigno:1,
            masa:{amb:20, harina:20, pref:20, usaPref:false, canilla:18,
                  cual:'masa_prepizza', kg:4},
            nuevaTanda:false, rangoStats:0, abiertos:{}, tiraEn:null,
            editaBollos:false, editaCap:false, editaKg:null, largo:false,
            pasoNuevo:false};

/* ================================ utilidades ================================ */
const $ = s => document.querySelector(s);
const pesos = n => '$' + Math.round(n||0).toLocaleString('es-AR');
const pesosK = n => Math.abs(n) >= 1000 ? '$'+(n/1000).toFixed(0)+'k' : pesos(n);
const gr = n => Math.abs(n)>=1000 ? (n/1000).toFixed(2).replace('.',',')+' kg'
                        : (Math.abs(n)>=10?Math.round(n):(n||0).toFixed(1).replace('.',','))+' g';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
               'septiembre','octubre','noviembre','diciembre'];
const MES3 = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const iso = d => d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
const soloFecha = s => String(s == null ? '' : s).slice(0, 10);
const deIso = s => { const p = soloFecha(s).split('-').map(Number);
                     return new Date(p[0], (p[1]||1)-1, p[2]||1); };
const hoyIso = () => iso(new Date());
const suma = (f, n) => { const d = deIso(f); d.setDate(d.getDate()+n); return iso(d); };

/* --- semanas: la referencia es la semana, no el día --- */
function lunesDe(f){
  const d = deIso(f), dow = (d.getDay()+6)%7;   // 0 = lunes
  d.setDate(d.getDate()-dow); return iso(d);
}
const semanaHoy = () => lunesDe(hoyIso());
function rotuloSemana(sem){
  const a = deIso(sem), b = deIso(suma(sem,5));
  return a.getMonth()===b.getMonth()
    ? a.getDate()+' al '+b.getDate()+' '+MES3[a.getMonth()]
    : a.getDate()+' '+MES3[a.getMonth()]+' al '+b.getDate()+' '+MES3[b.getMonth()];
}
const tandaDoc = sem => S.tandas.find(t => t.id === sem) || {};
const diaEntrega = sem => Number(tandaDoc(sem).diaEntrega || 5);   // 1 lun … 7 dom
const fechaEntrega = sem => suma(sem, diaEntrega(sem)-1);
function rotuloEntrega(sem){
  const f = fechaEntrega(sem), d = deIso(f);
  return NOM_DIA[diaEntrega(sem)-1]+' '+d.getDate()+'/'+(d.getMonth()+1);
}
function semanasVisibles(){
  const base = semanaHoy(), out = [];
  for (let i=-3;i<=4;i++) out.push(suma(base, i*7));
  S.pedidos.forEach(p => { const s = lunesDe(p.tanda); if (out.indexOf(s)<0) out.push(s); });
  S.tandas.forEach(t => { const s = lunesDe(t.id); if (out.indexOf(s)<0) out.push(s); });
  return out.sort();
}
const esPasada = sem => sem < semanaHoy();

function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on');
  setTimeout(()=>e.classList.remove('on'), 1900); }

/* --- recetas vivas (de la base, con los valores de arranque como respaldo) --- */
function receta(clave){
  const d = S.recetas.find(r => r.id === clave);
  return d && d.items ? d.items : (MASA_BASE[clave] || {});
}
function topping(sku){
  const d = S.recetas.find(r => r.id === 'top_'+sku);
  return d && d.items ? d.items : (TOP_BASE[sku] || {});
}
/* el gramaje manda: de la receta sale la masa, y de la masa los bollos */
function clavesOrdenadas(items){
  return Object.keys(items).sort((a,b) => {
    const ia = ORDEN_ING.indexOf(a), ib = ORDEN_ING.indexOf(b);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1;
    if (ib >= 0) return 1;
    return a.localeCompare(b);
  });
}
function masaTotal(clave){
  const r = receta(clave); let t = 0;
  for (const k in r) t += Number(r[k])||0;
  return t;
}
const nGr = n => Number(n||0).toLocaleString('es-AR')+' g';
const plu = (n, uno, muchos) => n + ' ' + (n===1 ? uno : muchos);
const gramajeDe = p => p.tipo === 'Prepizza' ? REGLA.grPrepizza
  : (p.tamano === 'Grande' ? REGLA.grFocGrande : REGLA.grFocMediana);
const rindePre = () => masaTotal('masa_prepizza')/REGLA.grPrepizza;
const rindeMed = () => masaTotal('masa_focaccia')/REGLA.grFocMediana;
const rindeGra = () => masaTotal('masa_focaccia')/REGLA.grFocGrande;
/* cuántos lugares de cámara ocupa cada bollo. Es un dato declarado, no calculado:
   la grande se compara contra la mediana, que es su misma masa. */
const lugarDe = p => Number(p.tipo === 'Prepizza' ? REGLA.lugarPrepizza
  : (p.tamano === 'Grande' ? REGLA.lugarFocGrande : REGLA.lugarFocMediana)) || 1;

function precioGr(){
  const p = {};
  S.insumos.forEach(i => { p[i.nombre] = Number(i.precio_compra)/Number(i.contenido_gr||1); });
  return p;
}
function costoSku(sku, pg){
  const p = S.productos.find(x => x.sku === sku); if (!p) return 0;
  const esPre = p.tipo === 'Prepizza';
  const porKg = esPre ? rindePre() : (p.tamano === 'Grande' ? rindeGra() : rindeMed());
  let c = 0;
  const rec = esPre ? receta('masa_prepizza') : receta('masa_focaccia');
  for (const k in rec) if (k !== 'Agua') c += rec[k]/porKg * (pg[k]||0);
  const pu = receta('por_unidad');
  for (const k in pu) c += pu[k] * (pg[k]||0);
  const t = topping(sku);
  for (const k in t) c += t[k] * (pg[k]||0);
  return Math.round(c);
}
const productoDe = sku => S.productos.find(p => p.sku === sku) || {};
function badgeTam(p){
  if (p.tipo === 'Prepizza') return '<span class="tam u">única</span>';
  return p.tamano === 'Grande' ? '<span class="tam g">G · grande</span>'
                               : '<span class="tam m">M · mediana</span>';
}

/* --- plata de un pedido --- */
const brutoDe = p => (p.lineas||[]).reduce((a,l)=>a+l.cantidad*l.precioUnit, Number(p.envio||0));
function totalDe(p){
  if (p.sinCargo) return 0;
  if (p.totalManual != null && p.totalManual !== '') return Number(p.totalManual);
  return brutoDe(p);
}
const costoDe = p => (p.lineas||[]).reduce((a,l)=>a+l.cantidad*l.costoUnit, 0);

/* ---------------------- números de una semana ---------------------- */
function calcular(sem){
  const peds = S.pedidos.filter(p => lunesDe(p.tanda) === sem);
  const unidades = {};
  let bollos=0, bruto=0, cobrar=0, costo=0, envios=0, cobrado=0;
  peds.forEach(p => {
    (p.lineas||[]).forEach(l => {
      const prod = productoDe(l.sku);
      unidades[l.sku] = (unidades[l.sku]||0) + l.cantidad;
      bollos += l.cantidad * lugarDe(prod);
      costo += l.cantidad * l.costoUnit;
    });
    bruto += brutoDe(p); cobrar += totalDe(p);
    if (!p.sinCargo) envios += Number(p.envio||0);
    if (p.cobrado) cobrado += totalDe(p);
  });
  let pre=0, med=0, gra=0;
  Object.keys(unidades).forEach(sku => {
    const p = productoDe(sku);
    if (p.tipo === 'Prepizza') pre += unidades[sku];
    else if (p.tamano === 'Grande') gra += unidades[sku];
    else med += unidades[sku];
  });
  const t = tandaDoc(sem);
  /* los pedidos dan un piso de harina; casi siempre amasamos más que eso,
     así que el número final se puede fijar a mano y todo lo demás lo sigue */
  const puesto = v => (v != null && v !== '' && !isNaN(Number(v))) ? Number(v) : null;
  const kgPreAuto = pre ? Math.ceil(pre/rindePre() - 1e-9) : 0;
  const harinaFoc = med/rindeMed() + gra/rindeGra();
  const kgFocAuto = harinaFoc ? Math.ceil(harinaFoc - 1e-9) : 0;
  const kgPreManual = puesto(t.kgPreManual), kgFocManual = puesto(t.kgFocManual);
  const kgPre = kgPreManual != null ? kgPreManual : kgPreAuto;
  const kgFoc = kgFocManual != null ? kgFocManual : kgFocAuto;
  const kgTirada = Number(t.kg_tirada) || REGLA.kgTiradaDefault;
  const perd = Number(t.perdidas||0);
  const salen = Math.floor(kgPre * masaTotal('masa_prepizza')/REGLA.grPrepizza + 1e-9);
  const focDeMas = Math.max(0, Math.floor((kgFoc - harinaFoc)*rindeMed() + 1e-9));
  /* lo que va a ocupar la cámara es lo que sale de la masa, no lo que pidieron:
     los bollos de más también ocupan lugar */
  const bollosPedidos = bollos;
  const bollosAuto = salen*Number(REGLA.lugarPrepizza||1)
    + (med + focDeMas)*Number(REGLA.lugarFocMediana||1)
    + gra*Number(REGLA.lugarFocGrande||3);
  bollos = bollosAuto;
  const manual = puesto(t.bollosManual);
  if (manual != null) bollos = manual;

  const consumo = {};
  const sumarC = (k,g) => { if (k !== 'Agua') consumo[k] = (consumo[k]||0)+g; };
  const rp = receta('masa_prepizza'), rf = receta('masa_focaccia'), pu = receta('por_unidad');
  for (const k in rp) sumarC(k, rp[k]*kgPre);
  for (const k in rf) sumarC(k, rf[k]*kgFoc);
  const totalUn = Object.keys(unidades).reduce((a,s)=>a+unidades[s],0);
  for (const k in pu) sumarC(k, pu[k]*totalUn);
  Object.keys(unidades).forEach(sku => {
    const t2 = topping(sku);
    for (const k in t2) sumarC(k, t2[k]*unidades[sku]);
  });

  return {sem, pedidos:peds, unidades, pre, med, gra, kgPre, kgFoc, kgTirada, harinaFoc,
    kgPreAuto, kgFocAuto, kgPreManual, kgFocManual, bollosPedidos,
    bollos, bollosAuto, manual,
    uso:bollos/REGLA.capacidadBollos, totalUn,
    plata:{bruto, aCobrar:cobrar, bonificado:bruto-cobrar, envios, costo,
           ganancia:cobrar-costo, cobrado, pendiente:cobrar-cobrado},
    sobrantes:{salen, pedidas:pre, sobran:salen-pre, perdidas:perd,
               libres:Math.max(0, salen-pre-perd), focDeMas},
    consumo};
}
function repartirKg(kg, tope){
  if (!kg) return [];
  tope = Math.min(tope||REGLA.kgTiradaDefault, REGLA.maxAmasadora);
  const n = Math.ceil(kg/tope), base = Math.floor(kg/n), resto = kg - base*n, out = [];
  for (let i=0;i<n;i++) out.push(i<resto ? base+1 : base);
  return out;
}
const stockDe = nombre =>
  S.movimientos.reduce((a,m)=> a + (m.insumo===nombre ? Number(m.gramos)||0 : 0), 0);

/* los insumos del amasado primero: son los que más se mueven */
const GRUPOS = ['De las masas','Por unidad horneada','Toppings y otros'];
function ordenDeMasa(){
  const peso = {};
  [receta('masa_prepizza'), receta('masa_focaccia')].forEach(r =>
    Object.keys(r).forEach(k => { if (k!=='Agua') peso[k] = (peso[k]||0) + r[k]; }));
  return Object.keys(peso).sort((a,b) => peso[b]-peso[a]);
}
function insumosOrdenados(){
  const masa = ordenDeMasa(), pu = Object.keys(receta('por_unidad'));
  const grupo = n => masa.indexOf(n)>=0 ? 0 : pu.indexOf(n)>=0 ? 1 : 2;
  return S.insumos.slice().sort((a,b) => {
    const ga = grupo(a.nombre), gb = grupo(b.nombre);
    if (ga !== gb) return ga - gb;
    if (ga === 0) return masa.indexOf(a.nombre) - masa.indexOf(b.nombre);
    if (ga === 1) return pu.indexOf(a.nombre) - pu.indexOf(b.nombre);
    return a.nombre.localeCompare(b.nombre);
  }).map(i => Object.assign({__g:grupo(i.nombre)}, i));
}

/* ================================ persistencia ================================
   El panel corre en dos casas: dentro de Claude (capacidad db) o servido por
   Apps Script desde el Drive de Agus. Todo lo de abajo es lo único que cambia. */
const COLS = ['productos','insumos','clientes','tandas','pedidos','movimientos',
              'recetas','config'];
const API = {activo:false, base:'', pin:'', pidePin:false, version:0, cola:[],
             enviando:false, cargando:false, falla:0, motivo:'', via:''};
const guardaLocal = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leeLocal = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const guardaCola = () => guardaLocal('vl_cola', JSON.stringify(API.cola));

/* Le hablamos al servidor por HTTP común. El POST va como texto plano a
   propósito: así el navegador no pide permiso previo y Apps Script contesta. */
async function pedir(params){
  const partes = [];
  for (const k in params) partes.push(k + '=' + encodeURIComponent(params[k]));
  const res = await fetch(API.base + '?' + partes.join('&'), {method:'GET'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function porPost(cuerpo){
  const res = await fetch(API.base, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(cuerpo),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
/* La dirección tiene un largo máximo, así que partimos el lote en tandas
   que entren cómodas. */
function enGrupos(ops){
  const largo = a => encodeURIComponent(JSON.stringify(a)).length;
  const out = []; let g = [];
  ops.forEach(o => {
    if (g.length && largo(g.concat([o])) > 6000){ out.push(g); g = []; }
    g.push(o);
  });
  if (g.length) out.push(g);
  return out;
}
async function porGet(cuerpo){
  let ultima = {ok:true, version:API.version, hechas:0};
  const grupos = enGrupos(cuerpo.ops || []);
  for (let i = 0; i < grupos.length; i++){
    const r = await pedir({r:'escribir', pin:cuerpo.pin, ops:JSON.stringify(grupos[i])});
    if (!r.ok) return r;
    ultima = r;
  }
  return ultima;
}
/* Guardar por POST es lo prolijo, pero algunos teléfonos no lo dejan salir.
   Si falla, mandamos lo mismo por la vía de la lectura, que sabemos que anda,
   y nos quedamos ahí. Repetir una orden no hace daño: cada una dice cómo tiene
   que quedar el dato, no "sumale uno". */
async function mandar(cuerpo){
  if (API.via === 'get') return porGet(cuerpo);
  let fallo = '';
  try {
    const r = await porPost(cuerpo);
    if (r && r.ok){ API.via = 'post'; guardaLocal('vl_via','post'); return r; }
    if (r && r.error === 'pin') return r;
    fallo = 'POST: ' + ((r && r.error) || 'sin respuesta');
  } catch(e){
    fallo = 'POST: ' + String((e && e.message) || e).slice(0, 90);
  }
  const r2 = await porGet(cuerpo);
  if (r2 && r2.ok){ API.via = 'get'; guardaLocal('vl_via','get'); API.motivo = fallo; }
  return r2;
}

/* La última foto de los datos queda en el teléfono. Al abrir, la app se dibuja
   con eso al instante y recién después sale a buscar lo nuevo: no hay pantalla
   en blanco esperando a Google. */
function guardarFoto(){
  try { guardaLocal('vl_datos', JSON.stringify({
    version: API.version, cuando: Date.now(),
    datos: COLS.reduce((a,k) => { a[k] = S[k]; return a; }, {}),
  })); } catch(e){}
}
function usarFoto(){
  let c = null;
  try { c = JSON.parse(leeLocal('vl_datos') || 'null'); } catch(e){ return false; }
  if (!c || !c.datos || !c.datos.productos) return false;
  COLS.forEach(k => { S[k] = c.datos[k] || []; });
  API.version = Number(c.version) || 0;
  normalizarDatos();
  refrescarReglas();
  API.cola.forEach(o => aplicarLocal(o.op, o.ruta, o.datos));
  S.listo = true; S.deGuardado = true; S.error = '';
  return true;
}

async function conectar(){
  const base = (typeof window.__VL_BASE === 'string' &&
                window.__VL_BASE.indexOf('http') === 0) ? window.__VL_BASE : '';
  if (base){ API.base = base; return conectarApps(); }
  try { DB = await claude.use('db'); } catch(e){ DB = null; }
  if (!DB){ S.error = 'sin-db'; render(); return; }
  const col = (nombre, destino, alLlegar) => DB.collection(nombre).onSnapshot(
    snap => { S[destino] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
              if (alLlegar) alLlegar();
              S.listo = true; render(); },
    () => { S.error = 'sin-db'; render(); });
  col('productos','productos');
  col('insumos','insumos');
  col('clientes','clientes');
  col('tandas','tandas');
  col('pedidos','pedidos');
  col('movimientos','movimientos');
  col('recetas','recetas', sembrarRecetas);
  col('config','config', sembrarConfig);
}

/* Apps Script dibuja la página a 980 px de ancho y después la encoge al ancho
   real del teléfono. Adentro no puedo tocar eso, así que agrando la app en la
   misma proporción: queda del tamaño que corresponde y ocupando todo el ancho. */
function ajustarEscala(){
  if (!API.activo) return;
  const raiz = document.documentElement;
  const pantalla = (window.screen && window.screen.width) || window.innerWidth;
  const z = pantalla ? window.innerWidth / pantalla : 1;
  if (z > 1.15 && z < 6){
    raiz.style.zoom = z;
    raiz.dataset.escala = z.toFixed(2);
  } else {
    raiz.style.zoom = '';
    delete raiz.dataset.escala;
  }
}

/* ---------------------- casa propia: Apps Script ---------------------- */
function conectarApps(){
  API.activo = true;
  API.pidePin = window.__VL_PIN === '1';
  API.pin = leeLocal('vl_pin') || '';
  try { API.cola = JSON.parse(leeLocal('vl_cola') || '[]') || []; } catch(e){ API.cola = []; }
  API.via = leeLocal('vl_via') || '';
  ajustarEscala();
  window.addEventListener('resize', ajustarEscala);
  window.addEventListener('orientationchange', () => setTimeout(ajustarEscala, 300));
  setInterval(mirarVersion, 25000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden){ mirarVersion(); vaciarCola(); } });
  window.addEventListener('online', () => { API.falla = 0; vaciarCola(); });
  pintarConex();
  const punto = document.getElementById('conex');
  if (punto){ punto.style.cursor = 'pointer'; punto.onclick = hojaConexion; }
  if (API.pidePin && !API.pin) return pantallaPin(false);
  if (usarFoto()){ recordarPantalla(); render(); }
  cargarTodo();
}

async function cargarTodo(){
  if (API.cargando) return;
  API.cargando = true; pintarConex();
  try {
    const r = await pedir({r:'todo', pin:API.pin});
    if (!r.ok){
      if (r.error === 'pin'){ API.pin = ''; guardaLocal('vl_pin',''); return pantallaPin(true); }
      throw new Error(r.error || 'no pude leer');
    }
    API.version = r.version;
    COLS.forEach(c => { S[c] = r.datos[c] || []; });
    normalizarDatos();
    S.deGuardado = false;
    /* lo que todavía no llegó al servidor lo volvemos a pintar encima:
       así no parece que se perdió */
    API.cola.forEach(o => aplicarLocal(o.op, o.ruta, o.datos));
    S.listo = true; S.error = ''; API.falla = 0;
    sembrarRecetas(); sembrarConfig();
    guardarFoto();
    render();
  } catch(e){
    API.falla++;
    API.motivo = String((e && e.message) || e || '').slice(0, 160);
    if (!S.listo) S.error = 'sin-db';
    render();
  } finally {
    API.cargando = false; pintarConex();
    if (API.cola.length) vaciarCola();
  }
}

async function mirarVersion(){
  if (!API.activo || !S.listo || API.cola.length || API.cargando || document.hidden) return;
  try {
    const r = await pedir({r:'version', pin:API.pin});
    if (r.ok && r.version !== API.version) cargarTodo();
  } catch(e){}
}

/* Lo que llega de la planilla no siempre tiene la forma que le dimos: una fecha
   puede volver con hora pegada y un sí/no puede volver como la palabra "false",
   que para el navegador es texto con letras y por lo tanto un sí. Acá se
   empareja todo antes de que lo use nadie. */
const siNo = v => v === true || v === 1 || v === '1'
  || v === 'true' || v === 'TRUE' || v === 'VERDADERO';
const BANDERAS = ['preparado', 'entregado', 'cobrado', 'sinCargo'];
function normalizarDatos(){
  S.pedidos.forEach(p => {
    if (p.tanda) p.tanda = soloFecha(p.tanda);
    BANDERAS.forEach(k => { p[k] = siNo(p[k]); });
  });
  S.tandas.forEach(t => { t.id = soloFecha(t.id); });
  S.movimientos.forEach(m => { if (m.fecha) m.fecha = soloFecha(m.fecha); });
}

const partes = ruta => { const i = ruta.indexOf('/');
  return [ruta.slice(0,i), ruta.slice(i+1)]; };

function aplicarLocal(op, ruta, datos){
  const p = partes(ruta), lista = S[p[0]];
  if (!lista) return;
  let i = -1;
  for (let k=0;k<lista.length;k++) if (lista[k].id === p[1]) { i = k; break; }
  if (op === 'delete'){ if (i >= 0) lista.splice(i,1); return; }
  const base = (op === 'update' && i >= 0) ? Object.assign({}, lista[i]) : {};
  Object.assign(base, datos || {});
  base.id = p[1];
  if (i >= 0) lista[i] = base; else lista.push(base);
  if (p[0] === 'config') refrescarReglas();
}

async function vaciarCola(){
  if (!API.activo || API.enviando || !API.cola.length) return;
  API.enviando = true; pintarConex();
  const lote = API.cola.slice(0, 40);
  try {
    const ops = lote.map(o => { const p = partes(o.ruta);
      return {op:o.op, col:p[0], id:p[1], datos:o.datos}; });
    const r = await mandar({pin:API.pin, ops:ops});
    if (!r.ok) throw new Error(r.error || 'no pude guardar');
    API.cola.splice(0, lote.length); guardaCola();
    API.version = r.version; API.falla = 0;
  } catch(e){
    API.falla++;
    API.motivo = String((e && e.message) || e || '').slice(0, 160);
  } finally {
    API.enviando = false; pintarConex();
    if (API.cola.length){
      if (API.falla) setTimeout(vaciarCola, Math.min(15000, 2500*API.falla));
      else vaciarCola();
    }
  }
}

function pintarConex(){
  const e = document.getElementById('conex');
  if (!e) return;
  e.hidden = !API.activo;
  if (!API.activo) return;
  const n = API.cola.length;
  e.className = 'conex' + (API.falla ? ' mal' : (n || API.cargando) ? ' yendo' : '');
  e.textContent = API.falla
      ? (n ? n + (n===1?' cambio sin guardar':' cambios sin guardar') : 'sin conexión')
      : n ? 'guardando…' : '';
}

/* Tocando el puntito de la cabecera se ve qué está pasando por detrás.
   Sirve para cuando algo no guarda y hay que saber por qué. */
function hojaConexion(){
  const viejo = document.querySelector('.fondo'); if (viejo) viejo.remove();
  const f = document.createElement('div');
  f.className = 'fondo';
  const via = API.via === 'get' ? 'por dirección' : API.via === 'post' ? 'directa' : 'sin probar';
  const fila = (l, v) => '<div class="rec-row"><span>'+l+'</span><b>'+esc(v)+'</b></div>';
  f.innerHTML = '<div class="hoja"><div class="tirador"></div>'
    + '<h2>Conexión</h2><div class="s">Cómo viene hablando la app con la planilla.</div>'
    + fila('Servidor', API.base ? 'conectado' : 'no hay')
    + fila('Datos cargados', S.listo ? 'sí' : 'no')
    + fila('Vía para guardar', via)
    + fila('Cambios sin guardar', String(API.cola.length))
    + (API.motivo ? '<div class="aviso" style="margin-top:12px">'+esc(API.motivo)+'</div>' : '')
    + '<button class="guardar" id="cx-probar" style="margin-top:12px">Probar guardado</button>'
    + '<button class="guardar" id="cx-cerrar" style="margin-top:8px;background:var(--sunken);color:var(--ink-2)">Cerrar</button>'
    + '</div>';
  document.body.appendChild(f);
  f.onclick = e => { if (e.target === f) f.remove(); };
  f.querySelector('#cx-cerrar').onclick = () => f.remove();
  f.querySelector('#cx-probar').onclick = async () => {
    const b = f.querySelector('#cx-probar');
    b.textContent = 'Probando…'; b.disabled = true;
    const prueba = {pin:API.pin, ops:[{op:'set', col:'config', id:'_prueba',
      datos:{valores:{cuando:new Date().toISOString()}}}]};
    let dice = '';
    try { const r = await porPost(prueba); dice = r && r.ok ? 'directa: anda' : 'directa: ' + ((r&&r.error)||'no'); }
    catch(e){ dice = 'directa: ' + String((e && e.message) || e).slice(0,70); }
    try { const r = await porGet(prueba); dice += ' · por dirección: ' + (r && r.ok ? 'anda' : ((r&&r.error)||'no')); }
    catch(e){ dice += ' · por dirección: ' + String((e && e.message) || e).slice(0,70); }
    /* no dejamos basura en la planilla */
    try { await porGet({pin:API.pin, ops:[{op:'delete', col:'config', id:'_prueba'}]}); } catch(e){}
    b.disabled = false; b.textContent = 'Probar de nuevo';
    const av = document.createElement('div');
    av.className = 'aviso'; av.style.marginTop = '12px'; av.textContent = dice;
    b.parentNode.insertBefore(av, b);
  };
}

/* ---------------------- lo que usa todo el panel ---------------------- */
function escribir(op, ruta, datos){
  if (!API.activo){
    if (!DB) return Promise.resolve();
    const d = DB.doc(ruta);
    return op === 'set' ? d.set(datos) : op === 'update' ? d.update(datos) : d.delete();
  }
  aplicarLocal(op, ruta, datos);
  API.cola.push({op, ruta, datos}); guardaCola();
  render(); vaciarCola();
  return Promise.resolve();
}
const guardar = (ruta, datos) => escribir('set', ruta, datos);
const parchar = (ruta, datos) => escribir('update', ruta, datos);
const borrar  = ruta => escribir('delete', ruta);
const nuevoId = pref => pref + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function sembrarRecetas(){
  if (S.sembrado.recetas || !S.productos.length) return;
  if (S.recetas.length) { S.sembrado.recetas = true; return; }
  S.sembrado.recetas = true;
  Object.keys(MASA_BASE).forEach(k => guardar('recetas/'+k, {items:MASA_BASE[k]}));
  Object.keys(TOP_BASE).forEach(k => guardar('recetas/top_'+k, {items:TOP_BASE[k]}));
}
/* Las reglas vuelven a leerse cada vez que cambian, sin esperar a que el
   servidor conteste: si tocás un gramaje, el número de al lado cambia solo. */
function refrescarReglas(){
  const doc = S.config.find(c => c.id === 'reglas');
  if (doc) REGLA = Object.assign({}, REGLA_BASE, doc.valores || {});
}
function sembrarConfig(){
  if (!S.config.find(c => c.id === 'pasos') && !S.sembrado.pasos){
    S.sembrado.pasos = true;
    guardarPasos(PASOS_BASE);
  }
  const doc = S.config.find(c => c.id === 'reglas');
  if (doc) { refrescarReglas(); return; }
  if (S.sembrado.config) return;
  S.sembrado.config = true;
  guardar('config/reglas', {valores:REGLA_BASE});
}

/* ================================ armado ================================ */
/* La pantalla negra del arranque se retira sola cuando ya hay algo que mostrar. */
function sacarArranque(){
  const a = document.getElementById('arranque');
  if (!a || a.classList.contains('se-va')) return;
  a.classList.add('se-va');
  setTimeout(() => { if (a.parentNode) a.parentNode.removeChild(a); }, 520);
}

function render(){
  if (S.listo || S.error) sacarArranque();
  if (!S.semanaSel) S.semanaSel = semanaHoy();
  pintarCabecera(); pintarStrip();
  ({tanda:vistaTanda, pedidos:vistaPedidos, nuevo:vistaNuevo, stock:vistaStock,
    clientes:vistaClientes, stats:vistaStats, recetas:vistaRecetas,
    amasado:vistaAmasado})[S.vista]();
  engancharReintento();
}

function pintarCabecera(){
  const sem = S.semanaSel, ahora = sem === semanaHoy(), pasada = esPasada(sem);
  const conTira = S.vista==='tanda' || S.vista==='pedidos';
  const T = {
    tanda:   ['Tanda', 'entrega ' + rotuloEntrega(sem)],
    pedidos: ['Pedidos', 'pedidos de la semana'],
    nuevo:   ['Nuevo pedido', 'elegí para qué semana es'],
    stock:   ['Stock', 'compras, salidas y precios'],
    clientes:['Clientes', S.clientes.length + ' en la base'],
    amasado: ['Amasado', 'temperatura del agua y tiempos'],
    stats:   ['Estadísticas', 'cómo viene el negocio'],
    recetas: ['Recetas y reglas', 'lo que define los costos'],
  }[S.vista];
  $('#pantalla').textContent = T[0];
  $('#pantalla').className = 'pantalla' + (conTira ? '' : ' solo');
  $('#titulo').textContent = conTira ? rotuloSemana(sem) : '';
  $('#titulo').hidden = !conTira;
  $('#subtitulo').textContent = T[1];
  const bar = $('#titulo-bar');
  bar.className = 'titulo' + (conTira && ahora ? ' ahora' : conTira && pasada ? ' pasada' : '');
  $('#pill').textContent = !conTira ? '' : ahora ? 'esta semana' : pasada ? 'cerrada' : 'próxima';
  $('#pill').style.display = conTira ? '' : 'none';
  $('#tandas-nav').style.display = conTira ? '' : 'none';
  $('#b-masa').setAttribute('aria-current', String(S.vista==='amasado'));
  $('#b-stats').setAttribute('aria-current', String(S.vista==='stats'));
  $('#b-recetas').setAttribute('aria-current', String(S.vista==='recetas'));
}

function pintarStrip(){
  const hoy = semanaHoy();
  const chips = semanasVisibles().map(sem => {
    const c = calcular(sem);
    const clase = [sem===hoy?'esta':'', esPasada(sem)?'pasada':''].join(' ');
    return '<button class="tchip '+clase+'" data-s="'+sem+'" aria-pressed="'+(sem===S.semanaSel)+'">'
      + '<div class="f">'+rotuloSemana(sem)+'</div>'
      + '<div class="u">'+(sem===hoy?'esta semana · ':'')+(c.bollos? c.bollos+' bollos':'sin pedidos')+'</div></button>';
  }).join('');
  $('#tandas-strip').innerHTML = chips + '<button class="tchip mas" id="mas-tanda" title="Crear otra tanda">+</button>';
  $('#tandas-strip').querySelectorAll('[data-s]').forEach(b => {
    b.onclick = () => {
      if (ui.largo){ ui.largo = false; return; }
      S.semanaSel = b.dataset.s; ui.nuevaTanda = false;
      guardaLocal('vl_semana', S.semanaSel); render();
      b.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    };
    alMantener(b, () => hojaEntrega(b.dataset.s));
  });
  $('#mas-tanda').onclick = () => { ui.nuevaTanda = true; irA('tanda'); };
  if (ui.tiraEn !== S.semanaSel){
    ui.tiraEn = S.semanaSel;
    const el = $('#tandas-strip [data-s="'+S.semanaSel+'"]');
    if (el) el.scrollIntoView({inline:'center', block:'nearest'});
  }
}

    clave:'foc', titulo:'Masa de focaccias',

      + (c.kgPre ? '<div class="rec-cab"><span class="t">Prepizzas</span>'

        + '<div class="rec-row"><span>'+(c.kgPreManual!=null

        + '</span><b>'+c.sobrantes.sobran+'</b></div>'
        + '<div class="step" style="margin-top:4px">'
        + '<div><div class="t">Se perdieron en producción</div><div class="p">falladas, masa pasada</div></div>'
        + '<div class="mas"><button id="p-menos">−</button><span class="n">'+c.sobrantes.perdidas+'</span>'

        + (c.gra?'<div class="rec-row"><span>Grandes de '+nGr(REGLA.grFocGrande)+'</span><b>'+plu(c.gra,'bollo','bollos')+'</b></div>':'')

    $('#k-mas').onclick   = ()=>escribirTanda({kg_tirada:Math.min(REGLA.maxAmasadora,c.kgTirada+1)});

    $('#p-mas').onclick   = ()=>escribirTanda({perdidas:c.sobrantes.perdidas+1});

  $('#b-cap').onclick = () => { ui.editaCap = !ui.editaCap; ui.editaBollos = false; vistaTanda(); };

    const v = Number($('#in-bollos').value);
    if (isNaN(v) || v < 0) return toast('Poné un número válido');
    ui.editaBollos = false;
    await escribirTanda({bollosManual:v}); toast('Bollos fijados en '+v); };
  if ($('#auto-bollos')) $('#auto-bollos').onclick = async () => {
    ui.editaBollos = false;
    await escribirTanda({bollosManual:null}); toast('Vuelve al cálculo por gramaje'); };
  if ($('#ok-cap')) $('#ok-cap').onclick = async () => {
    const v = Number($('#in-cap').value);
    if (!(v > 0)) return toast('Poné un número válido');
    ui.editaCap = false;

    ui.editaKg = null;
    await escribirTanda(cual === 'pre' ? {kgPreManual:v} : {kgFocManual:v});
    toast(v + ' kg de masa de ' + (cual === 'pre' ? 'prepizza' : 'focaccia'));
  };
  if ($('#auto-kg')) $('#auto-kg').onclick = async () => {
    const cual = ui.editaKg; ui.editaKg = null;
    await escribirTanda(cual === 'pre' ? {kgPreManual:null} : {kgFocManual:null});
    toast('Vuelve a lo que piden los pedidos');
  };
}

function escribirSemana(sem, campos){
  const t = tandaDoc(sem);
  return guardar('tandas/'+sem, Object.assign(
    {semana:sem, diaEntrega:diaEntrega(sem),
     kg_tirada:Number(t.kg_tirada)||REGLA.kgTiradaDefault,
     perdidas:Number(t.perdidas)||0, estado:t.estado||'abierta',
     bollosManual:(t.bollosManual==null?null:t.bollosManual),
     kgPreManual:(t.kgPreManual==null?null:t.kgPreManual),
     kgFocManual:(t.kgFocManual==null?null:t.kgFocManual)}, campos));
}

function hojaEntrega(sem){
  const viejo = document.querySelector('.fondo'); if (viejo) viejo.remove();
  const f = document.createElement('div');
  f.className = 'fondo';
  f.innerHTML = '<div class="hoja"><div class="tirador"></div>'
    + '<h2>' + rotuloSemana(sem) + '</h2>'
    + '<div class="s">¿Qué día entregás esta semana?</div>'
    + '<div class="dias">' + NOM_DIA.map((d,i) =>
        '<button data-dia="'+(i+1)+'" aria-pressed="'+(diaEntrega(sem)===i+1)+'">'+d+'</button>').join('')
    + '</div></div>';
  document.body.appendChild(f);
  f.onclick = e => { if (e.target === f) f.remove(); };
  f.querySelectorAll('[data-dia]').forEach(b => b.onclick = async () => {
    await escribirSemana(sem, {diaEntrega:Number(b.dataset.dia)});
    f.remove(); toast('Entrega el '+rotuloEntrega(sem));
  });
}

function alMantener(el, fn){
  let t = null;
  const soltar = () => { if (t){ clearTimeout(t); t = null; } };
  el.addEventListener('pointerdown', () => {
    soltar(); ui.largo = false;
    t = setTimeout(() => {
      t = null; ui.largo = true; el.classList.add('eligiendo'); fn();
      setTimeout(() => { ui.largo = false; el.classList.remove('eligiendo'); }, 800);
    }, 450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, soltar));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function bloqueMasa(o){
  const t = repartirKg(o.kg, o.kgTirada);
  const cards = t.map((k,i) => '<div class="tirada">'
      + '<div class="cab"><span class="t">Tirada '+(i+1)+'</span><span class="s">'+k+' kg de harina</span></div>'
      + clavesOrdenadas(o.rec).map(x=>'<div class="rec-row '+(x==='Agua'?'agua-l':'')+'">'
        + '<span>'+esc(x)+'</span><b>'+gr(o.rec[x]*k)+'</b></div>').join('')+'</div>').join('');
  const abierto = ui.editaKg === o.clave;
  return '<div class="rec-cab con-kg"><div><span class="t">'+o.titulo+'</span>'
      + '<span class="s">'+o.detalle+' en '+t.length+' tirada'+(t.length>1?'s':'')+'</span></div>'
      + '<button class="kg-chip'+(o.manual!=null?' amano':'')+'" data-kg="'+o.clave+'">'
      + o.kg+' kg</button></div>'
    + (abierto ? '<div class="edit-precio" style="margin:0 0 11px">'
        + '<input type="number" id="in-kg" value="'+o.kg+'" min="0" step="1" '
        + 'aria-label="kilos de harina de esta masa">'
        + '<button id="ok-kg">Fijar</button>'
        + (o.manual!=null ? '<button id="auto-kg" style="background:var(--sunken);color:var(--ink-2)">'
            + 'Volver a '+o.auto+'</button>' : '')
        + '</div>'

/* ============================== AMASADO ==============================
   Dos cosas que se usan con las manos en la masa: a cuánto va el agua y
   un cronómetro que avisa cuándo toca cada cosa. */

const PASOS_BASE = [
  {min:4,  que:'Agregar el agua de a poco'},
  {min:9,  que:'Sal'},
  {min:13, que:'Aceite de oliva'},
];
function pasos(){
  const d = S.config.find(c => c.id === 'pasos');
  return ((d && d.lista) || []).slice()
    .filter(x => x && x.que !== undefined)
    .sort((a,b) => Number(a.min) - Number(b.min));
}
const guardarPasos = lista => guardar('config/pasos', {lista:lista});

/* --- la cuenta de siempre: los factores suman y el agua compensa --- */
function tempAgua(){
  const m = ui.masa;
  const n = m.usaPref ? 4 : 3;
  const partes = [Number(m.amb)||0, Number(m.harina)||0];
  if (m.usaPref) partes.push(Number(m.pref)||0);
  partes.push(Number(REGLA.friccion)||0);
  const suma = partes.reduce((a,b)=>a+b, 0);
  return {n, partes, suma, t: (Number(REGLA.tdm)||24)*n - suma};
}
/* Cuánto de esa agua conviene poner en hielo para llegar al número.
   El hielo tiene que derretirse antes de enfriar: por eso el 80. */
function hielo(objetivo, canilla, gramosAgua){
  if (!(canilla > objetivo) || !(gramosAgua > 0)) return 0;
  return Math.round(gramosAgua * (canilla - objetivo) / (80 + canilla));
}
const guardaMasa = () => guardaLocal('vl_masa', JSON.stringify(ui.masa));

/* ------------------------------ cronómetro ------------------------------ */
const CRONO = {corriendo:false, desde:0, acumulado:0, sonados:{}, ctx:null, wake:null};
const cronoMs = () => CRONO.acumulado + (CRONO.corriendo ? Date.now()-CRONO.desde : 0);
const mmss = ms => { const t = Math.max(0, Math.floor(ms/1000));
  return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); };
const claveDe = p => p.min + '\u00b7' + p.que;

function guardaCrono(){ guardaLocal('vl_crono', JSON.stringify({
  corriendo:CRONO.corriendo, desde:CRONO.desde,
  acumulado:CRONO.acumulado, sonados:CRONO.sonados})); }
function cargaCrono(){
  try {
    const c = JSON.parse(leeLocal('vl_crono') || 'null');
    if (!c) return;
    CRONO.corriendo = !!c.corriendo; CRONO.desde = Number(c.desde)||0;
    CRONO.acumulado = Number(c.acumulado)||0; CRONO.sonados = c.sonados || {};
  } catch(e){}
}
async function pantallaDespierta(){
  try { if (navigator.wakeLock && !CRONO.wake)
    CRONO.wake = await navigator.wakeLock.request('screen'); } catch(e){}
}
function soltarPantalla(){
  try { if (CRONO.wake){ CRONO.wake.release(); CRONO.wake = null; } } catch(e){}
}
function arrancarCrono(){
  if (CRONO.corriendo) return;
  /* el navegador solo deja hacer ruido si nace de un toque: lo abrimos acá */
  try {
    CRONO.ctx = CRONO.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (CRONO.ctx.state === 'suspended') CRONO.ctx.resume();
  } catch(e){}
  CRONO.corriendo = true; CRONO.desde = Date.now();
  guardaCrono(); pantallaDespierta();
}
function pausarCrono(){
  if (!CRONO.corriendo) return;
  CRONO.acumulado = cronoMs(); CRONO.corriendo = false;
  guardaCrono(); soltarPantalla();
}
function cerarCrono(){
  CRONO.corriendo = false; CRONO.acumulado = 0; CRONO.desde = 0; CRONO.sonados = {};
  guardaCrono(); soltarPantalla();
  const v = document.getElementById('alarma'); if (v) v.remove();
}
function pitar(){
  try {
    const ctx = CRONO.ctx || (CRONO.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    [0, .38, .76].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + d;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(.45, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + .32);
    });
  } catch(e){}
}
function avisar(paso){
  pitar();
  notificar(paso);
  try { if (navigator.vibrate) navigator.vibrate([300,150,300,150,600]); } catch(e){}
  const viejo = document.getElementById('alarma'); if (viejo) viejo.remove();
  const d = document.createElement('div');
  d.className = 'alarma'; d.id = 'alarma';
  d.innerHTML = '<div class="txt"><div class="m">minuto '+esc(paso.min)+'</div>'
    + '<div class="t">'+esc(paso.que)+'</div></div><button id="alarma-ok">Listo</button>';
  document.body.appendChild(d);
  /* justo arriba de la botonera, para no taparte los botones */
  const nav = document.getElementById('nav');
  if (nav) d.style.bottom = nav.offsetHeight + 'px';
  const cerrar = () => { const x = document.getElementById('alarma'); if (x) x.remove(); };
  d.querySelector('#alarma-ok').onclick = cerrar;
  setTimeout(cerrar, 90000);
}
/* Late siempre, esté la pantalla de amasado a la vista o no: el aviso tiene que
   llegar aunque estés cargando un pedido. */
function latidoCrono(){
  const ms = cronoMs();
  const el = document.getElementById('reloj');
  if (el) el.textContent = mmss(ms);
  if (!CRONO.corriendo || !S.listo) return;
  let sonoAlguno = false;
  pasos().forEach(paso => {
    const k = claveDe(paso);
    if (CRONO.sonados[k]) return;
    if (ms >= Number(paso.min)*60000){
      CRONO.sonados[k] = true; sonoAlguno = true; avisar(paso);
    }
  });
  if (sonoAlguno){ guardaCrono(); pintarPasos(); }
}
function pintarPasos(){
  const c = document.getElementById('lista-pasos');
  if (c) c.innerHTML = filasPasos();
  engancharPasos();
}

/* ------------------------------ la pantalla ------------------------------ */
function filasPasos(){
  const l = pasos();
  if (!l.length) return '<div class="vacio" style="padding:16px">Sin avisos todavía.</div>';
  return l.map((x,i) => '<div class="paso'+(CRONO.sonados[claveDe(x)]?' ya':'')+'">'
    + '<input class="m" type="number" min="0" step="1" value="'+esc(x.min)+'" '
    + 'data-pmin="'+i+'" aria-label="minuto">'

function lineaAgua(aguaTot, obj, hi, m){

      + gr(aguaTot-hi)+', de agua.</div>';

      + ' °C ya está por debajo de '+obj+' °C: templala hasta ahí y listo, sin hielo.</div>';

    + '<div><span class="n">'+gr(aguaTot)+'</span> <span class="l">de agua para '

function engancharPasos(){

    const l = pasos();

  };
  cont.querySelectorAll('[data-pmin]').forEach(e => e.onchange = () => {
    guardarUno(Number(e.dataset.pmin), 'min', Math.max(0, Number(e.value)||0));

/* ========================= TIRAR PARA ACTUALIZAR =========================
   El gesto de siempre: desde arriba de todo, tirás hacia abajo y suelta.
   No se mete con la tira de semanas ni con los carruseles de tiradas. */
const TIRO = {y0:0, x0:0, activo:false, dist:0, girando:false};
const TOPE = 72;

function cajaTiro(){
  let c = document.getElementById('tirar');
  if (!c){
    c = document.createElement('div');
    c.id = 'tirar';
    c.innerHTML = '<div class="rueda"><svg viewBox="0 0 24 24">'
      + '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></div>';
    document.body.appendChild(c);
  }
  return c;
}
function pintarTiro(d){
  const r = cajaTiro().querySelector('.rueda');
  const y = Math.min(d, TOPE*1.5);
  r.style.transform = 'translateY('+(y-44)+'px) rotate('+(y*3)+'deg)';
  r.style.opacity = Math.min(1, d/TOPE);
}
function soltarTiro(){
  const c = cajaTiro(), r = c.querySelector('.rueda');
  c.classList.remove('girando');
  r.style.transform = 'translateY(-44px)';
  r.style.opacity = 0;
}
/* dentro de algo que se desliza al costado, el gesto es de eso, no nuestro */
function enCarrusel(el){
  for (let n = el; n && n !== document.body; n = n.parentElement){
    if (n.scrollWidth > n.clientWidth + 4){
      const o = getComputedStyle(n).overflowX;
      if (o === 'auto' || o === 'scroll') return true;
    }
  }
  return false;
}
function engancharTiro(){
  document.addEventListener('touchstart', e => {
    if (TIRO.girando || e.touches.length !== 1) return;
    if (window.scrollY > 2) return;
    if (document.querySelector('.fondo, .fondo-pin')) return;
    if (enCarrusel(e.target)) return;
    TIRO.y0 = e.touches[0].clientY; TIRO.x0 = e.touches[0].clientX;
    TIRO.activo = true; TIRO.dist = 0;
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if (!TIRO.activo) return;
    const dy = e.touches[0].clientY - TIRO.y0;
    const dx = Math.abs(e.touches[0].clientX - TIRO.x0);
    if (dy < 0 || dx > Math.abs(dy)){ TIRO.activo = false; soltarTiro(); return; }
    TIRO.dist = dy * .55;           /* con resistencia, como corresponde */
    pintarTiro(TIRO.dist);
  }, {passive:true});

  const fin = () => {
    if (!TIRO.activo) return;
    TIRO.activo = false;
    if (TIRO.dist >= TOPE) actualizarTirando(); else soltarTiro();
  };
  ['touchend','touchcancel'].forEach(ev => document.addEventListener(ev, fin, {passive:true}));
}
async function actualizarTirando(){
  if (TIRO.girando) return;
  TIRO.girando = true;
  const c = cajaTiro(), r = c.querySelector('.rueda');
  c.classList.add('girando');
  r.style.transform = 'translateY(16px)'; r.style.opacity = 1;
  if (API.activo){ API.falla = 0; API.motivo = ''; await cargarTodo(); await vaciarCola(); }
  /* un respiro para que se vea que pasó algo */
  setTimeout(() => { TIRO.girando = false; soltarTiro(); toast('Al día'); }, 420);
}

    + pre.map(p=>'<div class="step"><div><div class="t">'+esc(p.nombre.replace('Prepizza ',''))+'</div>'

    + '<div class="card"><div class="rot">Focaccias</div>'
