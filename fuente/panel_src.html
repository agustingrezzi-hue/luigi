<title>Panel Vamos Luigi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#EDF2F6; --surface:#FFFFFF; --sunken:#F3F7FA;
  --ink:#131A26; --ink-2:#4B586B; --ink-3:#8994A6;
  --line:#DEE7EE; --line-2:#EAF0F5;
  --marca:#1C77AE; --marca-2:#2589C8; --marca-ink:#17658F; --marca-soft:#E4F1FA;
  --negro:#0B0D10;
  --horno:#B96A15; --horno-soft:#FAEEDC; --horno-2:#8A4F10;
  --ok:#0F6E4A; --ok-soft:#DFF1E8;
  --alerta:#A81F16; --alerta-soft:#FBE5E2;
  --c-pre:#2589C8; --c-foc:#B96A15; --c-gan:#0F6E4A; --c-cos:#B7C3D1;
  --viejo:#8E4640; --viejo-soft:#F0E0DE; --viejo-linea:#D9BDB9;
  --sig:#6D4BC2;
  --sombra:0 1px 2px rgba(19,26,38,.05), 0 6px 20px -12px rgba(19,26,38,.25);
  --sombra-alta:0 2px 4px rgba(19,26,38,.06), 0 18px 40px -22px rgba(19,26,38,.45);
  --r:18px; --r-s:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B0E15; --surface:#151A24; --sunken:#1B212D;
  --ink:#E9EDF5; --ink-2:#AEB9CB; --ink-3:#7C889B;
  --line:#28303F; --line-2:#212836;
  --marca:#2589C8; --marca-2:#48A6E0; --marca-ink:#7CC6EE; --marca-soft:#123449;
  --negro:#05070A;
  --horno:#E0A05B; --horno-soft:#2E2214; --horno-2:#F0BE83;
  --ok:#5FC69A; --ok-soft:#12301F;
  --alerta:#F08A80; --alerta-soft:#33170F;
  --c-pre:#3E9BD8; --c-foc:#BA7F39; --c-gan:#35A073; --c-cos:#3B4657;
  --viejo:#C08A84; --viejo-soft:#2A1917; --viejo-linea:#4A2E2B;
  --sig:#A68AF0;
  --sombra:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.9);
  --sombra-alta:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -24px rgba(0,0,0,1);
}}
:root[data-theme="dark"]{
  --ground:#0B0E15; --surface:#151A24; --sunken:#1B212D;
  --ink:#E9EDF5; --ink-2:#AEB9CB; --ink-3:#7C889B;
  --line:#28303F; --line-2:#212836;
  --marca:#2589C8; --marca-2:#48A6E0; --marca-ink:#7CC6EE; --marca-soft:#123449;
  --negro:#05070A;
  --horno:#E0A05B; --horno-soft:#2E2214; --horno-2:#F0BE83;
  --ok:#5FC69A; --ok-soft:#12301F;
  --alerta:#F08A80; --alerta-soft:#33170F;
  --c-pre:#3E9BD8; --c-foc:#BA7F39; --c-gan:#35A073; --c-cos:#3B4657;
  --viejo:#C08A84; --viejo-soft:#2A1917; --viejo-linea:#4A2E2B;
  --sig:#A68AF0;
  --sombra:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.9);
  --sombra-alta:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -24px rgba(0,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);
  font-family:"Figtree",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2{font-family:"Bricolage Grotesque","Figtree",sans-serif;margin:0;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--marca-2);outline-offset:2px}

.app{max-width:468px;margin:0 auto;min-height:100%;background:var(--ground);
  position:relative;box-shadow:var(--sombra-alta);display:flex;flex-direction:column}
.cuerpo{flex:1 0 auto;padding-bottom:14px}

/* ---------- cabecera: barra de marca ---------- */
.marca{background:var(--negro);padding:11px 16px 12px;display:flex;align-items:center;
  position:sticky;top:0;z-index:35;
  justify-content:space-between;gap:12px}
.marca .logo{height:38px;width:auto;display:block}
.marca .acc{display:flex;gap:6px;align-items:center}
.conex{font-family:"DM Mono",monospace;font-size:10px;color:#7F8B9C;display:flex;
  align-items:center;gap:5px;padding-right:2px;white-space:nowrap}
.conex::before{content:"";width:7px;height:7px;border-radius:50%;background:#3FAE7E;
  display:block;flex:0 0 auto}
.conex.yendo::before{background:#E0A05B}
.conex.mal{color:#E08A82}
.conex.mal::before{background:#D9584C}
.marca .acc button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:#7F8B9C;background:rgba(255,255,255,.06);transition:.15s}
.marca .acc button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.marca .acc button[aria-current="true"]{background:var(--marca-2);color:#fff}

/* ---------- cabecera: módulo de título ---------- */
.titulo{margin:12px 12px 0;padding:11px 15px;border-radius:15px;background:var(--surface);
  border:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;
  gap:10px;box-shadow:var(--sombra);transition:background .25s,color .25s}
.titulo .pantalla{font-family:"Figtree",sans-serif;font-size:11.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--marca-ink);line-height:1.2;
  margin-bottom:2px}
.titulo .pantalla.solo{font-size:16px;letter-spacing:.09em;margin-bottom:3px;color:var(--ink)}
.titulo h1{font-size:17px;font-weight:800;line-height:1.2}
.titulo h1[hidden]{display:none}
.titulo .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.titulo .pill{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:5px 10px;border-radius:99px;white-space:nowrap;
  background:var(--sunken);color:var(--ink-3);font-weight:500}
.titulo.ahora{background:linear-gradient(135deg,var(--marca) 0%,var(--marca-2) 100%);
  border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px rgba(37,137,200,.7)}
.titulo.ahora .sub{color:rgba(255,255,255,.82)}
.titulo.ahora .pantalla{color:rgba(255,255,255,.78)}
.titulo.ahora .pill{background:rgba(255,255,255,.22);color:#fff;font-weight:700}
.titulo.cerrada{background:var(--ok-soft);border-color:var(--ok)}
.titulo.cerrada h1,.titulo.cerrada .rango{color:var(--ok)}
.titulo.cerrada .sub,.titulo.cerrada .pantalla{color:var(--ok);opacity:.85}
.titulo.cerrada .pill{background:var(--ok);color:var(--surface);font-weight:700}
.titulo.partida{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;
  background:var(--surface);border-color:var(--line-2)}
.titulo.partida .arriba{display:flex;align-items:center;gap:9px;padding:9px 14px 8px}
.titulo.partida .pantalla{font-size:10.5px;margin:0;color:var(--ink-3)}
.titulo.partida .rango{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:15px;flex:1;letter-spacing:-.02em;color:var(--ink)}
.titulo.partida .trozos{display:flex;border-top:1px solid var(--line-2)}
.titulo.partida .trozo{flex:1;padding:9px 6px 11px;display:grid;gap:2px;justify-items:center;
  border-left:1px solid var(--line-2);transition:.15s}
.titulo.partida .trozo:first-child{border-left:0}
.titulo.partida .trozo .d{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:14.5px;text-transform:capitalize;color:var(--ink-2)}
.titulo.partida .trozo .d em{font-style:normal;font-family:"DM Mono",monospace;font-size:10.5px;
  font-weight:500;opacity:.65;margin-right:6px;letter-spacing:.04em}
.titulo.partida .trozo .q{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.titulo.partida .trozo[aria-pressed="true"]{background:var(--marca)}
.titulo.partida .trozo[aria-pressed="true"] .d{color:#fff}
.titulo.partida .trozo[aria-pressed="true"] .q{color:rgba(255,255,255,.82)}
.titulo.partida.cerrada .trozo[aria-pressed="true"]{background:var(--ok)}
.titulo.partida.cerrada .trozo[aria-pressed="true"] .d{color:var(--surface)}
.titulo.partida.cerrada .trozo[aria-pressed="true"] .q{color:var(--surface);opacity:.85}
.titulo.partida.pasada .trozo[aria-pressed="true"]{background:var(--viejo)}
.titulo.partida.pasada .trozo[aria-pressed="true"] .d{color:var(--surface)}
.tchip .e{font-size:10px;color:var(--ink-3);margin-top:2px;font-family:"DM Mono",monospace;
  white-space:nowrap;text-transform:capitalize}
.tchip[aria-pressed="true"] .e{color:rgba(255,255,255,.78)}
.tchip.pasada .e{color:var(--viejo);opacity:.75}
.tchip.cerrada{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tchip.cerrada .u,.tchip.cerrada .e{color:var(--ok);opacity:.8}
.tchip.cerrada[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tchip.cerrada[aria-pressed="true"] .u,.tchip.cerrada[aria-pressed="true"] .e{color:var(--surface);opacity:.85}
.titulo.pasada{background:var(--viejo-soft);border-color:var(--viejo-linea)}
.titulo.pasada h1{color:var(--viejo)}
.titulo.pasada .sub{color:var(--viejo);opacity:.8}
.titulo.pasada .pantalla{color:var(--viejo);opacity:.85}
.titulo.pasada .pill{background:var(--viejo);color:var(--surface);font-weight:700;opacity:.9}

.cal{background:var(--surface);border-bottom:1px solid var(--line-2)}
.cal[hidden]{display:none}
.cal-tira{display:flex;overflow-x:auto;padding:4px 8px 5px;gap:1px;cursor:pointer;
  scrollbar-width:none;-webkit-tap-highlight-color:transparent}
.cal-tira::-webkit-scrollbar{height:0}
.cal-tira .dia{flex:0 0 29px;display:grid;justify-items:center;gap:0;padding:2px 0 3px;
  border-radius:8px;position:relative;line-height:1.05}
.cal-tira .dia i{font-style:normal;font-family:"DM Mono",monospace;font-size:8.5px;
  color:var(--ink-3);letter-spacing:.02em}
.cal-tira .dia b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:12.5px;
  color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal-tira .dia.dom b{color:var(--ink-3);font-weight:500}
.cal-tira .dia.lun{margin-left:5px}
.cal-tira .dia.sel{background:var(--marca-soft)}
.cal-tira .dia.hoy b{color:var(--marca-ink);text-decoration:underline;text-underline-offset:2px;
  text-decoration-thickness:2px}
.cal-tira .dia.rep b{color:#fff;background:var(--rep);border-radius:99px;width:21px;height:17px;
  display:grid;place-items:center;font-size:11.5px}
.cal-tira .mes{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:"DM Mono",monospace;font-size:8.5px;letter-spacing:.12em;color:var(--marca-ink);
  padding:0 2px;margin-left:4px;align-self:center}
.cal-mes{padding:4px 14px 12px}
.cal-mes .cab{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cal-mes .cab span{flex:1;text-align:center;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:15px;text-transform:capitalize}
.cal-mes .cab button{width:34px;height:32px;border-radius:10px;background:var(--sunken);
  font-size:19px;color:var(--ink-2)}
.cal-mes .cab .hoyb{width:auto;padding:0 12px;font-size:12.5px;font-weight:700;color:var(--marca-ink)}
.cal-mes .sem,.cal-mes .grilla{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-mes .sem span{text-align:center;font-family:"DM Mono",monospace;font-size:10px;color:var(--ink-3);
  padding:2px 0}
.cal-mes .c{height:40px;border-radius:10px;display:grid;justify-items:center;align-content:center;
  gap:1px;position:relative}
.cal-mes .c b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;
  width:28px;height:24px;display:grid;place-items:center;border-radius:99px;color:var(--ink-2)}
.cal-mes .c i{font-style:normal;font-family:"DM Mono",monospace;font-size:8.5px;color:var(--ink-3);
  line-height:1}
.cal-mes .c.fuera b{color:var(--ink-3);opacity:.5}
.cal-mes .c.sel{background:var(--marca-soft)}
.cal-mes .c.hoy b{box-shadow:inset 0 0 0 1.5px var(--marca-2)}
.cal-mes .c.rep b{background:var(--rep);color:#fff}
.rep.esta{--rep:var(--marca)} .rep.sig{--rep:var(--sig)} .rep.fut{--rep:var(--marca-2)}
.rep.pasada{--rep:var(--viejo)} .rep.debe{--rep:var(--alerta)}
.cal-tira .dia.rep.fut b,.cal-mes .c.rep.fut b,.cal-tira .dia.rep.vacia b,.cal-mes .c.rep.vacia b{
  background:transparent;color:var(--rep);box-shadow:inset 0 0 0 1.5px var(--rep)}
.cal-tira .dia.marcado::after,.cal-mes .c.marcado::after{content:"";position:absolute;bottom:1px;
  left:50%;transform:translateX(-50%);width:16px;height:2.5px;border-radius:2px;background:var(--mk,var(--sig))}
.m-vacaciones{--mk:#1FA88A} .m-feria{--mk:var(--horno)} .m-evento{--mk:var(--sig)} .m-otro{--mk:var(--ink-3)}
.cal-mes .marcas{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.cal-mes .marca{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  background:var(--sunken);text-align:left}
.cal-mes .marca .d{font-family:"DM Mono",monospace;font-size:11.5px;color:#fff;background:var(--mk,var(--sig));
  border-radius:99px;padding:2px 8px;white-space:nowrap}
.cal-mes .marca .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-mes .ref{display:flex;gap:12px;justify-content:center;margin-top:8px;flex-wrap:wrap;
  font-size:11px;color:var(--ink-3)}
.cal-mes .ref .rep::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--rep);margin-right:5px;vertical-align:-1px}
.cal-mes .ref .rep.fut::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rep)}
.tchip .u{text-transform:none}
.tchip.debe:not([aria-pressed="true"]) .u{color:var(--alerta);opacity:1;font-weight:600}
.tchip.falta:not([aria-pressed="true"]) .u{color:var(--horno-2);opacity:1;font-weight:600}
.titulo.partida .trozo.debe:not([aria-pressed="true"]) .q{color:var(--alerta);font-weight:600}
.titulo.partida .trozo.falta:not([aria-pressed="true"]) .q{color:var(--horno-2);font-weight:600}
.tchip .f em{font-style:normal;font-family:"DM Mono",monospace;font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:.08em;margin-left:8px;padding:2px 7px;border-radius:99px;
  background:var(--marca-soft);color:var(--marca-ink);vertical-align:2px}
.tchip .f em.vieja{background:var(--viejo-soft);color:var(--viejo)}
.tchip .f em.prox{background:var(--sunken);color:var(--ink-3)}
.tchip[aria-pressed="true"] .f em{background:rgba(255,255,255,.22);color:#fff}
.titulo.partida{border:0;box-shadow:none;background:transparent;margin-top:10px}
.titulo.partida .trozos{border-top:0;gap:8px}
.titulo.partida .trozo{border-left:0;border:1px solid var(--line-2);border-radius:14px;
  background:var(--surface);box-shadow:var(--sombra);padding:10px 6px 12px}
/* ---------- tira de tandas ---------- */
.tandas-nav{flex:0 0 auto;padding:10px 0 0}
.tandas-strip{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scroll-snap-type:x proximity}
.tandas-strip::-webkit-scrollbar{height:0}
.tchip{flex:0 0 auto;scroll-snap-align:center;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:9px 14px;width:var(--chip,220px);
  overflow:hidden;transform-origin:50% 50%;
  transition:transform .12s linear, opacity .12s linear, background .15s, border-color .15s;
  text-align:left;transition:.15s;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation}
.tchip.eligiendo{box-shadow:0 0 0 3px var(--marca-2)}
.tchip .f{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;
  letter-spacing:.01em;white-space:nowrap}
.tchip .f i{font-style:normal;font-family:"DM Mono",monospace;font-size:10px;font-weight:500;
  opacity:.7;margin-left:5px;vertical-align:1px}
.tchip .u{overflow:hidden;text-overflow:ellipsis}
.tchip .f{font-size:17px}
.tandas-strip{scroll-snap-type:x mandatory}
.tchip .u{font-size:10.5px;color:var(--ink-3);margin-top:2px;font-family:"DM Mono",monospace;
  white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--marca);border-color:var(--marca);color:#fff}
.tchip[aria-pressed="true"] .u{color:rgba(255,255,255,.82)}
.tchip.esta{border-color:var(--marca-2);box-shadow:0 0 0 2px var(--marca-soft)}
.tchip.pasada{background:var(--viejo-soft);border-color:var(--viejo-linea);color:var(--viejo)}
.tchip.pasada .u{color:var(--viejo);opacity:.75}
.tchip.pasada[aria-pressed="true"]{background:var(--viejo);border-color:var(--viejo);color:var(--surface)}
.tchip.pasada[aria-pressed="true"] .u{color:var(--surface);opacity:.85}
.tchip.mas{width:52px;display:grid;place-items:center;font-size:20px;color:var(--marca-ink);
  border-style:dashed;border-color:var(--marca-2)}

/* ---------- vistas ---------- */
.vista{display:none;padding:14px 12px 0}
.vista.on{display:block}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sombra);
  border:1px solid var(--line-2);padding:16px;margin-bottom:12px}
.card.tight{padding:0;overflow:hidden}
.rot{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:10px}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.vacio{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.motivo{margin-top:12px;font-family:"DM Mono",monospace;font-size:11px;color:var(--alerta);
  background:var(--alerta-soft);padding:8px 10px;border-radius:9px;word-break:break-word;
  text-align:left}

/* ---------- día de entrega ---------- */
.dias{display:flex;gap:5px;flex-wrap:wrap}
.dias button{flex:1;min-width:38px;padding:8px 2px;border-radius:10px;background:var(--sunken);
  font-size:12px;font-weight:600;color:var(--ink-2);text-transform:capitalize}
.dias button[aria-pressed="true"]{background:var(--marca);color:#fff}
.entrega-fila{padding:11px 0;border-bottom:1px solid var(--line-2)}
.entrega-fila:last-of-type{border-bottom:0}
.entrega-fila .cab{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:7px}
.entrega-fila .cab .n{font-size:12px;font-weight:700;color:var(--ink-2)}
.entrega-fila .cab .x{width:28px;height:28px;border-radius:8px;color:var(--ink-3);
  font-size:16px;display:grid;place-items:center}
.entrega-fila .cab .x:hover{background:var(--alerta-soft);color:var(--alerta)}

/* ---------- medidor ---------- */
.medidor{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.medidor .n{font-family:"Bricolage Grotesque",sans-serif;font-size:38px;font-weight:800;
  line-height:1;font-variant-numeric:tabular-nums}
.medidor .de{font-size:14px;color:var(--ink-3)}
.medidor .edita-n,.medidor .edita-cap{font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;line-height:1;font-variant-numeric:tabular-nums;padding:2px 8px;
  border-radius:11px;border:1px dashed var(--line);transition:.15s}
.medidor .edita-n{font-size:38px;color:var(--ink)}
.medidor .edita-cap{font-size:22px;color:var(--ink-2)}
.medidor .edita-n:hover,.medidor .edita-cap:hover{background:var(--marca-soft);
  border-color:var(--marca-2);color:var(--marca-ink)}
.barra{height:12px;border-radius:99px;background:var(--sunken);overflow:hidden}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.barra.alta>i{background:var(--horno)} .barra.pasado>i{background:var(--alerta)}
.pie{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.estado{display:inline-block;font-size:12.5px;font-weight:700;padding:5px 11px;
  border-radius:99px;margin-top:11px}
.estado.ok{background:var(--ok-soft);color:var(--ok)}
.estado.alta{background:var(--horno-soft);color:var(--horno)}
.estado.mal{background:var(--alerta-soft);color:var(--alerta)}
.salida{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line-2)}
.salida:last-of-type{border-bottom:0}
.salida .n{font-size:14px;font-weight:500}
.salida .p{font-size:11px;color:var(--ink-3);font-family:"DM Mono",monospace;margin-top:2px}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:12px 14px;box-shadow:var(--sombra)}
.tile .l{font-size:11.5px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;
  margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tile .p{font-size:11px;color:var(--ink-3);font-family:"DM Mono",monospace;margin-top:2px}
.tile.plata .v{color:var(--marca-ink)} .tile.acento .v{color:var(--ok)}
.tile.pend .v{color:var(--alerta)} .tile.env .v{color:var(--horno)}
.tile.ancho{grid-column:1 / -1}

/* ---------- producción ---------- */
.fila{display:grid;grid-template-columns:6px 1fr auto;gap:11px;align-items:center;
  padding:11px 16px 11px 0;border-bottom:1px solid var(--line-2)}
.fila:last-child{border-bottom:0}
.fila .tira{width:6px;height:34px;border-radius:0 4px 4px 0;background:var(--marca-2)}
.fila.med .tira{background:var(--horno-soft);border:1px solid var(--horno)}
.fila.gra .tira{background:var(--horno)}
.fila .nom{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fila .q{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;
  font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.fila .sub{font-size:11.5px;color:var(--ink-3);font-family:"DM Mono",monospace;margin-top:3px}
.tam{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;padding:2px 7px;
  border-radius:99px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tam.m{background:var(--horno-soft);color:var(--horno-2);border:1px solid var(--horno-soft)}
.tam.g{background:var(--horno);color:#fff}
.tam.u{background:var(--marca-soft);color:var(--marca-ink)}

/* ---------- recetas ---------- */
.rec-cab{margin:4px 0 10px}
.rec-cab.con-kg{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kg-chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;
  padding:6px 13px;border-radius:12px;background:var(--sunken);color:var(--ink);
  border:1px dashed var(--line);white-space:nowrap;transition:.15s}
.kg-chip:hover{background:var(--marca-soft);border-color:var(--marca-2);color:var(--marca-ink)}
.kg-chip.amano{background:var(--marca);border-color:var(--marca);color:#fff;border-style:solid}
.rec-cab .t{display:block;font-weight:700;font-size:15.5px}
.rec-cab .s{display:block;font-size:12px;color:var(--ink-3);font-family:"DM Mono",monospace;
  margin-top:2px}
.tiradas{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -16px;padding:2px 16px 8px}
.tiradas::-webkit-scrollbar{height:0}
.tirada{flex:0 0 76%;scroll-snap-align:start;background:var(--sunken);
  border:1px solid var(--line-2);border-radius:var(--r-s);padding:13px 15px}
.tirada .cab{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tirada .cab .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px}
.tirada .cab .s{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.rec-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--line-2);font-size:13.5px}
.rec-row:last-child{border-bottom:0}
.rec-row b{font-family:"DM Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums}
.rec-row.agua-l,.rec-row.agua-l b{color:var(--marca-ink)}
.tirada .fase{display:flex;justify-content:space-between;align-items:baseline;
  font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 0 3px}
.tirada .fase.biga{color:var(--horno-2);padding-top:4px}
.tirada .fase b{font-weight:500;letter-spacing:0;text-transform:none}
.rec-row.biga-l,.rec-row.biga-l b{color:var(--horno-2);font-weight:700}
.switch.biga-sw{border-bottom:0;padding:4px 0 12px}
.switch .t{font-weight:700;font-size:14px}
.switch .p{font-size:12px;color:var(--ink-3);margin-top:1px}
.rec-sep{height:1px;background:var(--line);margin:16px 0 4px}
.swipe{font-size:11.5px;color:var(--ink-3);text-align:center;margin:2px 0 0;
  font-family:"DM Mono",monospace}
.clima{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.clima input{text-align:center;font-size:17px;font-weight:600}
.agua{display:flex;align-items:baseline;gap:9px;padding:14px 16px;
  background:var(--marca-soft);border-radius:var(--r-s)}
.agua .n{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;
  line-height:1;color:var(--marca-ink);font-variant-numeric:tabular-nums}
.agua .l{font-size:13px;color:var(--ink-2);font-weight:600}

/* ---------- editor de recetas ---------- */
.ed{display:grid;grid-template-columns:1fr 108px 30px;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line-2)}
.ed:last-of-type{border-bottom:0}
.ed .n{font-size:14px;font-weight:500}
.ed .campo{position:relative}
.ed input{padding:8px 40px 8px 9px;font-size:14px;text-align:right;
  font-family:"DM Mono",monospace}
.ed input[data-addsel]{padding:8px 9px;text-align:left;font-family:inherit}
.ed .un{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
  color:var(--ink-3);pointer-events:none;font-family:"DM Mono",monospace}
.ed .x{width:30px;height:30px;border-radius:9px;color:var(--ink-3);font-size:16px;
  display:grid;place-items:center}
.ed .x:hover{background:var(--alerta-soft);color:var(--alerta)}
.plegable>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);
  font-weight:600;font-size:14.5px}
.plegable>summary::-webkit-details-marker{display:none}
.plegable>summary::after{content:"›";color:var(--ink-3);font-size:19px;transition:.2s}
.plegable[open]>summary::after{transform:rotate(90deg)}
.plegable[open]>summary{border-bottom-color:transparent}
.plegable .cuerpo{padding:2px 0 12px}
.badge-costo{font-family:"DM Mono",monospace;font-size:11px;padding:3px 8px;border-radius:99px;
  background:var(--marca-soft);color:var(--marca-ink);font-weight:600;white-space:nowrap}

/* ---------- pedidos ---------- */
.ped{background:var(--surface);border:1px solid var(--line-2);border-left:5px solid var(--line);
  border-radius:var(--r);padding:14px 15px;margin-bottom:10px;box-shadow:var(--sombra);
  transition:background .2s,border-color .2s}
.ped.s-prep{background:var(--marca-soft);border-left-color:var(--marca-2)}
.ped.s-entr{background:var(--horno-soft);border-left-color:var(--horno)}
.ped.s-list{background:var(--ok-soft);border-left-color:var(--ok)}
.ped .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ped .nombre{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px;
  flex-wrap:wrap}
.dia-ped{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;padding:2px 7px;
  border-radius:99px;background:var(--sunken);color:var(--ink-3);text-transform:capitalize}
.ped .meta{font-size:12px;color:var(--ink-2);margin-top:1px}
.ped .tot{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;
  font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ped .tot .tachado{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);
  text-decoration:line-through;font-family:"DM Mono",monospace}
.ped .sello{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  font-family:"DM Mono",monospace;margin-top:6px;display:inline-block;color:var(--ink-3)}
.ped.s-prep .sello{color:var(--marca-ink)} .ped.s-entr .sello{color:var(--horno-2)}
.ped.s-list .sello{color:var(--ok)}
.items{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--sunken);
  color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.chip.f{background:var(--horno-soft);color:var(--horno-2)}
.chip.regalo{background:var(--ok-soft);color:var(--ok);font-weight:700}
.obs{margin-top:8px;font-size:12.5px;color:var(--ink-2);font-style:italic;
  padding-left:9px;border-left:2px solid var(--line)}
.acciones{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
.tog{font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink-3);background:var(--surface);transition:.15s}
.tog[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini{font-size:12px;color:var(--ink-3);padding:6px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface)}
.del{margin-left:auto;font-size:12px;color:var(--ink-3);padding:6px 9px;border-radius:99px}
.del:hover{background:var(--alerta-soft);color:var(--alerta)}
.confirm{margin-top:10px;padding:11px 12px;background:var(--alerta-soft);border-radius:var(--r-s);
  font-size:13px;color:var(--alerta);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirm b{font-weight:700}
.confirm button{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px}
.confirm .si{background:var(--alerta);color:#fff}
.confirm .no{border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.panelito{margin-top:10px;padding:12px;background:var(--sunken);border-radius:var(--r-s)}

/* ---------- formularios ---------- */
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--sunken);color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:66px;resize:vertical}
input:focus,select:focus,textarea:focus{background:var(--surface)}
.sug{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.sug button{font-size:12.5px;padding:6px 11px;border-radius:99px;background:var(--marca-soft);
  color:var(--marca-ink);font-weight:600}
.seg{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--r-s);
  margin-bottom:11px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:var(--sombra)}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line-2)}
.step:last-of-type{border-bottom:0}
.step .t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.step .p{font-size:11.5px;color:var(--ink-3);font-family:"DM Mono",monospace}
.mas{display:flex;align-items:center;gap:10px}
.mas button{width:34px;height:34px;border-radius:11px;background:var(--sunken);
  font-size:19px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;line-height:1}
.mas .n{min-width:22px;text-align:center;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.mas .cant{width:70px;padding:7px 4px;text-align:center;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--surface)}
.linea{background:var(--sunken);border-radius:var(--r-s);padding:11px;margin-bottom:9px;
  display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.linea .sel{display:grid;grid-template-columns:1fr 98px;gap:6px}
.linea select{background:var(--surface);font-size:14px;padding:9px 4px 9px 10px}
.linea .mas{gap:7px} .linea .mas button{width:30px;height:30px;border-radius:9px;font-size:17px}
.borrar{width:32px;height:32px;border-radius:10px;color:var(--ink-3);font-size:17px;
  display:grid;place-items:center}
.agregar{width:100%;padding:12px;border-radius:var(--r-s);border:1.5px dashed var(--marca-2);
  color:var(--marca-ink);font-weight:700;font-size:14px;background:transparent}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--line-2)}
.sw{width:50px;height:29px;border-radius:99px;background:var(--line);position:relative;
  transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(21px)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:15px 16px;
  background:var(--marca);color:#fff;border-radius:var(--r);margin-bottom:12px}
.total.regalo{background:var(--ok)}
.total .l{font-size:13px;opacity:.88;font-weight:600}
.total .v{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;
  font-variant-numeric:tabular-nums}
.guardar{width:100%;padding:15px;border-radius:var(--r);background:var(--ink);color:var(--ground);
  font-weight:700;font-size:15.5px;box-shadow:var(--sombra)}
.guardar[disabled]{opacity:.4}
.peligro{background:var(--alerta-soft);color:var(--alerta);box-shadow:none}

/* ---------- stock ---------- */
.grupo{padding:13px 16px 7px;font-family:"DM Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--sunken);
  border-bottom:1px solid var(--line-2)}
.st{padding:12px 16px;border-bottom:1px solid var(--line-2)}
.st:last-child{border-bottom:0}
.st .lin{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.st .n{font-weight:600;font-size:14.5px}
.st .q{font-family:"DM Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums}
.st .d{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.st .bar{height:6px;border-radius:99px;background:var(--sunken);margin-top:7px;overflow:hidden}
.st .bar>i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.st.justo .bar>i{background:var(--horno)} .st.falta .bar>i{background:var(--alerta)}
.st.falta .n{color:var(--alerta)}
.st.dormido{opacity:.62}
.st .susp{font-style:normal;font-family:"DM Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3);background:var(--sunken);padding:2px 6px;border-radius:99px;
  margin-left:6px}
.precio{font-family:"DM Mono",monospace;font-size:11.5px;padding:3px 9px;border-radius:99px;
  background:var(--marca-soft);color:var(--marca-ink);font-weight:600}
.precio:hover{background:var(--marca-2);color:#fff}
.edit-precio{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
.edit-precio input{padding:8px 11px;font-size:14px;flex:1;min-width:96px}
.edit-precio button{padding:8px 14px;border-radius:var(--r-s);background:var(--marca);
  color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.busca{position:relative;margin-bottom:10px}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.busca input{padding:12px 40px 12px 40px;border-radius:14px;font-size:15px;background:var(--surface);
  box-shadow:var(--sombra)}
.busca input::-webkit-search-cancel-button{display:none}
.busca button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border-radius:10px;color:var(--ink-3);font-size:18px}
.tanda-sel{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;
  letter-spacing:-.01em;margin:2px 0 11px;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 7px}
.tanda-sel b{color:var(--marca-ink)}
.tanda-sel i{font-style:normal;color:var(--ink-3);font-weight:500}
.tanda-sel span{flex-basis:100%;font-family:"DM Mono",monospace;font-size:11.5px;font-weight:500;
  color:var(--ink-3);letter-spacing:0;margin-top:2px}
.dias.tandas-n button{display:grid;gap:1px;padding:8px 6px;text-transform:none}
.dias.tandas-n button b{font-family:"DM Mono",monospace;font-size:10.5px;font-weight:500;opacity:.75}
.compra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;margin-bottom:11px;
  align-items:center}
.compra select{min-width:0}
.compra .mas{gap:6px}
.compra .mas .cant{width:62px;min-width:0}
.ins-nuevo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ins-nuevo .todo{grid-column:1/-1}
.mov.grupo .s{text-transform:none}
.mov{display:grid;grid-template-columns:1fr auto 30px;gap:9px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
.mov:last-child{border-bottom:0}
.mov .q{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-weight:500}
.mov .q.neg{color:var(--alerta)} .mov .q.pos{color:var(--ok)}
.mov .s{font-size:11px;color:var(--ink-3);font-family:"DM Mono",monospace}

/* ---------- clientes ---------- */
.cli{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.cli:last-child{border-bottom:0}
.ini{width:38px;height:38px;border-radius:12px;background:var(--marca-soft);color:var(--marca-ink);
  display:grid;place-items:center;font-weight:800;font-size:14px;
  font-family:"Bricolage Grotesque",sans-serif}
.cli .n{font-weight:600;font-size:14.5px}
.cli .d{font-size:12px;color:var(--ink-3)}
.cli .hx{display:block;font-family:"DM Mono",monospace;font-size:10.5px;margin-top:2px}
.cli .hx em{color:var(--viejo);font-style:normal;font-weight:600}
.cli .r{font-size:16px;color:var(--ink-3)}
.campos{display:grid;gap:11px}

/* ---------- gráficos ---------- */
.chart{margin-top:4px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--ink-2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:block}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:20px;
  justify-content:flex-start}
.col{flex:1;max-width:54px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;
  position:relative;min-width:0}
.col .pila{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.col .seg-g{background:var(--c-gan);border-radius:4px 4px 0 0;min-height:2px}
.col .seg-c{background:var(--c-cos);border-radius:0 0 4px 4px;min-height:2px}
.col .seg-c.solo{border-radius:4px}
.col .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;

/* Una semana pasada sin pedidos ni nada anotado no tiene por qué ocupar lugar
   en la tira: se esconde, y si además su documento está vacío, se borra. */
function tandaVacia(sem){
  if (S.pedidos.some(p => lunesDe(p.tanda) === sem)) return false;
  const t = S.tandas.find(x => x.id === sem);
  if (!t) return true;
  const ents = entregasDe(sem);
  if (ents.length > 1) return false;
  const e = ents[0] || {};
  const usada = (e.procesos || []).length || (e.horneadas || []).length
    || e.minutos != null || e.salidos || e.kgPreManual != null || e.kgFocManual != null
    || e.bandejasManual != null || e.perdidas || e.kgTirada != null
    || (e.biga && (e.biga.pre || e.biga.foc || e.biga.uni))
    || (e.unica && e.unica.activa);
  return !usada;
}
function semanasVisibles(){
  const base = semanaHoy(), out = [];
  for (let i=-3;i<=4;i++){ const s = suma(base, i*7);
    if (s >= base || !tandaVacia(s)) out.push(s); }
  S.pedidos.forEach(p => { const s = lunesDe(p.tanda); if (out.indexOf(s)<0) out.push(s); });
  S.tandas.forEach(t => { const s = lunesDe(t.id);
    if (out.indexOf(s) < 0 && (s >= base || !tandaVacia(s))) out.push(s); });
  if (out.indexOf(S.semanaSel) < 0 && S.semanaSel) out.push(S.semanaSel);
  return out.sort();
}

function receta(clave){

function clavesOrdenadas(items){
  return Object.keys(items).sort((a,b) => {
    const ia = ORDEN_ING.indexOf(a), ib = ORDEN_ING.indexOf(b);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1;
    if (ib >= 0) return 1;
    return a.localeCompare(b);
  });
}
function masaTotal(clave){
  const r = receta(clave); let t = 0;
  for (const k in r) t += Number(r[k])||0;
  return t;

/* Toda el agua es agua, se llame como se llame: la de ingreso y la del final
   (el bassinage) pesan en la masa pero no cuestan ni salen del stock. */
const esAgua = k => /^agua/i.test(String(k||'').trim());

/* ------------------------------- la biga -------------------------------
   Es parte de la receta, no una masa aparte: un porcentaje de la harina total
   se adelanta el día antes con su propia agua y su levadura, y el amasado del
   día sale de restar eso a la receta completa. Los totales no cambian, así que
   el costo y el stock tampoco. */
const BIGA_BASE = {pct:50, items:{'Harina 00':1000, 'Agua':500, 'Levadura':1}};
function bigaDoc(){ return S.recetas.find(r => r.id === 'biga') || {}; }
function bigaPct(){
  const v = Number(bigaDoc().pct);
  return isNaN(v) || bigaDoc().pct == null || bigaDoc().pct === '' ? BIGA_BASE.pct : v;
}
const bigaItems = () => bigaDoc().items || BIGA_BASE.items;
/* rec va por kilo de harina; kg son los kilos de harina de la tirada */
function desdoblar(rec, kg){
  const B = bigaItems(), kgB = kg * bigaPct()/100;
  const biga = {}, fin = {}, falta = [];
  Object.keys(rec).forEach(k => { fin[k] = (Number(rec[k])||0) * kg; });
  let pesoBiga = 0;
  Object.keys(B).forEach(k => {
    const g = (Number(B[k])||0) * kgB;
    biga[k] = g; pesoBiga += g;
    /* el agua de la biga sale del agua de ingreso: la que se llama Agua a secas,
       o si no existe, la primera agua de la receta */
    let dest = k in fin ? k : null;
    if (!dest && esAgua(k)) dest = Object.keys(fin).filter(esAgua)[0] || null;
    if (!dest){ falta.push(k); return; }
    fin[dest] -= g;
    if (fin[dest] < -0.5) falta.push(dest);
    if (fin[dest] < 0) fin[dest] = 0;
  });
  return {biga, fin, pesoBiga, kgBiga:kgB, falta};
}
const nGr = n => Number(n||0).toLocaleString('es-AR')+' g';
const plu = (n, uno, muchos) => n + ' ' + (n===1 ? uno : muchos);

  : (p.tamano === 'Grande' ? REGLA.grFocGrande : REGLA.grFocMediana);
const rindePre = () => masaTotal('masa_prepizza')/REGLA.grPrepizza;
const rindeMed = () => masaTotal('masa_focaccia')/REGLA.grFocMediana;
const rindeGra = () => masaTotal('masa_focaccia')/REGLA.grFocGrande;
/* en qué bandeja va cada tipo, para contar el lugar de la heladera */
const claseDe = p => p.tipo === 'Prepizza' ? 'pre' : (p.tamano === 'Grande' ? 'gra' : 'med');

/* ---------------------- insumos compuestos ----------------------
   El chimichurri no se compra: se prepara. Tiene su propia receta
   (recetas/ins_<id>: items + rinde) y su propio stock. Al prepararlo se
   descuentan los componentes y se suma lo que salió; su precio por gramo sale
   de la receta, no de una compra. */
const recetaIns = i => {
  const d = i && S.recetas.find(r => r.id === 'ins_' + i.id);
  return d ? {items: d.items || {}, rinde: Number(d.rinde) || 0} : null;
};
const esCompuesto = i => !!recetaIns(i);
const compuestos = () => S.insumos.filter(esCompuesto);
function precioGr(){
  const p = {};
  S.insumos.forEach(i => { if (!esCompuesto(i))
    p[i.nombre] = Number(i.precio_compra)/Number(i.contenido_gr||1); });
  /* dos vueltas, por si un compuesto usa otro compuesto */
  for (let v = 0; v < 2; v++) compuestos().forEach(i => {
    const r = recetaIns(i);
    if (!(r.rinde > 0)) { p[i.nombre] = 0; return; }
    let c = 0;
    for (const k in r.items) if (!esAgua(k)) c += Number(r.items[k]||0) * (p[k] || 0);
    p[i.nombre] = c / r.rinde;
  });
  return p;
}
/* lo que cuesta preparar una receta entera del compuesto */
function costoPrepa(i, pg){
  const r = recetaIns(i); if (!r) return 0;
  let c = 0;
  for (const k in r.items) if (!esAgua(k)) c += Number(r.items[k]||0) * (pg[k] || 0);
  return c;
}
function costoSku(sku, pg){
  const p = S.productos.find(x => x.sku === sku); if (!p) return 0;
  const esPre = p.tipo === 'Prepizza';
  const porKg = esPre ? rindePre() : (p.tamano === 'Grande' ? rindeGra() : rindeMed());
  let c = 0;
  const rec = esPre ? receta('masa_prepizza') : receta('masa_focaccia');
  for (const k in rec) if (!esAgua(k)) c += rec[k]/porKg * (pg[k]||0);
  const pu = receta('por_unidad');
  for (const k in pu) c += pu[k] * (pg[k]||0);
  const env = receta(envaseClave(p));
  for (const k in env) c += env[k] * (pg[k]||0);
  const t = topping(sku);
  for (const k in t) c += t[k] * (pg[k]||0);
  return Math.round(c);
}
const productoDe = sku => S.productos.find(p => p.sku === sku) || {};
const clienteDe = id => S.clientes.find(c => c.id === id);
/* El pedido guarda el nombre del día que se cargó, pero si el cliente sigue
   existiendo manda el nombre de la ficha: lo que corregís se corrige en todos

/* ---------------------- números de una semana ---------------------- */
/* ------------------------- entregas de una semana -------------------------
   Una tanda es una semana. Adentro puede haber una, dos o tres entregas, y cada
   una es un amasado propio: su día, sus kilos, sus bollos y su heladera. */
function entregaLimpia(e){
  e = e || {};
  const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);
  return {dia: Number(e.dia) || 5,
          kgTirada: num(e.kgTirada),
          perdidas: Number(e.perdidas) || 0,
          kgPreManual: num(e.kgPreManual),
          kgFocManual: num(e.kgFocManual),
          bandejasManual: num(e.bandejasManual),
          salidos: e.salidos || null,
          minutos: num(e.minutos),
          biga: {pre: siNo((e.biga||{}).pre), foc: siNo((e.biga||{}).foc),
                 uni: siNo((e.biga||{}).uni)},
          unica: {activa: siNo((e.unica||{}).activa),
                  receta: (e.unica||{}).receta === 'masa_focaccia' ? 'masa_focaccia' : 'masa_prepizza',
                  kgManual: num((e.unica||{}).kgManual)},
          procesos: Array.isArray(e.procesos) ? e.procesos : [],
          horneadas: Array.isArray(e.horneadas) ? e.horneadas : []};
}
function entregasDe(sem){
  const t = tandaDoc(sem);
  if (Array.isArray(t.entregas) && t.entregas.length) return t.entregas.map(entregaLimpia);
  /* las tandas de antes tenían un solo día suelto: esa es su única entrega */
  return [entregaLimpia({dia: t.diaEntrega, kgTirada: t.kg_tirada, perdidas: t.perdidas,
    kgPreManual: t.kgPreManual, kgFocManual: t.kgFocManual,
    bandejasManual: t.bollosManual, minutos: t.minutos})];
}
const cuantasEntregas = sem => entregasDe(sem).length;
function entregaDe(p, tope){
  const i = Math.floor(Number(p.entrega) || 0);
  return Math.max(0, Math.min(i, (tope || 1) - 1));
}
function escribirEntrega(sem, i, campos){
  const l = entregasDe(sem);
  l[i] = entregaLimpia(Object.assign({}, l[i], campos));
  return escribirEntregas(sem, l);
}
/* Se escribe el documento entero: puede que la tanda todavía no exista, y los
   campos sueltos de antes (diaEntrega, kg_tirada) ya no se usan. */
function escribirEntregas(sem, lista){
  const t = tandaDoc(sem);
  return guardar('tandas/'+sem, {semana:sem, estado:t.estado || 'abierta',
    entregas:lista.map(entregaLimpia)});
}

/* ------------------------------- la cuenta ------------------------------- */
const porBandeja = {
  pre: () => Number(REGLA.porBandejaPrepizza) || 6,
  med: () => Number(REGLA.porBandejaMediana)  || 3,
  gra: () => Number(REGLA.porBandejaGrande)   || 1,
};
/* No mezclamos tipos en una misma bandeja: la regla es "hasta tantos de cada". */
const bandejasDe = (pre, med, gra) =>
  Math.ceil(Math.max(0, pre)/porBandeja.pre())
  + Math.ceil(Math.max(0, med)/porBandeja.med())
  + Math.ceil(Math.max(0, gra)/porBandeja.gra());
const bandejasHeladera = () => Number(REGLA.bandejasHeladera) || 12;

function calcular(sem, ent){
  const ents = entregasDe(sem);
  if (ent == null && ents.length > 1) return juntarSemana(sem, ents);
  const idx = ent == null ? 0 : Math.max(0, Math.min(Math.floor(ent), ents.length - 1));
  const E = ents[idx];
  const peds = S.pedidos.filter(p =>
    lunesDe(p.tanda) === sem && entregaDe(p, ents.length) === idx);

  const unidades = {};
  let bruto=0, cobrar=0, costo=0, envios=0, cobrado=0;
  peds.forEach(p => {
    (p.lineas||[]).forEach(l => {
      unidades[l.sku] = (unidades[l.sku]||0) + l.cantidad;
      costo += l.cantidad * l.costoUnit;
    });
    bruto += brutoDe(p); cobrar += totalDe(p);
    if (!p.sinCargo) envios += Number(p.envio||0);
    if (p.cobrado) cobrado += totalDe(p);
  });
  let pre=0, med=0, gra=0;
  Object.keys(unidades).forEach(sku => {
    const p = productoDe(sku);
    if (p.tipo === 'Prepizza') pre += unidades[sku];
    else if (p.tamano === 'Grande') gra += unidades[sku];
    else med += unidades[sku];
  });

  /* los pedidos dan un piso de harina; casi siempre amasamos más que eso,
     así que el número final se puede fijar a mano y todo lo demás lo sigue */
  const U = E.unica || {};
  const gramosPedidos = pre*REGLA.grPrepizza + med*REGLA.grFocMediana + gra*REGLA.grFocGrande;
  /* Masa única: una sola receta para todo, y los bollos se hacen del tamaño que
     haga falta. El piso de harina sale de los gramos que se piden, no de los
     rindes de cada tipo. */
  const kgUniAuto = gramosPedidos ? Math.ceil(gramosPedidos/masaTotal(U.receta || 'masa_prepizza') - 1e-9) : 0;
  const kgUni = U.kgManual != null ? U.kgManual : kgUniAuto;
  const kgPreAuto = U.activa ? (U.receta === 'masa_focaccia' ? 0 : kgUniAuto)
    : (pre ? Math.ceil(pre/rindePre() - 1e-9) : 0);
  const harinaFoc = med/rindeMed() + gra/rindeGra();
  const kgFocAuto = U.activa ? (U.receta === 'masa_focaccia' ? kgUniAuto : 0)
    : (harinaFoc ? Math.ceil(harinaFoc - 1e-9) : 0);
  const kgPre = U.activa ? (U.receta === 'masa_focaccia' ? 0 : kgUni)
    : (E.kgPreManual != null ? E.kgPreManual : kgPreAuto);
  const kgFoc = U.activa ? (U.receta === 'masa_focaccia' ? kgUni : 0)
    : (E.kgFocManual != null ? E.kgFocManual : kgFocAuto);
  const kgTirada = E.kgTirada || REGLA.kgTiradaDefault;
  const perd = E.perdidas;
  const masaUni = U.activa ? kgUni * masaTotal(U.receta || 'masa_prepizza') : 0;
  /* lo que sobra de la masa única se bolla como prepizzas */
  const preDeMas = U.activa
    ? Math.max(0, Math.floor((masaUni - gramosPedidos)/REGLA.grPrepizza + 1e-9)) : 0;
  const salen = U.activa ? pre + preDeMas
    : Math.floor(kgPre * masaTotal('masa_prepizza')/REGLA.grPrepizza + 1e-9);
  const focDeMas = U.activa ? 0 : Math.max(0, Math.floor((kgFoc - harinaFoc)*rindeMed() + 1e-9));

  /* Lo que ocupa la heladera es lo que sale de la masa, no lo que pidieron.
     Y a veces de la masa de prepizza sale alguna focaccia mediana, así que
     cada número se puede corregir a mano. */
  const auto = {pre: salen, med: med + focDeMas, gra: gra};
  const sal = E.salidos || {};
  const salidos = {};
  ['pre','med','gra'].forEach(k => {
    salidos[k] = (sal[k] == null || sal[k] === '' || isNaN(Number(sal[k])))
      ? auto[k] : Number(sal[k]);
  });
  const aMano = ['pre','med','gra'].some(k => salidos[k] !== auto[k]);
  const bandejasAuto = bandejasDe(salidos.pre, salidos.med, salidos.gra);
  const bandejas = E.bandejasManual != null ? E.bandejasManual : bandejasAuto;

  const consumo = {};
  const sumarC = (k,g) => { if (!esAgua(k)) consumo[k] = (consumo[k]||0)+g; };
  const rp = receta('masa_prepizza'), rf = receta('masa_focaccia'), pu = receta('por_unidad');
  for (const k in rp) sumarC(k, rp[k]*kgPre);
  for (const k in rf) sumarC(k, rf[k]*kgFoc);
  const totalUn = Object.keys(unidades).reduce((a,s)=>a+unidades[s],0);
  for (const k in pu) sumarC(k, pu[k]*totalUn);
  Object.keys(unidades).forEach(sku => {
    const t2 = topping(sku);
    for (const k in t2) sumarC(k, t2[k]*unidades[sku]);
    const e2 = envaseDe(sku);
    for (const k in e2) sumarC(k, e2[k]*unidades[sku]);
  });

  /* lo que queda libre para ubicar, después de lo pedido y lo que se perdió */
  const libres = {pre: Math.max(0, salidos.pre - pre - perd),
                  med: Math.max(0, salidos.med - med),
                  gra: Math.max(0, salidos.gra - gra)};
  return {sem, ent:idx, entregas:ents, entrega:E, unaSola:ents.length === 1,
    unica:{activa: !!U.activa, receta: U.receta || 'masa_prepizza', kg: kgUni,
           auto: kgUniAuto, manual: U.kgManual, masa: masaUni, preDeMas}, libres,
    pedidos:peds, unidades, pre, med, gra,
    kgPre, kgFoc, kgTirada, harinaFoc, kgPreAuto, kgFocAuto,
    kgPreManual:E.kgPreManual, kgFocManual:E.kgFocManual,
    salidos, salidosAuto:auto, salidosAMano:aMano,
    bandejas, bandejasAuto, bandejasManual:E.bandejasManual,
    uso: bandejas/bandejasHeladera(), totalUn, cerrada: estaCerrada(peds),
    plata:{bruto, aCobrar:cobrar, bonificado:bruto-cobrar, envios, costo,
           ganancia:cobrar-costo, cobrado, pendiente:cobrar-cobrado},
    sobrantes:{salen, pedidas:pre, sobran:salen-pre, perdidas:perd,
               libres:libres.pre, focDeMas, preDeMas},
    consumo};
}

/* un pedido sin cargo no espera ninguna cobranza */
const saldado = p => p.entregado && (p.cobrado || p.sinCargo);
const estaCerrada = peds => peds.length > 0 && peds.every(saldado);

/* La semana entera, para la tira de arriba y para los pedidos: los números de
   cada entrega sumados. La heladera no se suma, porque cada entrega usa la
   suya: ahí vale la más cargada. */
function juntarSemana(sem, ents){
  const partes = ents.map((e,i) => calcular(sem, i));
  const j = {sem, ent:null, entregas:ents, partes, unaSola:false, pedidos:[],
    unidades:{}, consumo:{}, pre:0, med:0, gra:0, kgPre:0, kgFoc:0, totalUn:0,
    bandejas:0, bandejasAuto:0, bandejasManual:null, kgTirada:REGLA.kgTiradaDefault,
    salidos:{pre:0,med:0,gra:0}, salidosAuto:{pre:0,med:0,gra:0}, salidosAMano:false,
    harinaFoc:0, kgPreAuto:0, kgFocAuto:0, kgPreManual:null, kgFocManual:null,
    plata:{bruto:0, aCobrar:0, bonificado:0, envios:0, costo:0, ganancia:0,
           cobrado:0, pendiente:0},
    sobrantes:{salen:0, pedidas:0, sobran:0, perdidas:0, libres:0, focDeMas:0, preDeMas:0},
    libres:{pre:0, med:0, gra:0},
    unica:{activa:false, receta:'masa_prepizza', kg:0, auto:0, manual:null, masa:0, preDeMas:0},
    uso:0};
  partes.forEach(c => {
    j.pedidos = j.pedidos.concat(c.pedidos);
    ['pre','med','gra','kgPre','kgFoc','totalUn','bandejas','bandejasAuto',
     'harinaFoc','kgPreAuto','kgFocAuto'].forEach(k => j[k] += c[k]);
    ['pre','med','gra'].forEach(k => { j.salidos[k] += c.salidos[k];
                                       j.salidosAuto[k] += c.salidosAuto[k];
                                       j.libres[k] += c.libres[k]; });
    Object.keys(j.plata).forEach(k => j.plata[k] += c.plata[k]);
    Object.keys(j.sobrantes).forEach(k => j.sobrantes[k] += c.sobrantes[k]);
    Object.keys(c.unidades).forEach(k => j.unidades[k] = (j.unidades[k]||0)+c.unidades[k]);
    Object.keys(c.consumo).forEach(k => j.consumo[k] = (j.consumo[k]||0)+c.consumo[k]);
    j.uso = Math.max(j.uso, c.uso);
  });
  j.cerrada = estaCerrada(j.pedidos);
  return j;
}
function repartirKg(kg, tope){
  if (!kg) return [];
  tope = Math.min(tope||REGLA.kgTiradaDefault, REGLA.maxAmasadora);
  const n = Math.ceil(kg/tope), base = Math.floor(kg/n), resto = kg - base*n, out = [];
  for (let i=0;i<n;i++) out.push(i<resto ? base+1 : base);
  return out;
}
/* ------------------- el stock se descuenta solo -------------------
   Cuando llega el día de una entrega, lo que se usó para ella sale del stock.
   Cada entrega deja un movimiento por insumo con un nombre fijo: T, la semana,
   la entrega y el insumo. Si después corregís la tanda, se reescribe el mismo
   movimiento en vez de sumar otro; y si los dos teléfonos lo hacen a la vez,
   escriben lo mismo. Solo cuentan las entregas posteriores a la primera carga
   de stock: lo de antes ya había salido cuando se contó lo que había. */
const esAuto = m => /^T\d{8}-\d-/.test(String(m.id||''));
function stockDesde(){
  const d = S.config.find(c => c.id === 'stock');
  if (d && d.desde) return soloFecha(d.desde);
  const f = S.movimientos.filter(m => m.fecha && !esAuto(m)).map(m => soloFecha(m.fecha)).sort();
  return f[0] || null;
}
function descuentosDebidos(){
  const desde = stockDesde(), hoy = hoyIso(), out = {};
  if (!desde) return out;
  const porNombre = {};
  S.insumos.forEach(i => { porNombre[i.nombre] = i; });
  const sems = {};
  S.tandas.forEach(t => { sems[lunesDe(t.id)] = 1; });
  S.pedidos.forEach(p => { if (p.tanda) sems[lunesDe(p.tanda)] = 1; });
  Object.keys(sems).filter(sem => suma(sem, 7) > desde).forEach(sem => {
    entregasDe(sem).forEach((e, i) => {
      const f = fechaEntrega(sem, i);
      if (!(f > desde) || f > hoy) return;
      const c = calcular(sem, i);
      Object.keys(c.consumo).forEach(k => {
        const ins = porNombre[k], g = Math.round(c.consumo[k]);
        if (!ins || !g) return;
        out['T'+sem.replace(/-/g,'')+'-'+i+'-'+ins.id] =
          {insumo:k, gramos:-g, origen:'tanda '+rotuloEntrega(sem, i), fecha:f};
      });
    });
  });
  return out;
}
function descontarSolo(){
  if (!S.listo || !S.insumos.length || (!API.activo && !DB)) return;
  const desde = stockDesde();
  if (!desde) return;
  const ops = [];
  /* la fecha de arranque se anota una vez, para que no se corra si algún día
     se borra la primera compra */
  if (!S.config.find(c => c.id === 'stock')) ops.push({op:'set', ruta:'config/stock', datos:{desde}});
  const deb = descuentosDebidos();
  Object.keys(deb).forEach(id => {
    const m = S.movimientos.find(x => x.id === id), d = deb[id];
    if (!m || Math.round(Number(m.gramos)) !== d.gramos || m.insumo !== d.insumo
        || m.origen !== d.origen || soloFecha(m.fecha) !== d.fecha)
      ops.push({op:'set', ruta:'movimientos/'+id, datos:d});
  });
  S.movimientos.filter(esAuto).forEach(m => {
    if (!deb[m.id]) ops.push({op:'delete', ruta:'movimientos/'+m.id});
  });
  if (ops.length) escribirVarias(ops);
}
let _descuento = null;
function programarDescuento(){
  clearTimeout(_descuento);
  _descuento = setTimeout(() => { descontarSolo(); limpiarTandas(); }, 700);
}
const stockDe = nombre =>
  S.movimientos.reduce((a,m)=> a + (m.insumo===nombre ? Number(m.gramos)||0 : 0), 0);

/* los insumos del amasado primero: son los que más se mueven */
const GRUPOS = ['De las masas','Por unidad horneada','Toppings y otros'];
function ordenDeMasa(){
  const peso = {};
  [receta('masa_prepizza'), receta('masa_focaccia')].forEach(r =>
    Object.keys(r).forEach(k => { if (!esAgua(k)) peso[k] = (peso[k]||0) + r[k]; }));
  return Object.keys(peso).sort((a,b) => peso[b]-peso[a]);
}
function insumosOrdenados(){
  const masa = ordenDeMasa();
  const pu = Object.keys(receta('por_unidad')).concat(
    Object.keys(ENVASE_BASE).reduce((a,k) => a.concat(Object.keys(receta(k))), []));
  const grupo = n => masa.indexOf(n)>=0 ? 0 : pu.indexOf(n)>=0 ? 1 : 2;
  return S.insumos.filter(i => ui.verSuspendidos || !siNo(i.suspendido)).sort((a,b) => {
    const ga = grupo(a.nombre), gb = grupo(b.nombre);
    if (ga !== gb) return ga - gb;
    if (ga === 0) return masa.indexOf(a.nombre) - masa.indexOf(b.nombre);
    if (ga === 1) return pu.indexOf(a.nombre) - pu.indexOf(b.nombre);
    return a.nombre.localeCompare(b.nombre);
  }).map(i => Object.assign({__g:grupo(i.nombre)}, i));
}

/* ================================ persistencia ================================
   El panel corre en dos casas: dentro de Claude (capacidad db) o servido por
   Apps Script desde el Drive de Agus. Todo lo de abajo es lo único que cambia. */
const COLS = ['productos','insumos','clientes','tandas','pedidos','movimientos',
              'recetas','config','notas','finanzas'];
const API = {activo:false, base:'', pin:'', pidePin:false, version:0, cola:[],
             apartados:[], enviando:false, cargando:false, falla:0, motivo:'', via:''};
const guardaLocal = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leeLocal = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const guardaCola = () => guardaLocal('vl_cola', JSON.stringify(API.cola));

/* Le hablamos al servidor por HTTP común. El POST va como texto plano a
   propósito: así el navegador no pide permiso previo y Apps Script contesta. */
async function pedir(params){
  const partes = [];
  for (const k in params) partes.push(k + '=' + encodeURIComponent(params[k]));
  const res = await fetch(API.base + '?' + partes.join('&'), {method:'GET'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function porPost(cuerpo){
  const res = await fetch(API.base, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(cuerpo),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
/* La dirección tiene un largo máximo, así que partimos el lote en tandas
   que entren cómodas. */
function enGrupos(ops){
  const largo = a => encodeURIComponent(JSON.stringify(a)).length;
  const out = []; let g = [];
  ops.forEach(o => {
    if (g.length && largo(g.concat([o])) > 6000){ out.push(g); g = []; }
    g.push(o);
  });
  if (g.length) out.push(g);
  return out;
}
async function porGet(cuerpo){
  let ultima = {ok:true, version:API.version, hechas:0};
  const grupos = enGrupos(cuerpo.ops || []);
  for (let i = 0; i < grupos.length; i++){
    const r = await pedir({r:'escribir', pin:cuerpo.pin, ops:JSON.stringify(grupos[i])});
    if (!r.ok) return r;
    ultima = r;
  }
  return ultima;
}
/* Guardar por POST es lo prolijo, pero algunos teléfonos no lo dejan salir.
   Si falla, mandamos lo mismo por la vía de la lectura, que sabemos que anda,
   y nos quedamos ahí. Repetir una orden no hace daño: cada una dice cómo tiene
   que quedar el dato, no "sumale uno". */
async function mandar(cuerpo){
  if (API.via === 'get') return porGet(cuerpo);
  let fallo = '';
  try {
    const r = await porPost(cuerpo);
    if (r && r.ok){ API.via = 'post'; guardaLocal('vl_via','post'); return r; }
    /* el servidor contestó y dijo que no: llegó bien, así que por la otra vía
       diría lo mismo. Solo probamos la dirección si el POST ni siquiera salió. */
    if (r && typeof r.ok === 'boolean'){ API.via = 'post'; guardaLocal('vl_via','post'); return r; }
    fallo = 'POST: sin respuesta';
  } catch(e){
    fallo = 'POST: ' + String((e && e.message) || e).slice(0, 90);
  }
  const r2 = await porGet(cuerpo);
  if (r2 && r2.ok){ API.via = 'get'; guardaLocal('vl_via','get'); API.motivo = fallo; }
  return r2;
}

/* La última foto de los datos queda en el teléfono. Al abrir, la app se dibuja
   con eso al instante y recién después sale a buscar lo nuevo: no hay pantalla
   en blanco esperando a Google. */
function guardarFoto(){
  try { guardaLocal('vl_datos', JSON.stringify({
    version: API.version, cuando: Date.now(),
    datos: COLS.reduce((a,k) => { a[k] = S[k]; return a; }, {}),
  })); } catch(e){}
}
function usarFoto(){
  let c = null;
  try { c = JSON.parse(leeLocal('vl_datos') || 'null'); } catch(e){ return false; }
  if (!c || !c.datos || !c.datos.productos) return false;
  COLS.forEach(k => { S[k] = c.datos[k] || []; });
  API.version = Number(c.version) || 0;
  normalizarDatos();
  refrescarReglas();
  API.cola.forEach(o => aplicarLocal(o.op, o.ruta, o.datos));
  S.listo = true; S.deGuardado = true; S.error = '';
  return true;
}

async function conectar(){
  const base = (typeof window.__VL_BASE === 'string' &&
                window.__VL_BASE.indexOf('http') === 0) ? window.__VL_BASE : '';
  if (base){ API.base = base; return conectarApps(); }
  try { DB = await claude.use('db'); } catch(e){ DB = null; }
  if (!DB){ S.error = 'sin-db'; render(); return; }
  const col = (nombre, destino, alLlegar) => DB.collection(nombre).onSnapshot(
    snap => { S[destino] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
              if (alLlegar) alLlegar();
              S.listo = true; render(); },
    () => { S.error = 'sin-db'; render(); });
  col('productos','productos');
  col('insumos','insumos');
  col('clientes','clientes');
  col('tandas','tandas');
  col('pedidos','pedidos');
  col('movimientos','movimientos');
  col('recetas','recetas', () => { sembrarRecetas(); migrarEnvases(); });
  col('config','config', sembrarConfig);
}

/* Apps Script dibuja la página a 980 px de ancho y después la encoge al ancho
   real del teléfono. Adentro no puedo tocar eso, así que agrando la app en la
   misma proporción: queda del tamaño que corresponde y ocupando todo el ancho. */
function ajustarEscala(){
  if (!API.activo) return;
  const raiz = document.documentElement;
  const pantalla = (window.screen && window.screen.width) || window.innerWidth;
  const z = pantalla ? window.innerWidth / pantalla : 1;
  if (z > 1.15 && z < 6){
    raiz.style.zoom = z;
    raiz.dataset.escala = z.toFixed(2);
  } else {
    raiz.style.zoom = '';
    delete raiz.dataset.escala;
  }
}

/* ---------------------- casa propia: Apps Script ---------------------- */
function conectarApps(){
  API.activo = true;
  API.pidePin = window.__VL_PIN === '1';
  API.pin = leeLocal('vl_pin') || '';
  try { API.cola = JSON.parse(leeLocal('vl_cola') || '[]') || []; } catch(e){ API.cola = []; }
  try { API.apartados = JSON.parse(leeLocal('vl_apartados') || '[]') || []; } catch(e){ API.apartados = []; }
  /* cada apertura les da otra oportunidad, al final de la fila */
  if (API.apartados.length){
    API.apartados.forEach(a => API.cola.push({op:a.op, ruta:a.ruta, datos:a.datos}));
    API.apartados = []; guardaApartados(); guardaCola();
  }
  API.via = leeLocal('vl_via') || '';
  ajustarEscala();
  window.addEventListener('resize', ajustarEscala);
  window.addEventListener('orientationchange', () => setTimeout(ajustarEscala, 300));
  setInterval(mirarVersion, 25000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden){ mirarVersion(); vaciarCola(); } });
  window.addEventListener('online', () => { API.falla = 0; vaciarCola(); });
  pintarConex();
  const punto = document.getElementById('conex');
  if (punto){ punto.style.cursor = 'pointer'; punto.onclick = hojaConexion; }
  if (API.pidePin && !API.pin) return pantallaPin(false);
  if (usarFoto()){ recordarPantalla(); render(); }
  cargarTodo();
}

async function cargarTodo(){
  if (API.cargando) return;
  API.cargando = true; pintarConex();
  try {
    const r = await pedir({r:'todo', pin:API.pin});
    if (!r.ok){
      if (r.error === 'pin'){ API.pin = ''; guardaLocal('vl_pin',''); return pantallaPin(true); }
      throw new Error(r.error || 'no pude leer');
    }
    API.version = r.version;
    COLS.forEach(c => { S[c] = r.datos[c] || []; });
    /* si el servidor todavía no conoce las finanzas, la pantalla lo avisa en
       vez de dejar los gastos colgados en la cola */
    API.sinFinanzas = !(r.datos && Object.prototype.hasOwnProperty.call(r.datos, 'finanzas'));
    normalizarDatos();
    S.deGuardado = false;
    /* lo que todavía no llegó al servidor lo volvemos a pintar encima:
       así no parece que se perdió */
    API.cola.forEach(o => aplicarLocal(o.op, o.ruta, o.datos));
    S.listo = true; S.error = ''; API.falla = 0;
    sembrarRecetas(); sembrarConfig(); migrarEnvases();
    guardarFoto();
    render();
  } catch(e){
    API.falla++;
    API.motivo = String((e && e.message) || e || '').slice(0, 160);
    if (!S.listo) S.error = 'sin-db';
    render();
  } finally {
    API.cargando = false; pintarConex();
    if (API.cola.length) vaciarCola();
  }
}

async function mirarVersion(){
  if (!API.activo || !S.listo || API.cola.length || API.cargando || document.hidden) return;
  try {
    const r = await pedir({r:'version', pin:API.pin});
    if (r.ok && r.version !== API.version) cargarTodo();
  } catch(e){}
}

/* Lo que llega de la planilla no siempre tiene la forma que le dimos: una fecha
   puede volver con hora pegada y un sí/no puede volver como la palabra "false",
   que para el navegador es texto con letras y por lo tanto un sí. Acá se
   empareja todo antes de que lo use nadie. */
const siNo = v => v === true || v === 1 || v === '1'
  || v === 'true' || v === 'TRUE' || v === 'VERDADERO';
const BANDERAS = ['preparado', 'entregado', 'cobrado', 'sinCargo'];
function normalizarDatos(){
  S.pedidos.forEach(p => {
    if (p.tanda) p.tanda = soloFecha(p.tanda);
    BANDERAS.forEach(k => { p[k] = siNo(p[k]); });
  });
  S.tandas.forEach(t => { t.id = soloFecha(t.id); });
  S.movimientos.forEach(m => { if (m.fecha) m.fecha = soloFecha(m.fecha); });
}

const partes = ruta => { const i = ruta.indexOf('/');
  return [ruta.slice(0,i), ruta.slice(i+1)]; };

function aplicarLocal(op, ruta, datos){
  const p = partes(ruta), lista = S[p[0]];
  if (!lista) return;
  let i = -1;
  for (let k=0;k<lista.length;k++) if (lista[k].id === p[1]) { i = k; break; }
  if (op === 'delete'){ if (i >= 0) lista.splice(i,1); return; }
  const base = (op === 'update' && i >= 0) ? Object.assign({}, lista[i]) : {};
  Object.assign(base, datos || {});
  base.id = p[1];
  if (i >= 0) lista[i] = base; else lista.push(base);
  if (p[0] === 'config') refrescarReglas();
}

/* Lo que el servidor rechaza no se tira: queda apartado, se ve en la ficha de
   conexión y se vuelve a probar en la próxima apertura. Pero sale de la cola,
   para no trabar a los demás. Así pasó el 21/9: una nota que el servidor viejo
   no conocía dejó atrapados todos los cambios de pedidos que venían atrás. */
const guardaApartados = () => guardaLocal('vl_apartados', JSON.stringify(API.apartados));
function apartar(o, error){
  API.apartados.push({op:o.op, ruta:o.ruta, datos:o.datos, error:String(error||'rechazada'),
                      cuando:Date.now()});
  guardaApartados();
  API.motivo = 'No se pudo guardar ' + o.ruta.split('/')[0] + ': ' + error;
}
const aOp = o => { const p = partes(o.ruta); return {op:o.op, col:p[0], id:p[1], datos:o.datos}; };
function sacarDeCola(o){ const k = API.cola.indexOf(o); if (k >= 0) API.cola.splice(k, 1); }

/* El servidor viejo corta el lote entero en la primera que no puede. Si pasa,
   las mandamos de a una: las buenas entran y la mala queda apartada. */
async function deAUna(lote){
  for (let i = 0; i < lote.length; i++){
    const o = lote[i];
    const r = await mandar({pin:API.pin, ops:[aOp(o)]});
    if (r && r.error === 'pin') throw new Error('pin');
    if (r && r.ok){
      API.version = r.version;
      if (r.rechazadas && r.rechazadas.length) apartar(o, r.rechazadas[0].error);
    } else apartar(o, (r && r.error) || 'rechazada');
    sacarDeCola(o); guardaCola();
  }
}

/* Si tocaste lo mismo varias veces antes de que se guarde (una lista que vas
   escribiendo, un pedido que corregís), viaja una sola vez con lo último. */
function compactarCola(){
  const out = [];
  API.cola.forEach(o => {
    let j = -1;
    for (let k = out.length - 1; k >= 0; k--) if (out[k].ruta === o.ruta){ j = k; break; }
    if (j < 0) return out.push(o);
    const a = out[j];
    let m;
    if (o.op === 'set' || o.op === 'delete') m = o;
    else if (a.op === 'set') m = {op:'set', ruta:o.ruta, datos:Object.assign({}, a.datos, o.datos)};
    else if (a.op === 'update') m = {op:'update', ruta:o.ruta, datos:Object.assign({}, a.datos, o.datos)};
    else return out.push(o);
    out.splice(j, 1); out.push(m);
  });
  if (out.length !== API.cola.length){ API.cola = out; guardaCola(); }
}
async function vaciarCola(){
  if (!API.activo || API.enviando || !API.cola.length) return;
  compactarCola();
  API.enviando = true; pintarConex();
  const lote = API.cola.slice(0, 40);
  try {
    const r = await mandar({pin:API.pin, ops:lote.map(aOp)});
    if (r && r.ok){
      /* el servidor nuevo aplica cada una por su cuenta y dice cuáles no pudo */
      (r.rechazadas || []).forEach(x => { if (lote[x.i]) apartar(lote[x.i], x.error); });
      lote.forEach(sacarDeCola); guardaCola();
      API.version = r.version; API.falla = 0;
    } else if (r && r.error && r.error !== 'pin'){
      await deAUna(lote);
      API.falla = 0;
    } else {
      throw new Error((r && r.error) || 'no pude guardar');
    }
  } catch(e){
    API.falla++;
    API.motivo = String((e && e.message) || e || '').slice(0, 160);
  } finally {
    API.enviando = false; pintarConex();
    if (API.cola.length){
      if (API.falla) setTimeout(vaciarCola, Math.min(15000, 2500*API.falla));
      else vaciarCola();
    }
  }
}

function pintarConex(){
  const e = document.getElementById('conex');
  if (!e) return;
  e.hidden = !API.activo;
  if (!API.activo) return;
  const n = API.cola.length, ap = API.apartados.length;
  e.className = 'conex' + ((API.falla || ap) ? ' mal' : (n || API.cargando) ? ' yendo' : '');
  e.textContent = API.falla
      ? (n ? n + (n===1?' cambio sin guardar':' cambios sin guardar') : 'sin conexión')
      : ap ? plu(ap, 'cambio rechazado', 'cambios rechazados')
      : n ? 'guardando…' : '';
}

    API.apartados.forEach(a => API.cola.push({op:a.op, ruta:a.ruta, datos:a.datos}));
    API.apartados = []; guardaApartados(); guardaCola();
    API.falla = 0; API.motivo = ''; f.remove(); pintarConex(); vaciarCola();
  };
  const desc = f.querySelector('#cx-desc');
  if (desc) desc.onclick = () => {
    API.apartados = []; guardaApartados(); API.motivo = '';
    f.remove(); pintarConex(); toast('Descartados');
  };
  f.querySelector('#cx-probar').onclick = async () => {
    const b = f.querySelector('#cx-probar');

    const prueba = {pin:API.pin, ops:[{op:'set', col:'config', id:'_prueba',
      datos:{valores:{cuando:new Date().toISOString()}}}]};
    let dice = '';
    const t0 = Date.now();
    try { const r = await porPost(prueba); dice = r && r.ok ? 'directa: anda' : 'directa: ' + ((r&&r.error)||'no'); }
    catch(e){ dice = 'directa: ' + String((e && e.message) || e).slice(0,70); }
    const unSolo = Date.now() - t0;
    try { const r = await porGet(prueba); dice += ' · por dirección: ' + (r && r.ok ? 'anda' : ((r&&r.error)||'no')); }
    catch(e){ dice += ' · por dirección: ' + String((e && e.message) || e).slice(0,70); }
    /* cinco cambios juntos: con el servidor viejo cada uno suma un segundo,
       con el nuevo tardan casi lo mismo que uno solo */
    const t1 = Date.now();
    try {
      await porPost({pin:API.pin, ops:[1,2,3,4,5].map(n => ({op:'set', col:'config',
        id:'_prueba', datos:{valores:{cuando:new Date().toISOString(), n}}}))});

    const cinco = Date.now() - t1;
    dice += ' · uno ' + (unSolo/1000).toFixed(1).replace('.',',') + ' s, cinco '
      + (cinco/1000).toFixed(1).replace('.',',') + ' s'
      + (cinco < unSolo*2 ? ' · servidor rápido' : ' · servidor viejo: conviene actualizarlo')
      + ' · finanzas: ' + (API.sinFinanzas ? 'FALTA actualizar el servidor' : 'ok');
    /* no dejamos basura en la planilla */
    try { await porGet({pin:API.pin, ops:[{op:'delete', col:'config', id:'_prueba'}]}); } catch(e){}
    b.disabled = false; b.textContent = 'Probar de nuevo';
    const av = document.createElement('div');
    av.className = 'aviso'; av.style.marginTop = '12px'; av.textContent = dice;
    b.parentNode.insertBefore(av, b);
  };
}

/* ---------------------- lo que usa todo el panel ---------------------- */
function escribir(op, ruta, datos){
  if (!API.activo){
    if (!DB) return Promise.resolve();
    const d = DB.doc(ruta);
    return op === 'set' ? d.set(datos) : op === 'update' ? d.update(datos) : d.delete();
  }
  aplicarLocal(op, ruta, datos);
  API.cola.push({op, ruta, datos}); guardaCola();
  render(); vaciarCola();
  return Promise.resolve();
}
/* Varios cambios de una: se dibuja una sola vez y viajan en el mismo envío. */
async function escribirVarias(ops){
  if (!ops.length) return;
  if (!API.activo){
    if (!DB) return;
    for (const o of ops){
      const d = DB.doc(o.ruta);
      await (o.op === 'set' ? d.set(o.datos) : o.op === 'update' ? d.update(o.datos) : d.delete());
    }
    return;
  }
  ops.forEach(o => { aplicarLocal(o.op, o.ruta, o.datos); API.cola.push({op:o.op, ruta:o.ruta, datos:o.datos}); });
  guardaCola(); render(); vaciarCola();
}
const guardar = (ruta, datos) => escribir('set', ruta, datos);
const parchar = (ruta, datos) => escribir('update', ruta, datos);
const borrar  = ruta => escribir('delete', ruta);
const nuevoId = pref => pref + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function sembrarRecetas(){
  if (S.sembrado.recetas || !S.productos.length) return;
  if (S.recetas.length) { S.sembrado.recetas = true; return; }
  S.sembrado.recetas = true;
  Object.keys(MASA_BASE).forEach(k => guardar('recetas/'+k, {items:MASA_BASE[k]}));
  Object.keys(ENVASE_BASE).forEach(k => guardar('recetas/'+k, {items:ENVASE_BASE[k]}));
  Object.keys(TOP_BASE).forEach(k => guardar('recetas/top_'+k, {items:TOP_BASE[k]}));
}

/* Antes el envase era uno solo para todo. Ahora cada tipo lleva el suyo, así que
   hay que separar lo que ya estaba cargado. Se hace una sola vez y queda anotado
   para no repetirlo. */
function migrarEnvases(){
  if (S.sembrado.envases || !S.recetas.length || !S.insumos.length) return;
  const hecho = S.config.find(c => c.id === 'migraciones');
  if (hecho && hecho.envases) { S.sembrado.envases = true; return; }
  S.sembrado.envases = true;

  const VIEJA = 'Bolsa polipropileno', NUEVA = 'Bolsa polipropileno 35x45';
  /* la bolsa que ya existía es la grande: le ponemos el nombre completo */
  const bolsa = S.insumos.find(i => i.nombre === VIEJA);
  if (bolsa) parchar('insumos/'+bolsa.id, {nombre:NUEVA});
  S.movimientos.forEach(m => {
    if (m.insumo === VIEJA) parchar('movimientos/'+m.id, {insumo:NUEVA});
  });
  INSUMOS_NUEVOS.forEach(i => {
    if (!S.insumos.some(x => x.nombre === i.nombre)){
      const datos = Object.assign({}, i); delete datos.id;
      guardar('insumos/'+i.id, datos);
    }
  });
  Object.keys(ENVASE_BASE).forEach(k => {
    if (!S.recetas.some(r => r.id === k)) guardar('recetas/'+k, {items:ENVASE_BASE[k]});
  });
  /* del "por unidad" salen los envases: ahí queda el gas y la etiqueta */
  const pu = Object.assign({}, receta('por_unidad'));
  let toco = false;
  [VIEJA, NUEVA, 'Bandeja de cartón'].forEach(k => {
    if (pu[k] !== undefined){ delete pu[k]; toco = true; }
  });
  if (toco) guardar('recetas/por_unidad', {items:pu});
  guardar('config/migraciones', Object.assign({}, hecho || {}, {envases:true}));
}
/* Las reglas vuelven a leerse cada vez que cambian, sin esperar a que el
   servidor conteste: si tocás un gramaje, el número de al lado cambia solo. */
function refrescarReglas(){
  const doc = S.config.find(c => c.id === 'reglas');
  if (doc) REGLA = Object.assign({}, REGLA_BASE, doc.valores || {});
}
function sembrarConfig(){
  if (!S.config.find(c => c.id === 'pasos') && !S.sembrado.pasos){
    S.sembrado.pasos = true;
    guardarPasos(PASOS_BASE);
  }
  const doc = S.config.find(c => c.id === 'reglas');
  if (doc) { refrescarReglas(); return; }
  if (S.sembrado.config) return;
  S.sembrado.config = true;
  guardar('config/reglas', {valores:REGLA_BASE});
}
